// ---------------------------------------------------------------- dialogs (no browser pop-ups)
// openModal(md, onEscape, first): put a ".modal" element on the page and move the focus into it (first, or its first
// control), remembering what had the focus. Returns close(), which removes it and gives the focus back. While a modal
// is open, the document keydown handler (below) keeps Tab inside the topmost one and sends Escape to its onEscape.
const FOCUSABLE = "button,input,select,textarea,a[href],[tabindex='0']";
function openModal(md, onEscape, first){
  const back = document.activeElement;
  document.body.appendChild(md); md.onEscape = onEscape;
  const f = first || [...md.querySelectorAll(FOCUSABLE)].find(x => !x.disabled); if (f) f.focus();
  return () => { md.remove(); if (back && back.isConnected) back.focus(); };
}
// dialog({title, html, ok, danger, input, check, cancel}) -> Promise: true (or the typed text when input is given)
// on OK, null on Cancel / Escape. html is inserted as it is, so callers escape any data in it. check = a tick
// box that must be ticked before OK works; cancel: null gives a message box with only OK. The focus starts in the
// text box or the tick box, else on Cancel when OK is dangerous, else on OK.
function dialog({title, html = "", ok = "OK", danger = false, input = null, check = null, cancel = "Cancel"}){
  return new Promise(res => {
    const md = h(`<div class="modal"><div class="box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="bh"><b>${esc(title)}</b></div>
      <div class="bb small">${html}${input ? `<input type="text" class="wide" id="dlgIn" value="${esc(input.value||"")}" placeholder="${esc(input.placeholder||"")}" style="margin-top:8px">` : ""}
      ${check ? `<label class="row small" style="margin-top:10px"><input type="checkbox" id="dlgChk"> ${esc(check)}</label>` : ""}</div>
      <div class="bf row"><span class="grow"></span>${cancel ? `<button class="btn" id="dlgNo">${esc(cancel)}</button>` : ""}<button class="btn ${danger?"danger":"primary"}" id="dlgOk">${esc(ok)}</button></div></div></div>`);
    const okb = $("#dlgOk", md), chk = $("#dlgChk", md), inp = $("#dlgIn", md), no = $("#dlgNo", md);
    if (chk){ okb.disabled = true; chk.onchange = () => okb.disabled = !chk.checked; }
    const close = openModal(md, () => done(cancel ? null : true), inp || chk || (danger && no) || okb);
    if (inp){ inp.select(); inp.onkeydown = e => { if (e.key === "Enter") okb.click(); }; }
    function done(v){ close(); res(v); }
    okb.onclick = () => done(inp ? inp.value : true);
    if (no) no.onclick = () => done(null);
  });
}
async function apiRaw(path, opts = {}){   // like api() but keeps the body of an error reply

  return {ok: r.ok, status: r.status, body};
}

function iconHtml(ic, big){
  if (!ic || !ic.found) return `<span class="icon-none" title="${esc((ic && (ic.note || (ic.missing||[]).join(", "))) || "no icon")}">·</span>`;
  const shown = ic.layers.filter(l => l.png);

  return `<span class="icon-stack ${big ? "big" : ""}" title="${esc(ic.layers.map(l => l.name).join(" + ") + (ic.note ? " - " + ic.note : "") + (ic.missing.length ? " (missing: " + ic.missing.join(", ") + ")" : ""))}">${shown.map(l => `<img src="${l.png}" alt="">`).join("")}</span>`;

// Fill every [data-icon] slot in host. Icons not yet in S.icons are fetched from /api/icons, 200 nodes a call;

async function fillIcons(host){
  if (STATIC || !S.cur) return;
  const slots = [...host.querySelectorAll("[data-icon]")]; if (!slots.length) return;
  const need = [...new Set(slots.map(x => x.dataset.icon).filter(nd => !(nd in S.icons)))];
  for (let i = 0; i < need.length; i += 200){
    try { Object.assign(S.icons, await post("/api/icons", {a: S.cur, nodes: need.slice(i, i + 200)})); } catch(e){ need.slice(i, i + 200).forEach(nd => S.icons[nd] = null); }

}

  // builds

    {key: "verified", label: "Verified", render: b => b.verified ? stBadge("PASS") : stBadge("FAIL")},

    const ok = await dialog({title: `Add ${nn} to the hak folder`, ok: "Add (new name)", html:
      `<p><span class="mono">${esc(nn)}</span> is copied into the folder of <span class="mono">${esc(P.source)}</span> under its <b>new name</b>. The original hak is not touched, and if a file with that name already exists nothing is written.</p>
       ${P.analysis ? `<p>The module of <b>${esc(P.analysis)}</b> is then pointed at the new name: an edit of <span class="mono">module.ifo</span> (see <i>My edits</i>, undo there). Your next <b>Build &amp; audit</b> makes a clean module that uses it; players and your server need the new hak file.</p>` : `<p><b>No module analysis is linked</b> to this project, so the module is not changed: pick one above, or change the module's hak list in the toolset.</p>`}
       <p>This project then continues from the new hak (the next rebuild becomes the next free name).</p>`});
    if (!ok) return;
    const r = await hakDo("install", {build: b.dataset.inst}, "Adding…");
    if (r){ await hakProject(m); dialog({title: "Added", cancel: null, html: `<p>Added <span class="mono">${esc(r.installed)}</span>. The original <span class="mono">${esc(r.previous)}</span> is unchanged.</p>${r.module ? `<p>Module of <b>${esc(r.module.analysis)}</b>: hak list now says <span class="mono">${esc(r.module.new)}</span> instead of <span class="mono">${esc(r.module.old)}</span> (module.ifo ${esc(r.module.module_ifo)} in My edits). Build &amp; audit to make a module that uses it.</p>` : r.module_error ? `<p class="warn">The module was not changed: ${esc(r.module_error)}</p>` : ""}`}); } };

  // file table
  const tbl = new Table($("#hkFiles", m), {rows: [], pageSize: 100, onRow: r => hakView(r.name), columns: [
    {key: "sel", label: "", render: r => `<input type="checkbox" data-sel="${esc(r.name)}" ${S.hak.sel.has(r.name)?"checked":""} aria-label="select ${esc(r.name)}">`},
    {key: "name", label: "File", render: r => `<span class="mono">${esc(r.name)}</span>`},
    {key: "kind", label: "Type"}, {key: "size", label: "Size", num: true, render: r => fmtBytes(r.size)},
    {key: "change", label: "Change", render: r => r.change ? stBadge(r.change) : ""},
    {key: "used", label: "Module uses it", render: r => r.used === true ? "yes" : r.used === false ? "no" : `<span class="muted">?</span>`},
    {key: "hidden_by", label: "Hidden by", render: r => r.hidden_by ? esc(r.hidden_by) : ""},
    {key: "x", label: "", render: r => `${r.ext === "2da" ? `<button class="btn small" data-a="2da" data-n="${esc(r.name)}">Edit 2da</button>` : ""}<button class="btn small" data-a="rep" data-n="${esc(r.name)}">Replace…</button><button class="btn small" data-a="ren" data-n="${esc(r.name)}">Rename…</button>${r.change ? `<button class="btn small" data-a="undo" data-n="${esc(r.name)}">Undo</button>` : `<button class="btn small danger" data-a="rem" data-n="${esc(r.name)}">Remove</button>`}`}]});
  // rows that match the search, type and status filters (kept in S.hak.filt across redraws)
  const shown = () => { const f = S.hak.filt, q = f.q.toLowerCase();
    return st.entries.filter(r => (!q || r.name.includes(q)) && (!f.kind || r.kind === f.kind) &&
      (!f.status || (f.status === "changed" && r.change) || (f.status === "used" && r.used === true) || (f.status === "unused" && r.used === false) || (f.status === "hidden" && r.hidden_by))); };
  const selN = () => $("#hkSelN", m).textContent = S.hak.sel.size ? `${fmtN(S.hak.sel.size)} selected` : "";
  const draw = () => { tbl.set(shown()); selN(); };
  draw();

      await hakDo("remove", {names: [...S.hak.sel]}); S.hak.sel.clear(); hakProject(m); } };
  $("#hkUndoSel", m).onclick = async () => { if (!S.hak.sel.size) return; await hakDo("undo", {names: [...S.hak.sel]}); S.hak.sel.clear(); hakProject(m); };
  $("#hkExtSel", m).onclick = () => S.hak.sel.size && hakExtract([...S.hak.sel]);
  $("#hkFiles", m).addEventListener("change", e => { const c = e.target.closest("[data-sel]"); if (!c) return; c.checked ? S.hak.sel.add(c.dataset.sel) : S.hak.sel.delete(c.dataset.sel); selN(); });

    const nm = b.dataset.n;

    if (b.dataset.a === "rem"){ await hakDo("remove", {names: [nm]}); return hakProject(m); }
    if (b.dataset.a === "undo"){ await hakDo("undo", {names: [nm]}); return hakProject(m); }
    if (b.dataset.a === "ren"){ const nn = await dialog({title: `Rename ${nm}`, html: "New name (same file type, at most 16 characters before the dot; letters, digits, _ and -):", input: {value: nm}, ok: "Rename"});
      if (nn && nn !== nm){ await hakDo("rename", {old: nm, new: nn}); hakProject(m); } return; }
    if (b.dataset.a === "rep"){ const files = await pickFiles(false); if (!files.length) return;
      if (files[0].name.split(".").pop().toLowerCase() !== nm.split(".").pop()){ errorBox(`Pick a .${nm.split(".").pop()} file to replace ${nm}.`); return; }
      await hakUpload(files, nm); hakProject(m); } });
}
// Upload files one at a time as raw bytes (/api/hak/upload); asName = the file they replace. Failures are
// collected and shown together by hakReport instead of stopping the upload.
async function hakUpload(files, asName){
  const el = $("#hkMsg2"); const res = {added: [], replaced: [], skipped: []};
  for (let i = 0; i < files.length; i++){
    const f = files[i], nm = asName || f.name;
    if (el) el.textContent = `Adding ${i + 1} of ${files.length}: ${f.name}…`;
    const r = await apiRaw(`/api/hak/upload?p=${encodeURIComponent(S.hak.p)}&name=${encodeURIComponent(nm)}`, {method: "POST", body: f, headers: {"Content-Type": "application/octet-stream"}});
    if (r.ok) res[r.body.action].push(r.body.name); else res.skipped.push({file: f.name, why: r.body.error || r.status});
  }
  if (el) el.textContent = "";
  hakReport(res);
}
// Summary after adding files, shown only when something was skipped or more than three files were added.
function hakReport(r){
  if (!r.skipped.length && r.added.length + r.replaced.length <= 3) return;
  dialog({title: "Files added", cancel: null, html: `<p>${r.added.length} added, ${r.replaced.length} replaced${r.skipped.length ? `, <b>${r.skipped.length} skipped</b>` : ""}.</p>` +
    (r.skipped.length ? `<ul>${r.skipped.slice(0, 40).map(s => `<li><span class="mono">${esc(s.file)}</span>: ${esc(s.why)}</li>`).join("")}</ul>${r.skipped.length > 40 ? "…" : ""}` : "")});
}
// Extract every file (names = null) or the ticked ones into the project folder or a new / empty folder.
async function hakExtract(names){
  const how = await dialog({title: names ? `Extract ${names.length} file(s)` : "Extract every file", html: "Leave empty to extract into this project's folder in the workspace, or type/paste an <b>empty or new</b> folder path (nothing is ever overwritten).", input: {value: "", placeholder: "optional folder path"}, ok: "Extract"});
  if (how === null) return;
  const r = await hakDo("extract", {names, dest: how.trim()}, "Extracting…");
  if (r) dialog({title: "Extracted", cancel: null, html: `${fmtN(r.files)} file(s) written to <span class="mono">${esc(r.folder)}</span>`});
}
// Backups made by older toolkit versions, which replaced the hak in place, and by Restore. Restore replaces the hak
// on disk - the one in-place write left in the hak editor - after backing up the current file (/api/hak/restore).
async function hakBackups(st, m){
  const B = st.backups;
  const md = h(`<div class="modal"><div class="box" role="dialog" aria-modal="true" aria-label="Backups"><div class="bh"><b>Backups of ${esc(st.project.name)}.hak</b><div class="small muted">Made by older versions of the toolkit, which replaced the hak, and by Restore, which backs up the current hak first.</div></div>
    <div class="bb">${B.length ? B.map(b => `<div class="row small" style="margin:6px 0"><span class="grow"><b>${esc(b.made)}</b> · ${fmtBytes(b.bytes)} · ${esc(b.reason)}<br><span class="mono muted">${esc(b.file)}</span></span><button class="btn small" data-rb="${esc(b.id)}">Restore…</button></div>`).join("") : `<p class="muted small">No backups - rebuilt haks are now added under a new name, so nothing is replaced and no backup is needed. (Backups made by older versions of the toolkit are listed here.)</p>`}</div>
    <div class="bf row"><span class="grow"></span><button class="btn" id="bkClose">Close</button></div></div></div>`);
  const close = openModal(md, () => close(), $("#bkClose", md));
  $("#bkClose", md).onclick = () => close();
  md.querySelectorAll("[data-rb]").forEach(b => b.onclick = async () => {
    close();
    if (!await dialog({title: "Restore this backup", ok: "Restore", danger: true, check: "The game, toolset and server are closed", html: "The current hak is backed up first, then replaced by this backup. Any staged changes in this project are cleared."})) return;
    const r = await hakDo("restore", {backup: b.dataset.rb}, "Restoring…"); if (r) hakProject(m); });
}
// Side panel for one file inside the hak: download link, image preview, text / model / GFF contents, and a text
// editor that stages the change (/api/hak/file, /api/hak/upload). The edited text is saved with CRLF line endings.
async function hakView(name){
  if (!await leaveDrawer()) return;
  const dr = $("#drawer"); dr.hidden = false;
  $("#drawerHead").innerHTML = `<b class="mono">${esc(name)}</b><div class="crumb">in ${esc(S.hak.st.project.name)}.hak</div>`;
  $("#drawerBody").innerHTML = `<p class="muted">Loading…</p>`;
  const ext = name.split(".").pop(), url = `/api/hak/file?p=${encodeURIComponent(S.hak.p)}&name=${encodeURIComponent(name)}&t=${encodeURIComponent(TOKEN)}`;
  let H = `<div class="row" style="margin:8px 0"><a class="btn" href="${esc(url)}&dl=1">Download</a>${ext === "2da" ? `<button class="btn primary" id="hv2da">Open in 2da editor</button>` : ""}</div>`;
  if (["tga","png","jpg","bmp"].includes(ext)) H += `<img class="preview" alt="preview of ${esc(name)}" src="${esc(url)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'small muted',textContent:'No preview for this image format.'}))">`;
  else {
    let d; try { d = await api(`/api/hak/file?p=${encodeURIComponent(S.hak.p)}&name=${encodeURIComponent(name)}`); } catch(e){ $("#drawerBody").innerHTML = `<div class="note warn">${esc(e.message)}</div>`; return; }
    H += `<p class="small muted">${fmtBytes(d.size)}</p>`;
    if (d.model) H += `<p class="small">Model: ${d.model.format === "binary" ? "compiled (binary) - contents not shown" : `<b>${esc(d.model.model || "?")}</b>${d.model.supermodel ? `, supermodel <span class="mono">${esc(d.model.supermodel)}</span>` : ""}; textures: ${(d.model.textures||[]).map(esc).join(", ") || "none"}`}</p>`;
    if (d.text != null){ H += `<pre class="code">${d.text.split("\n").slice(0, 3000).map(l => `<span class="ln">${esc(l)||" "}</span>`).join("")}</pre>${d.truncated ? `<p class="small muted">(first 400 KB shown)</p>` : ""}`;
      if (ext !== "2da" && ext !== "mdl") H += `<details><summary class="small">Edit text</summary><textarea class="code" id="hvTxt">${esc(d.text)}</textarea><div class="row"><button class="btn primary" id="hvSave">Save (staged)</button><span class="small muted" id="hvMsg"></span></div></details>`; }
    if (d.gff) H += `<details><summary class="small">Fields (JSON)</summary><pre class="code">${esc(d.gff)}</pre></details>`;
    if (d.error) H += `<div class="note warn small">${esc(d.error)}</div>`;
  }
  $("#drawerBody").innerHTML = H;
  const b2 = $("#hv2da"); if (b2) b2.onclick = () => { dr.hidden = true; openTwoda({src: "hak", p: S.hak.p, name}, () => go("haks")); };
  const hv = $("#hvTxt"); if (hv) hv.orig = hv.value;
  const sv = $("#hvSave"); if (sv) sv.onclick = async () => {
    const r = await apiRaw(`/api/hak/upload?p=${encodeURIComponent(S.hak.p)}&name=${encodeURIComponent(name)}`, {method: "POST", body: new Blob([$("#hvTxt").value.replace(/\r?\n/g, "\r\n")]), headers: {"Content-Type": "application/octet-stream"}});
    $("#hvMsg").textContent = r.ok ? "Saved as a staged change." : (r.body.error || "failed"); if (r.ok){ hv.orig = hv.value; if (S.view === "haks") hakProject($("#main")); } };
}

// ---------------------------------------------------------------- 2da editor
// TD: the 2da editor's state - the table (t: {columns, rows, origin}), the original, row usage from the analysis,
// paging and filters, the unsaved flag and the latest checks. origin[i] = the row's number when it was loaded
// (null for a new row), so moved and new rows can be shown and checked.
const TD = {src: null, back: null, t: null, orig: null, usage: {}, page: 0, q: "", only: "", dirty: false, timer: null, checks: []};
// openTwoda(src, back): load a 2da via /api/twoda - src {src: "hak", p, name} or {src: "edit", a, file} - and show
// the editor; back() is what the Back button does. Asks first when there are unsaved changes.
async function openTwoda(src, back){
  if (TD.dirty && !await dialog({title: "Unsaved 2da changes", html: "You have unsaved changes in the 2da editor. Throw them away?", ok: "Discard", danger: true})) return;
  // the loading message is in its own element: if the user moves to another page meanwhile, it is gone and the
  // table is not drawn over that page
  const m = $("#main"), host = h(`<p class="muted">Loading the table…</p>`); m.replaceChildren(host); m.scrollTop = 0;
  const qs = new URLSearchParams(src).toString();
  let d; try { d = await api(`/api/twoda?${qs}`); } catch(e){ if (host.isConnected) host.outerHTML = `<div class="note warn">${esc(e.message)}</div>`; return; }
  if (!host.isConnected) return;
  Object.assign(TD, {src, back, base: d.base_sha, t: d.table, orig: d.original, usage: d.usage || {}, usageKnown: d.usage_known, readers: d.readers, page: 0, q: "", only: "", dirty: false, checks: d.checks, parse: d.parse_issues, label: d.label, name: d.name, context: d.context});
  twodaRender();
}
function twodaCell(v){ return v == null ? "" : v; }
// The editor page. NWN finds 2da rows by number, so the page steers towards adding rows at the end and blanking
// rows; delete / insert (which renumber later rows) ask for confirmation.
function twodaRender(){
  const m = $("#main"), t = TD.t;
  const errs = TD.checks.filter(c => c.level === "error").length, warns = TD.checks.filter(c => c.level === "warning").length;
  m.innerHTML = `<div class="row"><h1 class="grow">2da editor - ${esc(TD.name)}.2da</h1><button class="btn" id="tdBack">← Back</button></div>
    <p class="sub">${esc(TD.label)} · ${fmtN(t.rows.length)} rows × ${fmtN(t.columns.length)} columns · ${TD.context ? `row usage from <b>${esc(TD.context.analysis)}</b>${TD.usageKnown ? "" : " (this table's rows aren't tracked - treat every row as possibly used)"}` : "no analysed module attached - row usage unknown"}</p>
    <div class="note small">NWN finds 2da rows by <b>position</b>. Add new rows at the <b>end</b>. To retire a row, <b>blank</b> it (****) rather than deleting it, so the rows after it keep their numbers.</div>
    <div class="row" style="margin:8px 0"><button class="btn primary" id="tdSave" ${TD.dirty ? "" : "disabled"}>Save</button><button class="btn" id="tdRevert" ${TD.dirty ? "" : "disabled"}>Revert</button>
      <button class="btn" id="tdAddRow">Add row at end</button><button class="btn" id="tdAddCol">Add column</button><button class="btn" id="tdRenum">Renumber rows</button>
      <input type="search" id="tdQ" placeholder="Find text in rows" value="${esc(TD.q)}">
      <select class="f" id="tdOnly"><option value="">all rows</option><option value="issues" ${TD.only==="issues"?"selected":""}>rows with issues</option><option value="used" ${TD.only==="used"?"selected":""}>rows the module uses</option><option value="changed" ${TD.only==="changed"?"selected":""}>changed rows</option></select>
      <span class="small muted" id="tdMsg">${TD.dirty ? "unsaved changes" : ""}</span></div>
    <details class="card" ${errs ? "open" : ""} id="tdChecksBox"><summary><b>Checks</b> <span class="small muted">${errs} error(s), ${warns} warning(s)</span></summary><div id="tdChecks"></div>
      ${TD.parse.length ? `<h3>In the file as it was loaded</h3>${TD.parse.map(c => `<div class="qs-warn small">${svBadge(c.level)}<span>line ${c.line}: ${esc(c.msg)}</span></div>`).join("")}` : ""}</details>
    <div id="tdGrid"></div>`;
  twodaChecksDraw(); twodaGrid();
  $("#tdBack").onclick = async () => { if (TD.dirty && !await dialog({title: "Unsaved changes", html: "Leave without saving?", ok: "Leave", danger: true})) return; TD.dirty = false; (TD.back || (() => go("haks")))(); };
  $("#tdSave").onclick = () => twodaSave(false);
  $("#tdRevert").onclick = async () => { if (await dialog({title: "Revert", html: "Throw away your unsaved changes to this table?", ok: "Revert", danger: true})){ TD.dirty = false; openTwoda(TD.src, TD.back); } };
  $("#tdAddRow").onclick = () => { t.rows.push([String(t.rows.length)].concat(t.columns.map(() => null))); t.origin.push(null); TD.page = Math.floor((t.rows.length - 1) / 100); twodaChanged(true); };
  $("#tdAddCol").onclick = async () => { const nm = await dialog({title: "Add column", html: "Column name (no spaces). It is added at the end with **** in every row.", input: {value: ""}, ok: "Add"});
    if (!nm) return; if (/\s/.test(nm) || t.columns.some(c => c.toLowerCase() === nm.toLowerCase())){ errorBox("That name has spaces or already exists."); return; }
    t.columns.push(nm); t.rows.forEach(r => r.push(null)); twodaChanged(true); };
  $("#tdRenum").onclick = () => { t.rows.forEach((r, i) => r[0] = String(i)); twodaChanged(true); };
  $("#tdQ").oninput = e => { TD.q = e.target.value.toLowerCase(); TD.page = 0; twodaGrid(); };
  $("#tdOnly").onchange = e => { TD.only = e.target.value; TD.page = 0; twodaGrid(); };
}
function twodaChecksDraw(){
  const host = $("#tdChecks"); if (!host) return;
  host.innerHTML = TD.checks.length ? TD.checks.map((c, i) => `<div class="qs-warn small">${svBadge(c.level)}<span class="grow">${c.row != null ? `<a class="nl" href="#" data-go="${c.row}">` : ""}${esc(c.msg)}${c.row != null ? "</a>" : ""}</span></div>`).join("") : `<span class="small">All clear.</span>`;
  host.querySelectorAll("[data-go]").forEach(a => a.onclick = () => { TD.q = ""; TD.only = ""; TD.page = Math.floor(+a.dataset.go / 100); twodaGrid(+a.dataset.go); });
}
// Indexes of the rows that pass the search and the "only" filter (issues / used by the module / changed).
function twodaRowsShown(){
  const t = TD.t, q = TD.q, issueRows = new Set(TD.checks.filter(c => c.row != null).map(c => c.row));
  const idx = [];
  t.rows.forEach((r, i) => {
    if (q && !r.some(v => v != null && String(v).toLowerCase().includes(q))) return;
    const o = t.origin[i];
    if (TD.only === "issues" && !issueRows.has(i)) return;
    if (TD.only === "used" && !(o != null && TD.usage[String(o)])) return;
    // changed = new, moved, or different values from the row it was loaded as
    if (TD.only === "changed" && !(o == null || o !== i || JSON.stringify(r.slice(1)) !== JSON.stringify((TD.orig.rows[o]||[]).slice(1)))) return;
    idx.push(i); });
  return idx;
}
// Draw one page (100 rows) of editable cells. An empty cell or "****" is stored as null (the 2da "no value").
function twodaGrid(focusRow){
  const host = $("#tdGrid"); if (!host) return;
  const t = TD.t, idx = twodaRowsShown(), pages = Math.max(1, Math.ceil(idx.length / 100));
  TD.page = Math.min(TD.page, pages - 1);
  const slice = idx.slice(TD.page * 100, TD.page * 100 + 100);
  const issueRows = new Set(TD.checks.filter(c => c.row != null && c.level !== "info").map(c => c.row));
  host.innerHTML = `<div class="pager">${fmtN(idx.length)} row(s) ${pages > 1 ? `· page ${TD.page + 1} of ${pages} <button class="btn" data-pg="-1">‹ Prev</button><button class="btn" data-pg="1">Next ›</button>` : ""}</div>
    <div class="tw" style="max-height:70vh;overflow:auto"><table class="dt td2"><thead><tr><th style="position:sticky;top:0;left:0;z-index:2">Row</th>${t.columns.map((c, k) => `<th style="position:sticky;top:0"><span class="mono">${esc(c)}</span> <button class="btn small" data-colm="${k}" aria-label="column ${esc(c)} actions">⋯</button></th>`).join("")}</tr></thead>
    <tbody>${slice.map(i => { const r = t.rows[i], o = t.origin[i], u = o != null ? TD.usage[String(o)] : null;
      return `<tr data-r="${i}" style="${issueRows.has(i) ? "box-shadow:inset 3px 0 var(--critical)" : ""}"><td style="position:sticky;left:0;background:var(--surface);white-space:nowrap"><b>${i}</b>${String(r[0]) !== String(i) ? ` <span class="small muted" title="label in the file">(${esc(r[0])})</span>` : ""}${o == null ? ` <span class="chip">new</span>` : o !== i ? ` <span class="chip" title="was row ${o}">was ${o}</span>` : ""}${u ? ` <span class="chip" title="${esc(u.join("\n"))}">used ×${u.length}${u.length >= 8 ? "+" : ""}</span>` : ""} <button class="btn small" data-rowm="${i}" aria-label="row ${i} actions">⋯</button></td>
        ${r.slice(1).map((v, k) => `<td style="padding:2px"><input class="mono" data-c="${k}" value="${esc(twodaCell(v))}" placeholder="****" aria-label="row ${i} ${esc(t.columns[k])}" style="width:${Math.min(22, Math.max(6, (t.columns[k].length + 2), String(v ?? "").length + 2))}ch;border:1px solid transparent;background:transparent;padding:3px 4px"></td>`).join("")}</tr>`; }).join("")}</tbody></table></div>`;
  host.querySelectorAll("[data-pg]").forEach(b => b.onclick = () => { TD.page = Math.max(0, TD.page + +b.dataset.pg); twodaGrid(); });
  host.querySelector("tbody").addEventListener("input", e => { const inp = e.target.closest("input[data-c]"); if (!inp) return;
    const i = +inp.closest("tr").dataset.r, k = +inp.dataset.c, v = inp.value.trim();
    t.rows[i][k + 1] = (v === "" || v === "****") ? null : v; twodaChanged(false); });
  host.querySelectorAll("[data-rowm]").forEach(b => b.onclick = () => twodaRowMenu(+b.dataset.rowm));
  host.querySelectorAll("[data-colm]").forEach(b => b.onclick = () => twodaColMenu(+b.dataset.colm));
  if (focusRow != null){ const tr = host.querySelector(`tr[data-r="${focusRow}"]`); if (tr){ tr.scrollIntoView({block: "center"}); tr.style.outline = "2px solid var(--accent)"; } }
}
// Mark the table unsaved and re-run the server checks (/api/twoda/check) 0.6 s after the last change.
function twodaChanged(redraw){
  TD.dirty = true; const s = $("#tdSave"), rv = $("#tdRevert"), msg = $("#tdMsg");
  if (s){ s.disabled = false; rv.disabled = false; msg.textContent = "unsaved changes"; }
  if (redraw) twodaGrid();
  clearTimeout(TD.timer);
  TD.timer = setTimeout(async () => { try { const r = await post("/api/twoda/check", {...TD.src, table: TD.t}); TD.checks = r.checks; twodaChecksDraw();
    if (TD.checks.some(c => c.level === "error")) $("#tdChecksBox").open = true;
    const box = $("#tdChecksBox summary .small"); if (box) box.textContent = `${TD.checks.filter(c => c.level === "error").length} error(s), ${TD.checks.filter(c => c.level === "warning").length} warning(s)`; } catch(e){} }, 600);
}
// Row actions. Blank and copy-to-end keep every row number; delete / insert shift later rows, so they ask first.
async function twodaRowMenu(i){
  const t = TD.t, last = i === t.rows.length - 1, o = t.origin[i], u = o != null ? TD.usage[String(o)] : null;
  const md = h(`<div class="modal"><div class="box" role="dialog" aria-modal="true" aria-label="Row ${i}"><div class="bh"><b>Row ${i}</b> <span class="small muted">${esc(t.rows[i].slice(1, 3).filter(Boolean).join(" · "))}</span></div>
    <div class="bb small">${u ? `<p><b>Used by ${u.length}${u.length >= 8 ? "+" : ""}:</b> ${u.map(esc).join(", ")}</p>` : TD.usageKnown ? "<p>No module content uses this row.</p>" : "<p class='muted'>Row usage unknown for this table.</p>"}
      <div style="display:grid;gap:6px">
        <button class="btn" data-op="blank"><b>Blank this row</b> - every value becomes ****; later rows keep their numbers (safe)</button>
        <button class="btn" data-op="dup"><b>Copy this row to the end</b> - a new row with the same values</button>
        <button class="btn ${last ? "" : "danger"}" data-op="del"><b>Delete this row</b>${last ? " - it is the last row, nothing moves" : ` - rows ${i + 1}…${t.rows.length - 1} would each move up by one`}</button>
        <button class="btn danger" data-op="ins"><b>Insert a blank row above</b> - rows ${i}…${t.rows.length - 1} would each move down by one</button></div></div>
    <div class="bf row"><span class="grow"></span><button class="btn" data-op="close">Close</button></div></div></div>`);
  const close = openModal(md, () => close());
  md.onclick = async e => { const b = e.target.closest("[data-op]"); if (!b) return; const op = b.dataset.op; close();
    if (op === "blank"){ t.rows[i] = [t.rows[i][0]].concat(t.columns.map(() => null)); }
    else if (op === "dup"){ t.rows.push([String(t.rows.length)].concat(t.rows[i].slice(1))); t.origin.push(null); }
    else if (op === "del"){ if (!last && !await dialog({title: `Delete row ${i}`, danger: true, ok: "Delete and shift rows", html: `Every row after it changes number. Anything that refers to rows ${i + 1} and later by number (creatures, items, placeables, other 2das, scripts, player characters) would point at the wrong row. The checks will list what the module uses. Usually <b>Blank this row</b> is what you want.`})) return;
      t.rows.splice(i, 1); t.origin.splice(i, 1); }
    else if (op === "ins"){ if (!await dialog({title: `Insert a row above ${i}`, danger: true, ok: "Insert and shift rows", html: "Every row from here on changes number, with the same risk as deleting. Adding at the end is safe."})) return;
      t.rows.splice(i, 0, [String(i)].concat(t.columns.map(() => null))); t.origin.splice(i, 0, null); }
    else return;
    twodaChanged(true); };
}
// Column actions: rename or delete (the game and scripts read columns by name, hence the warnings).
async function twodaColMenu(k){
  const t = TD.t, c = t.columns[k];
  const md = h(`<div class="modal"><div class="box" role="dialog" aria-modal="true" aria-label="Column ${esc(c)}"><div class="bh"><b>Column ${esc(c)}</b></div><div class="bb small" style="display:grid;gap:6px">
    <button class="btn" data-op="ren">Rename…</button><button class="btn danger" data-op="del">Delete this column…</button></div>
    <div class="bf row"><span class="grow"></span><button class="btn" data-op="close">Close</button></div></div></div>`);
  const close = openModal(md, () => close());
  md.onclick = async e => { const b = e.target.closest("[data-op]"); if (!b) return; close();
    if (b.dataset.op === "ren"){ const nm = await dialog({title: `Rename column ${c}`, html: "The game and scripts read columns by name - rename only columns you added yourself.", input: {value: c}, ok: "Rename"});
      if (!nm || nm === c) return; if (/\s/.test(nm) || t.columns.some((x, j) => j !== k && x.toLowerCase() === nm.toLowerCase())){ errorBox("That name has spaces or already exists."); return; }
      t.columns[k] = nm; twodaChanged(true); }
    else if (b.dataset.op === "del"){ if (!await dialog({title: `Delete column ${c}`, danger: true, ok: "Delete column", html: "The game and scripts read columns by name; deleting one they expect breaks them. The checks will warn if the game's own version has this column."})) return;
      t.columns.splice(k, 1); t.rows.forEach(r => r.splice(k + 1, 1)); twodaChanged(true); } };
}
// Save via /api/twoda/save. base_sha lets the server refuse a save over a file that changed since it was loaded.
// If the change moves rows the module uses, the server answers needs_confirm and the user may save again with
// allowRisky = true.
async function twodaSave(allowRisky){
  const r = await apiRaw("/api/twoda/save", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({...TD.src, table: TD.t, allow_risky: allowRisky, base_sha: TD.base})});
  if (r.ok){ TD.checks = r.body.checks; TD.dirty = false; openTwoda(TD.src, TD.back); return; }
  if (r.body && r.body.checks){ TD.checks = r.body.checks; twodaChecksDraw(); }
  if (r.body && r.body.needs_confirm){
    const risky = TD.checks.filter(c => c.blocking === "usage");
    if (await dialog({title: "This change moves rows the module uses", danger: true, ok: "Save anyway", check: "I understand these references will point at different rows",
      html: `<ul>${risky.slice(0, 12).map(c => `<li>${esc(c.msg)}</li>`).join("")}</ul>${risky.length > 12 ? "<p>…and more</p>" : ""}<p>The safe alternative is to undo the delete/insert and add rows at the end instead.</p>`})) twodaSave(true);
    return; }
  errorBox((r.body && r.body.error) || "Not saved.");
}

// Quick scan (TL;DR): /api/quickscan reads module.ifo and the hak tables of contents only; nothing is written.
async function quickScan(){
  const path = $("#modPath").value.trim(); if (!path){ $("#goMsg").textContent = "Enter a folder or .mod path first."; return; }
  const b = $("#qsBtn"); b.disabled = true; b.textContent = "Scanning…"; $("#goMsg").textContent = "";
  const haks = $("#haks").value.split(/\r?\n/).map(x => x.trim()).filter(Boolean).join("|");
  try { S.lastScan = await api(`/api/quickscan?path=${encodeURIComponent(path)}&haks=${encodeURIComponent(haks)}`); renderQuickScan(S.lastScan); }
  catch(e){ $("#goMsg").textContent = e.message; }
  finally { b.disabled = false; b.textContent = "Quick scan (TL;DR)"; }
}

      <li>Clashes: ${fmtN(c.in_several_haks)} file(s) are in more than one hak; ${fmtN(c.module_hidden)} module file(s) are hidden by a hak${c.module_hidden_examples.length ? ` (e.g. <span class="mono">${c.module_hidden_examples.slice(0,4).map(esc).join(", ")}</span>)` : ""}</li>
      <li>Module events: ${Object.keys(m.events||{}).length ? Object.entries(m.events).map(([k,v]) => `${esc(modEvent(k))} <span class="mono">${esc(v)}</span>`).join(" · ") : "none set"}</li>
      <li>Journal: ${m.journal ? "yes" : "no"} · NWNX: ${m.nwnx ? `yes (<span class="mono">${m.nwnx_scripts.slice(0,5).map(esc).join(", ")}</span>)` : "no sign of it"} · Sizes: module ${fmtBytes(sz.module)}, haks ${fmtBytes(sz.haks)}, tlk ${fmtBytes(sz.tlk)}</li>

// detail panel beside a list (".split > .side"): add a close button; scroll into view only when stacked (narrow window)
function showSide(el){
  if (!el) return;
  const card = el.firstElementChild;
  if (card && !card.querySelector(":scope > .sideclose")){
    const b = document.createElement("button"); b.className = "sideclose"; b.title = "Close"; b.textContent = "✕";
    b.onclick = () => { el.innerHTML = ""; }; card.prepend(b); }
  el.scrollTop = 0;
  if (window.innerWidth <= 1100) el.scrollIntoView({behavior: "smooth", block: "nearest"});

// Step list and progress bar for a job whose progress lists its steps.
function jobSteps(p, status){
  const mark = {done: "✓", running: "▶", waiting: "·", skipped: "–"};
  const pct = status === "done" ? 100 : (p.pct ?? 0);
  return `<div class="card small" style="margin-bottom:8px">
    <div class="row" style="justify-content:space-between"><b>${status === "running" ? `Step ${p.step_no} of ${p.step_count}: ${esc(p.stage)}` : status === "done" ? "Finished" : "Stopped at: " + esc(p.stage)}</b><span>${status === "running" ? esc(p.eta_text) : ""} · ${fmtDur(p.elapsed_s)} so far</span></div>
    ${p.detail && status === "running" ? `<div class="muted">${esc(p.detail)}</div>` : ""}
    <div style="height:8px;background:var(--line);border-radius:4px;margin:6px 0;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--${status === "running" || status === "done" ? "good" : "warning"})"></div></div>
    <div style="columns:2;column-gap:24px">${p.steps.map(x => `<div class="${x.status === "waiting" || x.status === "skipped" ? "muted" : ""}">${mark[x.status] || "·"} ${esc(x.text)}${x.secs != null ? ` <span class="muted">(${fmtDur(x.secs)})</span>` : ""}${x.status === "skipped" ? ' <span class="muted">(not needed)</span>' : ""}</div>`).join("")}</div></div>`;
}
// watchJob(id, host, done, ended): follow a server job in host - log, step list and a Stop button - polling /api/job
// every 0.7 s. done(result) runs once if the job finishes; ended() runs once when it stops for any reason (or its
// status can't be read any more). Used for build, compile and hak rebuild.
function watchJob(id, host, done, ended){
  host.innerHTML = `<div class="row" style="margin-bottom:6px">${STATIC ? "" : `<button class="btn" id="jstop">Stop</button>`}<span class="small muted" id="jst">running…</span></div><div id="jpg"></div><div class="joblog" id="jl">Starting…</div>`;
  if (!STATIC) $("#jstop", host).onclick = async e => { e.target.disabled = true; try { await post("/api/job/stop", {id}); $("#jst", host).textContent = "stopping at the next safe point…"; } catch(err){ errorBox(err.message); } };
  const t = setInterval(async () => {
    let j; try { j = await api(`/api/job?id=${id}`); }
    catch(e){ clearInterval(t); const st = $("#jst", host); if (st) st.textContent = "Can't follow the job: " + e.message;
      const b_ = $("#jstop", host); if (b_) b_.remove(); if (ended) ended(); return; }
    const box = $("#jl", host); if (box){ box.textContent = j.lines.join("\n"); box.scrollTop = box.scrollHeight; }
    const pgb = $("#jpg", host); if (pgb && j.progress && j.progress.steps) pgb.innerHTML = jobSteps(j.progress, j.status);
    if (j.status !== "running"){ clearInterval(t); const b_ = $("#jstop", host); if (b_) b_.remove();
      const st = $("#jst", host); if (st) st.textContent = j.status === "done" ? "finished" : j.status === "stopped" ? "stopped" : "failed - see the log below";
      if (ended) ended();
      if (j.status === "done" && done) done(j.result); }
  }, 700);
}
// Folder browser dialog over /api/ls (the server lists folders and module / hak files). mode: "module" (a folder
// with module.ifo, or a .mod), "hak" (a .hak file) or "folder" (any folder). pick(path) gets the choice.
// start: a folder, or a list of folders to try in order; the first that can be listed is shown, else the drives.
async function browse(start, pick, mode = "module"){
  const md = h(`<div class="modal"><div class="box" role="dialog" aria-modal="true" aria-label="Browse"><div class="bh"><b>${mode === "hak" ? "Choose a .hak file" : mode === "folder" ? "Choose a folder" : "Choose a module folder or .mod file"}</b><div class="small mono" id="bp"></div></div><div class="bb" id="bl"></div>
    <div class="bf row"><button class="btn" id="bup">⬆ Up</button><span class="grow"></span><button class="btn" id="bcancel">Cancel</button><button class="btn primary" id="buse" disabled>Use this folder</button></div></div></div>`);
  const close = openModal(md, () => close(), $("#bcancel", md));
  let cur = null;
  const open = async p => { let r;
    try { r = await api(`/api/ls?path=${encodeURIComponent(p)}`); } catch(e){ $("#bl", md).innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
    cur = r;
    $("#bp", md).textContent = r.path || "Computer";
    if (mode === "module"){ $("#buse", md).disabled = !r.is_module; $("#buse", md).textContent = r.is_module ? "Use this module folder" : "Folder has no module.ifo"; }
    else if (mode === "folder"){ $("#buse", md).disabled = !r.path; $("#buse", md).textContent = "Use this folder"; }
    else { $("#buse", md).hidden = true; }
    if (mode === "hak") r.mods = r.mods.filter(f => /\.hak$/i.test(f)); else if (mode === "folder") r.mods = [];
    // the server's error text is an OS message ("[Errno 2] ..."); say it in words
    $("#bl", md).innerHTML = (r.error ? `<p class="muted">This folder can't be opened: it does not exist, or you are not allowed to read it.</p>` : "") +
      r.dirs.map(d => `<div class="fl" role="button" tabindex="0" data-d="${esc(d)}">📁 ${esc(d)}</div>`).join("") +
      r.mods.map(f => `<div class="fl" role="button" tabindex="0" data-f="${esc(f)}">📦 ${esc(f)}</div>`).join("") || `<p class="muted">Empty</p>`;
    $("#bl", md).querySelectorAll("[data-d]").forEach(e => e.onclick = () => open(r.path ? (r.path.replace(/[\\/]$/,"") + (r.path.includes("\\")?"\\":"/") + e.dataset.d) : e.dataset.d));
    $("#bl", md).querySelectorAll("[data-f]").forEach(e => e.onclick = () => { pick(r.path.replace(/[\\/]$/,"") + (r.path.includes("\\")?"\\":"/") + e.dataset.f); close(); });
  };
  $("#bup", md).onclick = () => cur && open(cur.parent || "");
  $("#bcancel", md).onclick = () => close();
  $("#buse", md).onclick = () => { pick(cur.path); close(); };
  // try each start folder quietly (/api/ls answers with an error field, it doesn't fail); none works -> the drives
  for (const p of [].concat(start).filter(Boolean)){
    try { const r = await api(`/api/ls?path=${encodeURIComponent(p)}`); if (!r.error) return open(p); } catch(e){ break; }
  }
  open("");
}

// Overview page: summary tiles, impact levels, file types, load and size figures and the highest-impact
// resources, all from the report (S.rep). Module and server settings come from /api/modsettings (modSettings;
// not in the static report). The bars open the Impact explorer or All files with a filter set (applyPreset).
// versionNotice(report): the Overview's line on which version made this analysis, and - when this version has checks
// the analysis doesn't (S.reanalyse from /api/state, nwn_update.REANALYSE) or work was saved by a newer version
// (S.ver.newer_work) - a note saying what to do. "Analyse again" (#reana) re-runs the same module into the same
// folder, so edits, accepted issues and waiting changes stay.
function versionNotice(r){
  if (STATIC) return "";
  const made = r.toolkit ? r.toolkit.version : "a version before 1.5.0";
  const miss = (S.reanalyse || []).filter(f => !(f.key in r));
  const newer = S.ver && S.ver.newer_work;
  return `${newer ? `<div class="note warn small"><b>Saved by a newer version:</b> ${esc(newer)}.</div>` : ""}
    ${miss.length ? `<div class="note small"><b>This analysis was made by ${esc(made)}.</b> Analysing again adds: ${miss.map(f => esc(f.what)).join("; ")}. Your edits, accepted issues and waiting changes stay with it. <button class="btn small" id="reana">Analyse again</button></div>`
      : `<p class="small muted" style="margin-top:-6px">Analysed with ${esc(made)}.</p>`}`;
}

// Counting issues and "accepted as by design". An accepted issue is matched by category|node|label (issueKey) and by
// its detail with every number replaced by "#" (issueSig). If the detail changes in any other way after a
// re-analysis, the issue counts again and is flagged "changed since you accepted it".
const openIssues = (r, sev) => r.issues ? r.issues.filter(i => i.severity === sev && !isAccepted(i)).length : (r.summary.issues[sev]||0);
const accCount = r => (r.issues || []).filter(isAccepted).length;
const issueKey = i => `${i.category}|${i.node}|${i.label}`;
const issueSig = i => String(i.detail || "").replace(/\d+/g, "#");
function isAccepted(i){ const a = (S.accepted || {})[issueKey(i)]; return !!a && a.sig === issueSig(i); }
function acceptedChanged(i){ const a = (S.accepted || {})[issueKey(i)]; return !!a && a.sig !== issueSig(i); }
// Import… on the Issues, Safe to delete and Duplicates pages: pick a CSV, show the server's preview (each row is
// changed, unchanged or refused with its row number and why) and apply only after OK. url: the upload endpoint (a
// preview); lines(plan): the "will change" lines; changes(plan): how many changes; apply(plan, file): do it.
async function sheetImport({url, title, lines, changes, apply}){
  const [file] = await pickFiles(false); if (!file) return;
  const r = await apiRaw(url, {method: "POST", body: file, headers: {"Content-Type": "application/octet-stream"}});
  if (!r.ok){ await dialog({title: "Can't import this file", html: esc(r.body.error || r.status), cancel: null}); return; }
  const p = r.body, n = changes(p);
  const ref = p.refused.length ? `<h4>Refused (fix these in the spreadsheet and import again)</h4><div class="tw" style="max-height:240px;overflow:auto"><table class="dt small"><thead><tr><th>Row</th><th>What</th><th>Why</th></tr></thead><tbody>${p.refused.slice(0, 1000).map(x => `<tr><td>${x.row}</td><td class="mono">${esc(x.item || "")}</td><td>${esc(x.why)}</td></tr>`).join("")}</tbody></table></div>` : "";
  const html = `<p><b>${esc(file.name)}</b>: ${fmtN(p.rows)} row(s) read. Nothing changes until you press the button below.</p>
    <ul>${lines(p).map(l => `<li>${l}</li>`).join("")}<li>${fmtN(p.unchanged)} row(s) unchanged (empty, or already so)${p.duplicates ? `; ${fmtN(p.duplicates)} repeated row(s)` : ""}</li>
      <li><b style="color:var(--${p.refused.length ? "critical" : "good"}-text)">${fmtN(p.refused.length)}</b> row(s) refused</li></ul>${ref}`;
  if (!n){ await dialog({title: "Nothing to change", html, cancel: null}); return; }
  if (!await dialog({title: title + " - preview", html, ok: `Apply ${fmtN(n)} change${n === 1 ? "" : "s"}`})) return;
  await apply(p, file);
}

    {key:"category", label:"Type", render: i => `<span class="small">${esc(i.category.replace(/_/g," "))}</span>`},
    {key:"label", label:"Where", render: i => nl(i.node, i.label)},
    {key:"detail", label:"Detail", render: i => `<span class="small">${esc(i.detail)}</span>${i.fix ? `<div class="small fixhint"><b>How to fix:</b> ${esc(i.fix)}</div>` : ""}${acceptedChanged(i) ? `<br><span class="badge sv-warning"><i></i>changed since you accepted it</span> <span class="small muted">${esc((S.accepted[issueKey(i)]||{}).note||"")}</span>` : ""}`},
    {key:"acc", label:"By design", sort: i => isAccepted(i) ? 1 : 0, render: i => STATIC ? (isAccepted(i) ? "yes" : "") :
      `<label class="small" title="Accept this issue as intended"><input type="checkbox" data-acc="${esc(issueKey(i))}" ${isAccepted(i)?"checked":""}> ${isAccepted(i) ? esc(S.accepted[issueKey(i)].note || "accepted") : ""}</label>`}]});
  // info notes and accepted issues are hidden unless their tick box is on (or the info severity is picked)
  const draw = f => { cur = f; const vis = rows.filter(i => (!f.sev || i.severity === f.sev) && (!f.cat || i.category === f.cat) &&
      (f.info || f.sev === "info" || i.severity !== "info") && (f.acc || !isAccepted(i)) && has(f.q, i.label, i.detail, i.category));
    shown = vis; t.set(vis); $("#fl_acc", m).textContent = `show accepted (${nAcc()})`;
    if (!STATIC){ const na = vis.filter(i => !isAccepted(i)).length, nu = vis.length - na;
      $("#iacc", m).textContent = `Accept all shown (${fmtN(na)})…`; $("#iacc", m).disabled = !na;
      $("#iun", m).textContent = `Un-accept all shown (${fmtN(nu)})…`; $("#iun", m).hidden = !nu; } };
  // many at once: one note for all of them (/api/issues/accept_many)
  const bulk = async accept => {
    const lst = shown.filter(i => accept ? !isAccepted(i) : isAccepted(i)); if (!lst.length) return;
    const note = accept ? await dialog({title: `Accept ${plural(lst.length, "issue")} as by design`, ok: "Accept all", input: {placeholder: "why (optional, the same note for all) - e.g. DM-only areas"},
        html: `<p>Every issue the page shows now (${fmtN(lst.length)}) will be hidden and left out of the issue counts. Any that changes after a re-analysis comes back.</p>`})
      : await dialog({title: `Un-accept ${plural(lst.length, "issue")}`, ok: "Un-accept all", html: `<p>These ${fmtN(lst.length)} issue(s) will count again.</p>`});
    if (note == null) return;
    try { S.accepted = await post("/api/issues/accept_many", {a: S.cur, accepted: accept, note: accept ? note : "",
        items: lst.map(i => ({key: issueKey(i), sig: issueSig(i), category: i.category, label: i.label}))}); renderNav(); draw(cur); }
    catch(e){ errorBox(e.message); } };
  $("#icsv", m).onclick = () => downloadCsv("issues.csv", ["key", "severity", "type", "where", "detail", "fix", "by_design", "note"],
    shown.map(i => [issueKey(i), i.severity, i.category, i.label, i.detail, i.fix || "", isAccepted(i) ? "yes" : "", isAccepted(i) ? (S.accepted[issueKey(i)].note || "") : ""]));
  if (!STATIC){
    $("#iacc", m).onclick = () => bulk(true); $("#iun", m).onclick = () => bulk(false);
    $("#iimp", m).onclick = () => sheetImport({url: `/api/issues/import?a=${encodeURIComponent(S.cur)}`, title: "Import by-design decisions",
      lines: p => [`<b>${fmtN(p.accept.length)}</b> issue(s) accepted as by design`, `<b>${fmtN(p.unaccept.length)}</b> issue(s) un-accepted (they count again)`],
      changes: p => p.accept.length + p.unaccept.length,
      apply: async (p, file) => { const r = await apiRaw(`/api/issues/import?a=${encodeURIComponent(S.cur)}&apply=1`, {method: "POST", body: file, headers: {"Content-Type": "application/octet-stream"}});
        if (!r.ok){ errorBox(r.body.error || r.status); return; } S.accepted = r.body.accepted; renderNav(); draw(cur); }});
  }
  function bindAcc(el){
    el.querySelectorAll("[data-acc]").forEach(cb => { cb.onclick = e => e.stopPropagation(); cb.onchange = async () => {
      const i = rows.find(x => issueKey(x) === cb.dataset.acc); if (!i) return;
      let note = "";
      if (cb.checked){ note = await dialog({title: "Accept as by design", ok: "Accept", input: {placeholder: "why (optional) - e.g. set by the DM tool at run time", value: ((S.accepted||{})[issueKey(i)]||{}).note || ""},
        html: `<p><b>${esc(i.label)}</b> - ${esc(i.detail)}</p><p>It will be hidden and left out of the issue counts. If what this issue says changes after a re-analysis, it comes back.</p>`});
        if (note == null){ cb.checked = false; return; } }
      try { S.accepted = await post("/api/issues/accept", {a: S.cur, key: issueKey(i), sig: issueSig(i), accepted: cb.checked, note, category: i.category, label: i.label});
        renderNav(); draw(cur); } catch(e){ cb.checked = !cb.checked; errorBox(e.message); } }; });
  }
  filterBar($("#fb", m), [{id:"q", type:"search", label:"Search issues…"}, {id:"sev", type:"select", label:"All severities", options:["error","warning","info"]},
    {id:"cat", type:"select", label:"All types", options: cats.map(c => [c, c.replace(/_/g, " ")])}, {id:"acc", type:"check", label:"show accepted"},
    {id:"info", type:"check", label:`show info notes (${fmtN(rows.filter(i => i.severity === "info").length)})`}], draw);
  draw({q:"", sev:"", cat:"", acc:false, info:false});
};

// Placed objects grouped by area, then by the creature / container / store that holds them
function placedGroups(rows){
  const areas = new Map();
  for (const o of rows){
    // where is a breadcrumb "Module › Area › holder...": part 1 is the area, anything after it the holder
    const parts = String(o.where || "").split(" › ");
    const area = parts[1] || o.area || "(no area)", holder = parts.length > 2 ? parts.slice(2).join(" › ") : "placed in the area";
    if (!areas.has(area)) areas.set(area, new Map());
    const hs = areas.get(area); if (!hs.has(holder)) hs.set(holder, []); hs.get(holder).push(o);
  }
  return [...areas.entries()].map(([area, hs]) => ({area, n: [...hs.values()].reduce((a, l) => a + l.length, 0),
    holders: [...hs.entries()].map(([holder, list]) => ({holder, list})).sort((a, b) => b.list.length - a.list.length)})).sort((a, b) => b.n - a.n);
}
// Placed objects by area, then holder, with a search, a kind filter and (when the base game was read) "missing
// only". o.base: true = a copy of a base-game blueprint, false = no blueprint anywhere, absent = unknown.
function groupedPlaced(host, rows){
  const hasBase = rows.some(o => o.base === true || o.base === false);
  host.innerHTML = `${hasBase ? "" : `<p class="small muted">The NWN install folder isn't set, so the toolkit can't tell which of these come from the base game (normal) and which are really missing. Set it in Settings and re-analyse.</p>`}<div class="filters" id="gpf"></div><div id="gpl"></div>`;
  const draw = f => {
    const vis = rows.filter(o => has(f.q, o.label, o.template, o.where) && (!f.mo || !o.base) && (!f.c || o.cls === f.c));
    const gs = placedGroups(vis);
    $("#gpl", host).innerHTML = `<p class="small muted">${fmtN(vis.length)} object(s) in ${fmtN(gs.length)} area(s)</p>` + gs.slice(0, 300).map((g_, i) => `<details class="card" ${gs.length <= 3 || i === 0 && f.q ? "open" : ""}><summary><b>${esc(g_.area)}</b> <span class="chip">${fmtN(g_.n)}</span></summary>
      ${g_.holders.map(hh => `<div style="margin:6px 0 2px"><span class="small"><b>${esc(hh.holder)}</b> · ${hh.list.length}</span>
        <table class="dt small"><tbody>${hh.list.map(o => `<tr><td>${nl(o.node, (o.label || "").replace(/ in [^ ]+$/, ""))}</td><td class="mono">${esc(o.template)}</td><td>${o.base ? '<span class="muted">base-game copy</span>' : o.base === false ? '<span class="badge sv-error"><i></i>missing</span>' : ""}</td></tr>`).join("")}</tbody></table></div>`).join("")}</details>`).join("") +
      (gs.length > 300 ? `<p class="small muted">First 300 areas - narrow the search.</p>` : "");
  };
  filterBar($("#gpf", host), [{id:"q", type:"search", label:"Search object, blueprint or area…"},
    {id:"c", type:"select", label:"Any kind", options: [...new Set(rows.map(o => o.cls).filter(Boolean))].sort()},
    ...(hasBase ? [{id:"mo", type:"check", label:"Missing only (hide base-game copies)"}] : [])], draw);
  draw({q: "", c: "", mo: false});
}

// Duplicates page: each group with its keeper (the member with most references). Auto-mergeable groups can be
// ticked for the clean build (S.merge, remembered). "Use keeper instead" shows how the copy differs
// (/api/dupdiff), then opens Find & replace set up to point everything that uses the copy at the keeper.
VIEWS.duplicates = (m) => {
  const r = S.rep;
  const cats = [...new Set(r.duplicates.map(g => g.category))];
  m.innerHTML = `<h1>Duplicates</h1><p class="sub">Groups of resources that are the same (or suspiciously similar). The <b>keeper</b> is the member with most references. Identical groups with no script-code references can be merged automatically in the clean build; others need a decision.</p>
    <div class="filters" id="fb"></div><div class="row" style="margin:0 0 8px"><button class="btn" id="gcsv">Export CSV</button>${STATIC ? "" : ` <button class="btn" id="gimp" title="Load a spreadsheet: fill the merge column (yes / no) of an exported CSV">Import…</button>`}</div><div id="list"></div>
    <h2>Models and textures with the same content (module and haks)</h2><div id="adup"></div>`;
  assetDups($("#adup", m), r);
  let gshown = r.duplicates, gf = {};
  $("#gcsv", m).onclick = () => downloadCsv("duplicates.csv", ["group", "kind", "members", "keeper", "mergeable", "why_not", "merge"],
    gshown.map(g => [g.id, g.category, g.members.map(x => x.label).join("; "), (g.members.find(x => x.node === g.keeper) || {}).label || g.keeper,
                     g.mergeable ? "yes" : "no", g.blocked.join("; "), S.merge.has(g.id) ? "yes" : ""]));
  if (!STATIC) $("#gimp", m).onclick = () => sheetImport({url: `/api/plan/import?a=${encodeURIComponent(S.cur)}&kind=merge`, title: "Import merge decisions",
    lines: p => [`<b>${fmtN(p.tick.length)}</b> group(s) ticked to merge`, `<b>${fmtN(p.untick.length)}</b> un-ticked`],
    changes: p => p.tick.length + p.untick.length,
    apply: async p => { p.tick.forEach(g => S.merge.add(g)); p.untick.forEach(g => S.merge.delete(g)); remember(); draw(gf); }});
  const draw = f => {
    gf = f;
    const gs = gshown = r.duplicates.filter(g => (!f.cat || g.category === f.cat) && (!f.mg || g.mergeable) && has(f.q, g.category, ...g.members.map(x => x.label)));
    $("#list", m).innerHTML = gs.map(g => `<div class="card"><div class="row"><b class="grow">#${g.id} ${esc(g.category)}</b>
      ${g.mergeable?`<label class="small"><input type="checkbox" data-g="${g.id}" ${S.merge.has(g.id)?"checked":""} ${STATIC?"disabled":""}> merge in clean build</label>`:`<span class="badge sv-info"><i></i>manual decision</span>`}</div>
      <p class="small muted" style="margin:4px 0 8px">${esc(g.note)}</p>
      <div class="tw"><table class="dt"><thead><tr><th>Member</th><th>References</th><th>Impact</th><th></th></tr></thead><tbody>${g.members.map(x =>
        `<tr><td>${x.node.endsWith(".uti") || x.node.includes("ItemList") ? iconSlot(x.node) + " " : ""}${nl(x.node, x.label)}${x.differs ? `<br>${dupChips(x.differs)}` : ""}</td><td class="num">${fmtN(x.refs)}</td><td>${lvBadge(x.impact)}</td><td>${x.node===g.keeper?"<b>keeper</b>":(!STATIC && x.node.startsWith("bp:") && g.keeper.startsWith("bp:") ? `<button class="btn small" data-rk="${esc(x.node)}|${esc(g.keeper)}" title="Find everything that uses this copy and point it at the keeper instead">Use keeper instead…</button>` : "")}</td></tr>`).join("")}</tbody></table></div>
      ${g.blocked.length?`<div class="note warn small">Not auto-mergeable: ${g.blocked.map(esc).join("<br>")}</div>`:""}</div>`).join("") || `<p class="muted">No duplicates match.</p>`;
    $("#list", m).querySelectorAll("[data-g]").forEach(c => c.onchange = () => { c.checked ? S.merge.add(+c.dataset.g) : S.merge.delete(+c.dataset.g); remember(); });
    fillIcons($("#list", m));
    $("#list", m).querySelectorAll("[data-rk]").forEach(b => b.onclick = async () => { const [dup, keep] = b.dataset.rk.split("|");
      let dd; try { dd = await api(`/api/dupdiff?a=${encodeURIComponent(S.cur)}&x=${encodeURIComponent(keep)}&y=${encodeURIComponent(dup)}`); } catch(e){ errorBox(e.message); return; }
      const look = dd.diffs.filter(x => x.cls === "look");
      const go_ = await dialog({title: `${dup.slice(3)} → keeper ${keep.slice(3)}`, ok: "Find what uses it", danger: look.length > 0,
        html: dd.diffs.length ? `<p>${look.length ? `<b style="color:var(--critical-text)">They look different</b> (${look.length} appearance/colour field(s)) - wherever a script, store, encounter or conversation creates this copy, players will get the keeper's look instead (objects already placed in areas keep their own look - they store their own data). ` : ""}${dd.diffs.length} field(s) differ:</p>
          <div style="max-height:44vh;overflow:auto"><table class="dt small"><thead><tr><th>Field</th><th>What</th><th>Keeper</th><th>This copy</th></tr></thead><tbody>${dd.diffs.map(x => `<tr style="${x.cls==="look"?"background:color-mix(in srgb, var(--critical) 12%, transparent)":""}"><td class="mono">${esc(x.path)}</td><td>${esc(x.cls)}</td><td class="mono">${esc(x.a ?? "(none)")}</td><td class="mono">${esc(x.b ?? "(none)")}</td></tr>`).join("")}</tbody></table></div>`
          : `<p>Identical apart from the name of the file.</p>`});
      if (!go_) return;
      // "bp:name.uti" -> "name" (the resref, as scripts and fields write it)
      const res = x => x.slice(3).replace(/\.[a-z0-9]+$/, "");
      S.find = {text: res(dup), mode: "exact", case: true, kinds: ["script", "conversation", "object", "2da"], scope: "module", replace: res(keep), own: dup.slice(3).toLowerCase(),
                note: `Duplicate ${dup.slice(3)} → keeper ${keep.slice(3)}: tick what should use the keeper (leave the duplicate's own file alone), preview, then apply.`, auto: true};
      go("find"); });
  };
  filterBar($("#fb", m), [{id:"q", type:"search", label:"Search…"}, {id:"cat", type:"select", label:"All kinds", options: cats}, {id:"mg", type:"check", label:"Auto-mergeable only"}], draw);
  draw({});
};

// Duplicates page, second part: models and textures with the same content under different names, in the module and
// its haks (report.json asset_duplicates; nwn_analysis.asset_duplicates). For review only - models and 2das point at
// textures by name, and heads are picked by number - so there is nothing to tick here.
function assetDups(host, r){
  const gs = r.asset_duplicates;
  if (!gs){ host.innerHTML = `<p class="muted small">Analyse the module again to find these (older analyses don't have them).</p>`; return; }
  if (!gs.length){ host.innerHTML = `<p class="muted small">No model or texture has the same content as another under a different name.</p>`; return; }
  const kinds = [...new Set(gs.map(g => g.kind))];
  const extra = gs.reduce((a, g) => a + g.extra_bytes, 0);
  const total = (r.summary || {}).asset_duplicate_groups || gs.length;
  host.innerHTML = `<p class="small">${fmtN(total)} group(s)${total > gs.length ? ` - the ${fmtN(gs.length)} with the largest extra copies are listed here, all of them in <span class="mono">reports/asset_duplicates.csv</span>` : ""}; the extra copies listed take ${fmtBytes(extra)}. Models count as the same when only their own name differs (a model writes its name inside itself).</p>
    ${kinds.map(k => `<div class="note small"><b>${k === "model" ? "Models" : "Textures"}:</b> ${esc(gs.find(g => g.kind === k).note)}</div>`).join("")}
    <div class="filters" id="adf"></div><div id="adt"></div>`;
  const src = [...new Set(gs.flatMap(g => g.members.flatMap(x => x.sources)))].sort();
  const cols = [{key: "id", label: "#", num: true}, {key: "kind", label: "Kind", render: g => `${esc(g.kind)} <span class="muted small">.${esc(g.ext)}</span>`},

// Hierarchy page: the Module › Area › Object › Inventory tree from report.json; a branch's children are drawn
// when it is opened. The search uses /api/find (the full index), or the report's breadcrumbs when static.
VIEWS.hierarchy = (m) => {
  const r = S.rep;
  m.innerHTML = `<h1>Hierarchy</h1><p class="sub">Where everything lives: Module › Area › Object › Inventory. Click a name for details.</p>
    <div class="filters"><input type="search" id="hq" placeholder="Find object by name or tag…"></div><div id="hres"></div><div class="card" id="tree"></div>`;
  const node = (n, depth) => {
    const kids = n.children || [];
    if (n.type === "more") return `<li class="muted small">${esc(n.label)}</li>`;
    const lab = n.type === "group" ? `<b>${esc(n.label)}</b>` : `${n.type==="area"?"🗺 ":n.type==="module"?"📦 ":""}${nl(n.id, n.label)} ${r.impact[n.id]&&n.type!=="module"?lvBadge(r.impact[n.id].level):""}`;
    if (!kids.length) return `<li>${lab}</li>`;
    return `<li><details class="tn" ${depth<1?"open":""} data-id="${esc(n.id)}"><summary>${lab} <span class="muted small">(${kids.length})</span></summary><ul class="tree"></ul></details></li>`;
  };
  const index = {};
  (function walk(n){ index[n.id] = n; (n.children||[]).forEach(walk); })(r.hierarchy);
  const fill = (det) => { const ul = det.querySelector(":scope > ul"); if (ul.dataset.done) return; ul.dataset.done = 1;
    ul.innerHTML = (index[det.dataset.id].children||[]).map(c => node(c, 2)).join(""); bindTree(ul); };
  const bindTree = (root) => root.querySelectorAll("details.tn").forEach(d => { d.addEventListener("toggle", () => d.open && fill(d)); if (d.open) fill(d); });
  $("#tree", m).innerHTML = `<ul class="tree" style="padding-left:0">${node(r.hierarchy, 0)}</ul>`;
  bindTree($("#tree", m));
  const inst = Object.keys(r.breadcrumbs);
  // seq: only the reply to the latest keystroke is shown; an older, slower reply is dropped
  let seq = 0;
  $("#hq", m).oninput = async e => { const q = e.target.value.trim().toLowerCase(); if (q.length < 2){ $("#hres", m).innerHTML = ""; return; }
    let hits;
    if (STATIC) hits = inst.filter(k => label(k).toLowerCase().includes(q)).slice(0, 50).map(k => ({node: k, label: label(k), breadcrumb: r.breadcrumbs[k]}));
    else { const my = ++seq; let err = null;
      try { hits = (await api(`/api/find?a=${encodeURIComponent(S.cur)}&q=${encodeURIComponent(q)}`)).hits; } catch(e){ err = e; }
      if (my !== seq) return;
      if (err){ $("#hres", m).innerHTML = `<div class="note warn small">${esc(err.message)}</div>`; return; } }
    $("#hres", m).innerHTML = `<div class="card">${hits.map(h => `<div>${nl(h.node, h.label)} <span class="path">— ${esc(h.breadcrumb)}</span></div>`).join("") || "<span class='muted'>No match</span>"}</div>`; };
};

// quest health -> colour
const QH = {ok:"good", warning:"warning", broken:"critical", legacy:"neutral"};
// Journal quests, worst health first, each with its problems, entries, scripts and items.
function questsJournal(host, r){
  const qs = r.quests.slice().sort((a,b) => ["broken","legacy","warning","ok"].indexOf(a.health) - ["broken","legacy","warning","ok"].indexOf(b.health));
  host.innerHTML = `<div class="tiles">${["ok","warning","broken","legacy"].map(k => `<div class="tile"><div class="v" style="color:var(--${QH[k]}-text)">${qs.filter(q => q.health===k).length}</div><div class="l">${{ok:"healthy",warning:"warnings",broken:"broken",legacy:"legacy (not in journal, unused)"}[k]}</div></div>`).join("")}</div>` +
    (qs.map(q => `<div class="card" style="border-left:4px solid var(--${QH[q.health]})"><div class="row"><b class="grow">${nl(q.node, q.name || q.tag)} <span class="mono small muted">${esc(q.tag)}</span></b><span class="badge"><i style="background:var(--${QH[q.health]})"></i>${esc(q.health)}</span>${lvBadge(q.impact)}</div>
      ${q.problems.length?`<ul class="small" style="margin:6px 0">${q.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`:""}
      ${q.entries.length?`<details><summary class="small">${q.entries.length} journal entries</summary><ol class="small">${q.entries.map(e => `<li value="${e.id}">${esc(e.text)}${e.end?" <b>(ends quest)</b>":""}</li>`).join("")}</ol></details>`:""}
      <div class="small"><b>Updated/read by:</b> ${q.updated_by.map(esc).join(", ") || "<span class='muted'>nothing</span>"}</div>
      ${q.needs.length?`<div class="small"><b>Items involved:</b> ${q.needs.map(n => `<span class="chip" title="${esc(n.detail)} (${esc(n.by)})" style="${n.status!=="ok"?"background:var(--critical);color:#fff":""}">${esc(n.name)} · ${esc(n.status)}</span>`).join(" ")}</div>`:""}
      ${q.items.length?`<div class="small"><b>Linked items:</b> ${q.items.map(esc).join(", ")}</div>`:""}</div>`).join("") || `<p class="muted">No journal quests.</p>`);
}
// how an inferred quest keeps its state -> label
const QKIND = {token: "token", local: "variable on player", campaign: "campaign DB", journal: "journal", named: "helper"};
// Quests from scripts: health tiles, a grouping (system or package / quest giver / health / none) and filters.
// A quest's detail (questDetail) is only built when it is opened.
function questsInferred(host, r, iq){
  const S_ = iq.summary || {}, qs = iq.quests, byId = Object.fromEntries(qs.map(q => [q.id, q]));
  if (S_.error){ host.innerHTML = `<div class="note warn">${esc(S_.error)}</div>`; return; }
  host.innerHTML = `<div class="tiles">${["broken","warning","ok","legacy"].map(k => `<div class="tile click" role="button" tabindex="0" data-h="${k}"><div class="v" style="color:var(--${QH[k]}-text)">${fmtN(qs.filter(q => q.health===k).length)}</div><div class="l">${{ok:"can be finished",warning:"worth a look",broken:"can't be finished as written",legacy:"only unused scripts touch it"}[k]}</div></div>`).join("")}</div>
    <details class="card small"><summary><b>How these were found</b> · ${Object.entries(S_.by_kind||{}).map(([k,v]) => `${fmtN(v)} ${esc(QKIND[k]||k)}`).join(", ")}</summary>
      <p>Every script was read for quest state: helper pairs the module defines (${(S_.adapters||[]).map(a => `<span class="mono">${esc(a.setter)}/${esc(a.getter)}</span> in ${nl("script:"+a.defined_in, a.defined_in)}`).join(", ") || "none found"}), variables on the player or module (<span class="mono">SetLocalInt</span>…), the campaign database and the journal. Named constants are resolved (so <span class="mono">QT_DONEOGRE</span> is slot 34), and a constant's comment becomes the quest's name.</p>
      <p>${S_.token_length ? `Token strings are ${S_.token_length} characters long. ` : ""}${fmtN(S_.not_followed||0)} reads/writes use names built at runtime (e.g. <span class="mono">"Q_" + sTag</span>) and are not followed. Variables kept on NPCs or placeables are working state, not quests, and are left out.</p></details>
    <div class="filters" id="qfb"></div><div class="row small" id="qgrp" style="margin:0 0 8px"></div><div id="qlist"></div>`;
  const hubOf = {}; (iq.hubs||[]).forEach(h => h.quests.forEach(id => hubOf[id] = h));
  const fams = iq.families || [], famOf = Object.fromEntries(fams.map(f => [f.name, f]));
  const FK = {quests: ["quests", "good"], package: ["package - its own settings, not quests", "neutral"], system: ["module system / settings", "neutral"]};
  const modes = fams.length ? {"system or package, then set": "family", "quest giver (conversation)": "hub", "health": "health", "no grouping": "none"}
                            : {"quest giver (conversation)": "hub", "health": "health", "no grouping": "none"};
  if (!Object.values(modes).includes(S.qGroup)) S.qGroup = Object.values(modes)[0];
  const f0 = {q: "", k: "", h: "", fam: "", real: false};
  const hcount = qs => ["broken","warning"].map(h => { const n = qs.filter(q => q.health === h).length; return n ? `<span class="badge"><i style="background:var(--${QH[h]})"></i>${n} ${h}</span>` : ""; }).join(" ");
  const qItem = q => `<details class="qd" data-q="${esc(q.id)}" style="border-left:4px solid var(--${QH[q.health]});padding-left:8px;margin:6px 0"><summary><b>${esc(q.label)}</b> <span class="chip">${esc(QKIND[q.kind]||q.kind)}</span> <span class="mono small muted">${esc(q.kind==="token" ? "slot " + q.key : q.key)}</span> <span class="badge"><i style="background:var(--${QH[q.health]})"></i>${esc(q.health)}</span>
        <span class="small muted">stages ${q.values_set.map(esc).join(" → ") || "none set"}${q.problems.filter(p => p.level!=="info").length ? ` · ${q.problems.filter(p => p.level!=="info").length} problem(s)` : ""}${q.givers.length ? ` · given by ${esc([...new Set(q.givers.map(plainName))].slice(0, 2).join(", "))}` : ""}</span></summary><div class="qbody"></div></details>`;
  const sub = qs => { const who = topList(qs.flatMap(q => [...new Set(q.givers.map(plainName))]), 3, false); return who ? `<span class="gsub small muted">given by ${who}</span>` : ""; };
  const setCard = (k, qs) => `<details class="card gdet qset"><summary>${gTitle(k.replace(/\*$/, "…"))} <span class="chip">${qs.length}</span> ${hcount(qs)}${sub(qs)}</summary>${qs.map(qItem).join("")}</details>`;
  const famCard = (f, qs, open) => { const sets = {}; qs.forEach(q => (sets[q.set || "(on its own)"] = sets[q.set || "(on its own)"] || []).push(q));
    const L = Object.entries(sets).sort((a, b) => (a[0] === "(on its own)") - (b[0] === "(on its own)") || b[1].length - a[1].length);
    const nu = f.named_unused || [];
    return `<details class="card qfam" ${open ? "open" : ""}><summary><b>${esc(f.name)}</b> <span class="chip">${qs.length}${qs.length !== f.quests ? " of " + f.quests : ""}</span> <span class="badge"><i style="background:var(--${FK[f.kind][1]})"></i>${esc(FK[f.kind][0])}</span> ${hcount(qs)}
      <span class="gsub small muted">${esc(f.description)}${L.length > 1 ? ` · ${L.length} sets` : ""}</span></summary>
      ${f.length ? `<p class="small" style="margin:6px 0">${fmtN(f.quests)} slots in use of ${f.length}; ${fmtN(f.free_slots || 0)} free${nu.length ? `; <b>${nu.length} named in the include but never used</b>: ${nu.map(x => `<span class="mono">${esc(x.names.join("/"))}</span> (${x.slot})`).join(", ")}` : ""}. Token slot map: <a class="nl" href="#" data-go="vars">Variables & tags → Token slots</a>.</p>` : ""}
      ${L.length === 1 ? L[0][1].map(qItem).join("") : L.map(([k, v]) => k === "(on its own)" ? `<div class="small muted" style="margin:10px 0 2px">Not part of a set (${v.length})</div>${v.map(qItem).join("")}` : setCard(k, v)).join("")}</details>`; };
  const draw = f => {
    Object.assign(f0, f);
    const show = qs.filter(q => (!f0.k || (QKIND[q.kind]||q.kind) === f0.k) && (!f0.h || q.health === f0.h) &&
      (!f0.fam || q.family === f0.fam) && (!f0.real || (famOf[q.family] || {}).kind === "quests") &&
      has(f0.q, q.label, q.key, q.comment, q.family, q.set, ...q.key_exprs, ...q.scripts, ...q.givers, ...q.conversation_labels, ...q.items.map(i => i.name)));
    const L = $("#qlist", host), searching = !!(f0.q || f0.h || f0.fam);
    if (S.qGroup === "family"){
      const by = {}; show.forEach(q => (by[q.family] = by[q.family] || []).push(q));

// One inferred quest: problems with fixes, each stage with the script lines that set or check it, items, rewards

    ${q.problems.length ? `<ul class="small" style="margin:6px 0">${q.problems.map(p => `<li>${svBadge(p.level)} ${esc(p.text)}${p.fix ? `<div class="fixhint"><b>How to fix:</b> ${esc(p.fix)}</div>` : ""}</li>`).join("")}</ul>` : `<p class="small">No problems found.</p>`}

      ${q.stages.map(s => `<tr><td class="mono">${esc(s.value === "(any)" ? "(read)" : s.value)}${s.value === q.initial ? " <span class='muted'>(start)</span>" : ""}</td><td>${s.set_by.map(ref).join("<hr style='border:0;border-top:1px solid var(--line)'>") || "<span class='muted'>–</span>"}</td><td>${s.checked_by.map(ref).join("<hr style='border:0;border-top:1px solid var(--line)'>") || "<span class='muted'>–</span>"}</td></tr>`).join("")}</tbody></table></div>
    ${q.items.length ? `<div class="small" style="margin-top:6px"><b>Items:</b> ${q.items.map(i => `<span class="chip" title="${esc(i.detail)} (${esc(i.by)})" style="${i.status!=="ok"?"background:var(--critical);color:#fff":""}">${esc(i.role)} ${esc(i.name)} · ${esc(i.status)}</span>`).join(" ")}</div>` : ""}
    ${q.rewards.length ? `<div class="small"><b>Rewards:</b> ${q.rewards.map(r => `${esc(r.amount)} ${esc(r.kind)} <span class="muted">(${esc(r.by)})</span>`).join(", ")}</div>` : ""}
    ${q.givers.length ? `<div class="small"><b>Given by:</b> ${q.givers.map(esc).join(", ")}</div>` : ""}
    <div class="small muted">Names used: ${q.key_exprs.map(e => `<span class="mono">${esc(e)}</span>`).join(", ")}${q.adapter ? ` · helpers from ${esc(q.adapter)}` : ""}</div>`;
}
