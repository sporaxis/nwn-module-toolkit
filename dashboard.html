// ---------------------------------------------------------------- campaign databases
const DBSEV = {warning: "warn", error: "warn", info: ""};
const dbWho = xs => (xs || []).length ? xs.slice(0, 4).map(x => nl("script:" + x, x)).join(", ") + (xs.length > 4 ? ` <span class="muted">+${xs.length - 4}</span>` : "") : '<span class="muted">-</span>';
const dbVal = v => `<span class="mono small">${esc(String(v.value ?? ""))}</span>`;
// Database page: campaign databases and SQL found in the scripts (/api/database), optionally checked against
// database files read from a folder or uploaded (/api/database/load, /api/database/upload).
VIEWS.database = async (m) => {
  m.innerHTML = `<h1>Database</h1><p class="sub">Loading...</p>`;
  let d; try { d = await api(`/api/database?a=${encodeURIComponent(S.cur)}`); } catch(e){ m.innerHTML = `<h1>Database</h1><div class="note warn">${esc(e.message)}</div>`; return; }
  dbRender(m, d);
};
// Draws the Database page from one /api/database reply; tabs: databases, variables, SQL, files, script lines.
function dbRender(m, d){
  const sm = d.summary, F = d.findings || [];
  S.dbTab = S.dbTab || "dbs";
  const warn = F.filter(f => f.severity !== "info"), info = F.filter(f => f.severity === "info");
  const finding = f => `<div class="note ${DBSEV[f.severity] || ""} small" style="margin-top:6px">${esc(f.text)}${f.examples && f.examples.length ? `<div class="muted" style="margin-top:2px">${f.category.startsWith("db_stored") ? f.examples.map(esc).join(", ") : dbWho(f.examples)}</div>` : ""}${f.fix ? `<div class="fixhint"><b>How to fix:</b> ${esc(f.fix)}</div>` : ""}</div>`;
  m.innerHTML = `<h1>Database</h1><p class="sub">What the module keeps between server restarts: <b>campaign databases</b> (SetCampaignInt/String..., StoreCampaignObject - quest progress, bank chests, player data) and SQL tables. The scripts are always checked; load the database folder to also see what is actually stored.</p>
    <div class="card"><div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
      <input id="dbPath" style="flex:1;min-width:280px" placeholder="database folder, e.g. ...\\Documents\\Neverwinter Nights\\database or ~/Documents/Neverwinter Nights/database (or a server copy)" value="${esc(sm.folder && !sm.folder.startsWith("files you picked") ? sm.folder : d.suggested_folder || "")}">
      <button class="btn" id="dbBrowse">Browse…</button><button class="btn primary" id="dbRead">Read database folder</button><button class="btn" id="dbFiles" title="database files copied from anywhere - e.g. from your server">Load files…</button>${sm.loaded ? `<button class="btn" id="dbClear">Forget loaded files</button>` : ""}</div>
      <div class="small muted" style="margin-top:6px">${sm.loaded ? `Loaded ${fmtN(sm.files)} file(s) from <span class="mono">${esc(sm.folder)}</span> at ${esc(sm.loaded)} - read again to refresh.` : "No database files loaded yet - the checks below come from the scripts only."}
        Read-only: each file is copied first, so a running server's database is never locked or changed. Reads EE <span class="mono">.sqlite3</span> files, old BioWare <span class="mono">.DBF/.FPT</span> files, other SQLite files (NWNX) and <span class="mono">.sql</span> dumps.</div>
      <div id="dbMsg" class="small" style="margin-top:4px"></div></div>
    <div class="tiles"><div class="tile"><div class="v">${fmtN(sm.databases_used)}</div><div class="l">campaign databases the scripts use</div></div>
      <div class="tile"><div class="v">${fmtN(sm.live_calls)}</div><div class="l">script lines that store or read them (in scripts that run)</div></div>
      <div class="tile"><div class="v">${fmtN(sm.sql_calls)}</div><div class="l">SQL queries (EE SQLite / NWNX)</div></div>
      <div class="tile"><div class="v">${fmtN(sm.files)}</div><div class="l">database files loaded${sm.stored_rows ? ` (${fmtN(sm.stored_rows)} stored values)` : ""}</div></div>
      <div class="tile"><div class="v" style="color:${sm.warnings ? "var(--warning-text)" : "inherit"}">${fmtN(sm.warnings)}</div><div class="l">warnings</div></div></div>
    <details class="card small"><summary><b>How campaign databases work</b></summary><p>A script stores a value with <span class="mono">SetCampaignInt("MyWorld", "SomeName", 5, oPC)</span> and reads it back with <span class="mono">GetCampaignInt("MyWorld", "SomeName", oPC)</span>. The first argument is the <b>database</b> - one file per name in the game's (or server's) <span class="mono">database</span> folder: <span class="mono">myworld.sqlite3</span> in EE, <span class="mono">MYWORLD.DBF/.CDX/.FPT</span> in the original game (EE converts those the first time). With a player as the last argument the value belongs to that character; without, it is shared by everyone. The value is found only with the <b>same name and the same type</b> (Int with Int, String with String) - a read that doesn't match gets 0 or an empty string, silently. The folder is shared by every module the game or server runs, so it can hold other modules' databases. EE scripts can also run SQL on a campaign database (<span class="mono">SqlPrepareQueryCampaign</span>) or on the module/character (<span class="mono">SqlPrepareQueryObject</span>, kept in the save game or character file); NWNX adds a server database (<span class="mono">NWNX_SQL_*</span>, MySQL/SQLite on the server).</p></details>
    ${warn.length ? `<h3>Needs a look (${warn.length})</h3>${warn.map(finding).join("")}` : `<div class="note small" style="margin-top:8px">No warnings: every campaign value the scripts read is also written, with the same type.</div>`}
    ${info.length ? `<details class="card small" style="margin-top:8px"><summary><b>Good to know (${info.length})</b></summary>${info.map(finding).join("")}</details>` : ""}
    ${tabs("dbt", S.dbTab, [["dbs", `Databases (${d.databases.length})`], ["vars", "Variables"], ["sql", `SQL (${d.sql.length})`], d.files.length && ["files", `Files (${d.files.length})`], ["lines", `Script lines (${fmtN(d.uses.length)})`]])}
    <div id="dbBody"></div>`;
  m.querySelectorAll("[data-dbt]").forEach(b => b.onclick = () => { S.dbTab = b.dataset.dbt; dbRender(m, d); });
  $("#dbRead", m).onclick = async () => { const msg = $("#dbMsg", m); msg.textContent = "Reading..."; $("#dbRead", m).disabled = true;
    try { const nd = await post("/api/database/load", {a: S.cur, path: $("#dbPath", m).value}); dbRender(m, nd); } catch(e){ msg.textContent = e.message; $("#dbRead", m).disabled = false; } };
  $("#dbBrowse", m).onclick = () => browse($("#dbPath", m).value || d.suggested_folder || "", p => { $("#dbPath", m).value = p; }, "folder");
  $("#dbFiles", m).onclick = async () => { const fs = (await pickFiles(true)).filter(f => /\.(sqlite3|sqlite|db|dbf|fpt|cdx|sql)$/i.test(f.name));
    const msg = $("#dbMsg", m);
    if (!fs.length){ msg.textContent = "Pick .sqlite3 / .sqlite / .db files, old .dbf files (with their .fpt), or .sql dumps."; return; }
    // files are copied to the server one by one; start=1 on the first clears what an earlier upload left
    try { let i = 0;
      for (const f of fs){ msg.textContent = `Copying ${f.name} (${++i} of ${fs.length}, ${fmtBytes(f.size)})...`;
        const r = await apiRaw(`/api/database/upload?a=${encodeURIComponent(S.cur)}&name=${encodeURIComponent(f.name)}&start=${i === 1 ? 1 : 0}`, {method: "POST", body: f, headers: {"Content-Type": "application/octet-stream"}});
        if (!r.ok) throw new Error((r.body && r.body.error) || "upload failed"); }
      msg.textContent = "Reading...";
      dbRender(m, await post("/api/database/load", {a: S.cur, uploaded: true})); } catch(e){ msg.textContent = e.message; } };
  if ($("#dbClear", m)) $("#dbClear", m).onclick = async () => { try { dbRender(m, await post("/api/database/load", {a: S.cur, clear: true})); } catch(e){ errorBox(e.message); } };
  const host = $("#dbBody", m);
  const varRows = d.databases.flatMap(db => db.vars.map(v => ({...v, db: db.name})));

// ---------------------------------------------------------------- find everywhere + rename / replace
// how a duplicate differs from its keeper -> colour; dupChips shows the differences as chips
const DCL = {look: "critical", name: "warning", tag: "warning", stats: "serious", scripts: "serious", inventory: "neutral", variables: "neutral", other: "neutral"};
const dupChips = d => d.total ? `<span class="small muted">differs from keeper:</span> ${Object.entries(d.counts).map(([k, v]) => `<span class="chip" title="${esc(d.examples.filter(x => x.cls === k).map(x => x.path + ": " + (x.a ?? "-") + " → " + (x.b ?? "-")).join("\n"))}" style="border-color:var(--${DCL[k]||"neutral"})">${esc(k)} ${v}</span>`).join(" ")}` : `<span class="small muted">identical apart from its name</span>`;
// what Find can search -> label
const FKIND = {script: "scripts", conversation: "conversations", object: "blueprints, placed objects, areas", "2da": "2das", filename: "file names"};
// Find & replace page: search (/api/search), tick hits, preview the change (/api/refactor/plan) and apply it
// (/api/refactor/apply). Changes go to the analysis' edits, never the original module. Earlier changes are
// listed from /api/refactor/history; only the latest one not yet undone can be undone (/api/refactor/undo).
VIEWS.find = async (m) => {
  const F = S.find = S.find || {text: "", mode: "contains", case: true, kinds: Object.keys(FKIND), scope: "module", replace: ""};
  m.innerHTML = `<h1>Find & replace</h1><p class="sub">Search the whole module - script lines, conversation lines and script slots, every field of every blueprint, placed object, area and store (tags, resrefs, names, variables, inventories), 2da cells and file names. Each hit shows exactly where it is. Tick hits to rename or replace them: you see every change first, the changes go into <b>My edits</b> (never the original), and <b>Undo</b> puts them back.</p>
    ${F.note ? `<div class="note small">${esc(F.note)}</div>` : ""}
    <div class="card"><div class="row"><input type="search" id="fT" class="grow" placeholder="Name, tag, resref, variable, text…" value="${esc(F.text)}">
      <select class="f" id="fM"><option value="contains">part of a value</option><option value="word">whole word</option><option value="exact">whole value (exact name)</option></select>
      <label class="small"><input type="checkbox" id="fC" ${F.case?"checked":""}> match capitals</label>
      <select class="f" id="fS"><option value="module">module only</option><option value="all">module + haks + override</option></select>
      <button class="btn primary" id="fGo">Find</button></div>
      <div class="row small" style="margin-top:6px">${Object.entries(FKIND).map(([k, l]) => `<label><input type="checkbox" data-fk="${k}" ${F.kinds.includes(k)?"checked":""}> ${esc(l)}</label>`).join(" ")}</div></div>
    <div id="fRes"></div><div id="fHist"></div>`;
  $("#fM", m).value = F.mode; $("#fS", m).value = F.scope;
  const hist = async () => { try { const h = await api(`/api/refactor/history?a=${encodeURIComponent(S.cur)}`);
      $("#fHist", m).innerHTML = h.length ? `<h2>Earlier renames / replaces</h2>${h.slice().reverse().map((e, i) => `<div class="card row small"><span class="grow">${esc(e.when)} · "${esc(e.text)}" → "${esc(e.new)}" · ${e.changes} change(s) in ${e.files} file(s)${e.undone ? " · <b>undone</b>" : ""}</span>${!e.undone && i === h.slice().reverse().findIndex(x => !x.undone) ? `<button class="btn" data-fu="${esc(e.id)}">Undo</button>` : ""}</div>`).join("")}` : "";
      m.querySelectorAll("[data-fu]").forEach(b => b.onclick = async () => {
        if (!await dialog({title: "Undo this change?", html: "The edited files go back to how they were just before it (files it created are removed).", ok: "Undo"})) return;
        try { await post("/api/refactor/undo", {a: S.cur, id: b.dataset.fu}); hist(); } catch(e){ errorBox(e.message); } }); } catch(e){} };
  hist();
  const run = async () => {
    if (F.own && $("#fT", m).value !== F.text){ F.own = null; F.note = null; }
    F.text = $("#fT", m).value; F.mode = $("#fM", m).value; F.case = $("#fC", m).checked; F.scope = $("#fS", m).value;
    F.kinds = [...m.querySelectorAll("[data-fk]")].filter(c => c.checked).map(c => c.dataset.fk);
    const host = $("#fRes", m); host.innerHTML = `<p class="muted">Searching…</p>`;
    let r; try { r = await post("/api/search", {a: S.cur, text: F.text, mode: F.mode, case: F.case, kinds: F.kinds, scope: F.scope}); }
    catch(e){ host.innerHTML = `<div class="note warn">${esc(e.message)}</div>`; return; }
    // "Use keeper instead": the duplicate's own file and the palette are left alone (the build removes the duplicate)
    const skip = h => F.own && (h.file.toLowerCase() === F.own || /\.itp$/i.test(h.file));
    const sel = new Set(r.hits.filter(h => h.source === "module" && !skip(h)).map(h => h.id));
    const groups = {}; r.hits.forEach(h => (groups[h.file] = groups[h.file] || []).push(h));
    // highlight the search text in each hit: escape regex characters, split on the match (the capture group keeps
    // the matches, at odd indexes), esc() every piece and wrap the matches in mark
    const rxs = F.text ? new RegExp("(" + F.text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", F.case ? "g" : "gi") : null;
    const hl = v => rxs ? String(v || "").split(rxs).map((p, i) => i % 2 ? `<mark>${esc(p)}</mark>` : esc(p)).join("") : esc(v || "");
    host.innerHTML = `<div class="row" style="margin:10px 0"><b class="grow">${fmtN(r.total)} hit(s) in ${fmtN(r.files)} file(s)${r.truncated ? " (first " + fmtN(r.total) + " - narrow the search)" : ""}</b>
        ${Object.entries(r.by_kind).map(([k, v]) => `<span class="chip">${esc(FKIND[k] || k)}: ${fmtN(v)}</span>`).join(" ")}</div>
      ${r.runtime_risk.length ? `<div class="note warn small">Names built while the game runs could also produce or depend on "${esc(r.text)}" - those uses can't be found or changed here: ${r.runtime_risk.slice(0, 5).map(x => `${nl("script:" + x.script, x.script)}:${x.line} ("${esc(x.piece)}"${x.tag_built ? "" : " + …"})`).join(", ")}</div>` : ""}
      ${(r.notes || []).map(t => `<div class="note small">${esc(t)}</div>`).join("")}
      ${r.total ? `<div class="card row"><label class="small"><input type="checkbox" id="fAll" ${sel.size === r.hits.filter(h => h.source === "module").length ? "checked" : ""}> all module hits</label><span class="small muted grow" id="fSelN"></span>
        <label class="small">Replace with <input type="text" id="fNew" value="${esc(F.replace || "")}" style="width:240px"></label><button class="btn" id="fPlan">Preview changes…</button></div>` : ""}
      <div id="fList">${Object.entries(groups).map(([file, hs]) => `<details class="card" ${Object.keys(groups).length <= 30 ? "open" : ""}><summary><b class="mono">${esc(file)}</b> · ${hs.length} hit(s) · ${esc(hs[0].source)}${hs[0].what ? " · " + esc(hs[0].what) : ""}</summary>
        <table class="dt small"><tbody>${hs.map(h => `<tr><td style="width:24px">${h.source === "module" ? `<input type="checkbox" data-h="${esc(h.id)}" ${sel.has(h.id) ? "checked" : ""}>` : ""}</td>
          <td class="mono" style="white-space:nowrap">${esc(h.where)}</td><td class="mono">${hl(h.value)}</td><td>${h.node ? nl(h.node, h.owner) : ""}</td></tr>`).join("")}</tbody></table></details>`).join("")}</div>`;
    const upd = () => { const e = $("#fSelN", host); if (e) e.textContent = `${sel.size} ticked`; };
    host.querySelectorAll("[data-h]").forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.h) : sel.delete(c.dataset.h); upd(); });
    if ($("#fAll", host)) $("#fAll", host).onchange = e => { host.querySelectorAll("[data-h]").forEach(c => { c.checked = e.target.checked; c.checked ? sel.add(c.dataset.h) : sel.delete(c.dataset.h); }); upd(); };
    upd();
    if ($("#fPlan", host)) $("#fPlan", host).onclick = async () => {
      const nv = $("#fNew", host).value; F.replace = nv;
      if (!sel.size){ errorBox("Tick at least one hit."); return; }
      let p; try { p = await post("/api/refactor/plan", {a: S.cur, text: F.text, new: nv, ids: [...sel], mode: F.mode, case: F.case, kinds: F.kinds}); }
      catch(e){ errorBox(e.message); return; }
      const ok = p.changes.filter(c => c.ok), bad = p.changes.filter(c => !c.ok);
      // a rename (exact / whole word) must change every ticked use, so the server refuses the whole apply (nwn_refactor)
      const blocked = bad.length > 0 && (F.mode === "exact" || F.mode === "word");
      const html = `<p>${ok.length} change(s) in ${p.files.length} file(s) go into your edits${bad.length ? `; <b>${bad.length} can't be changed</b> (listed below)` : ""}. The original module is not touched; the clean build applies the edits.</p>
        ${p.runtime_risk.filter(x => !x.tag_built).length ? `<p class="small" style="color:var(--critical-text)">Names built at run time could still produce the old name - check ${p.runtime_risk.filter(x => !x.tag_built).slice(0,3).map(x => esc(x.script) + ":" + x.line).join(", ")}.</p>` : ""}
        ${p.runtime_risk.filter(x => x.tag_built).length ? `<p class="small" style="color:var(--critical-text)">Scripts build names from object tags (e.g. <span class="mono">"${esc(p.runtime_risk.find(x => x.tag_built).piece.replace("<tag>", '" + GetTag(o) + "'))}"</span>): renaming this tag changes those names too, so values stored under the old name are no longer found - ${p.runtime_risk.filter(x => x.tag_built).slice(0,4).map(x => esc(x.script) + ":" + x.line).join(", ")}.</p>` : ""}
        ${(p.notes || []).map(t => `<p class="small note warn">${esc(t)}</p>`).join("")}
        ${blocked ? `<p class="small" style="color:var(--critical-text)"><b>Apply is blocked:</b> a rename must change every ticked use. Untick the hits below that can't be changed (only if leaving them is really what you want), or fix them first.</p>` : ""}
        <div style="max-height:46vh;overflow:auto"><table class="dt small"><thead><tr><th>Where</th><th>Before</th><th>After</th></tr></thead><tbody>
        ${ok.slice(0, 400).map(c => `<tr><td class="mono">${esc(c.file)}<br><span class="muted">${esc(c.where)}</span></td><td class="mono">${esc(c.before)}</td><td class="mono" style="color:var(--good-text)">${esc(c.after)}</td></tr>`).join("")}
        ${bad.map(c => `<tr><td class="mono">${esc(c.file)}<br><span class="muted">${esc(c.where)}</span></td><td class="mono">${esc(c.before)}</td><td style="color:var(--critical-text)">${esc(c.why)}</td></tr>`).join("")}</tbody></table></div>
        ${ok.some(c => c.kind === "filename") ? `<p class="small">Renamed files: the renamed copy is added and the old name is dropped from the clean build. Anything still using the old name will be flagged by the build's audit.</p>` : ""}`;
      if (!ok.length || blocked){ dialog({title: blocked ? "Apply is blocked" : "Nothing can be changed", html, ok: "Close", cancel: null}); return; }
      if (!await dialog({title: `Apply ${ok.length} change(s)?`, html, ok: "Apply to my edits", check: "I've checked the changes"})) return;
      try { const res = await post("/api/refactor/apply", {a: S.cur, text: F.text, new: nv, ids: [...sel], mode: F.mode, case: F.case, kinds: F.kinds, confirm: "yes"});
        doneBox(`Done: ${res.changes} change(s) written to ${res.written.length} file(s) in your edits. Re-analyse or build to see the result; Undo is below.`); hist(); run(); }
      catch(e){ errorBox(e.message); } };
  };
  $("#fGo", m).onclick = run; $("#fT", m).onkeydown = e => { if (e.key === "Enter") run(); };
  if (F.auto){ F.auto = false; run(); }
};

// ---------------------------------------------------------------- persistent-world performance
// performance finding category -> label
const PCAT = {perf_area_heartbeats: "many custom heartbeats", perf_heavy_heartbeat: "heavy heartbeat script", perf_empty_heartbeat: "empty heartbeat script",
  perf_spawn_density: "crowded area", perf_inventory: "huge inventory", perf_delay_in_loop: "DelayCommand in a loop", perf_self_reschedule: "self-rescheduling script",
  perf_static_candidates: "could be Static"};
// Performance page (report.json pw_performance): heartbeat scripts by load, areas by load, and findings.
VIEWS.perf = (m) => {
  const pp = S.rep.pw_performance;
  if (!pp){ m.innerHTML = `<h1>Performance</h1><div class="note">This analysis was made before the performance checks existed. Re-analyse the module to see them.</div>`; return; }
  if (pp.summary.error){ m.innerHTML = `<h1>Performance</h1><div class="note warn">${esc(pp.summary.error)}</div>`; return; }
  const sm = pp.summary, th = sm.thresholds || {};
  S.pTab = S.pTab || (pp.heartbeats ? "hb" : "areas");
  m.innerHTML = `<h1>Performance</h1><p class="sub">What costs a persistent-world server CPU and players bandwidth: heartbeats (every object's OnHeartbeat runs every 6 seconds, forever), crowded areas, scripts that queue many delayed actions or quietly reschedule themselves, huge inventories, and placeables that could be Static.</p>
    <div class="tiles">${sm.heartbeat_runs_per_min != null ? `<div class="tile"><div class="v">${fmtN(sm.heartbeat_runs_per_min)}</div><div class="l">heartbeat runs a minute${(sm.heartbeat_top || []).length ? ` - most from ${esc(sm.heartbeat_top[0].script)} (${sm.heartbeat_top[0].share}%)` : ""}</div></div>` : ""}<div class="tile"><div class="v">${fmtN(sm.custom_heartbeat_objects)}</div><div class="l">placed objects with custom heartbeat scripts (${fmtN(sm.heartbeat_scripts)} scripts)</div></div>
      <div class="tile"><div class="v">${fmtN(sm.ai_heartbeat_objects)}</div><div class="l">objects with the standard AI heartbeat</div></div>
      <div class="tile"><div class="v">${fmtN(sm.placed_creatures)}</div><div class="l">creatures placed in ${fmtN(sm.areas)} areas</div></div>
      <div class="tile"><div class="v">${fmtN(sm.big_inventories)}</div><div class="l">huge inventories</div></div>
      <div class="tile"><div class="v" style="color:var(--good-text)">${fmtN(sm.static_candidates)}</div><div class="l">placeables that could be Static</div></div></div>
    ${tabs("pt", S.pTab, [pp.heartbeats && ["hb", `Heartbeats by load (${fmtN(pp.heartbeats.length)})`], ["areas", `Areas by load (${fmtN(pp.areas.length)})`], ["find", `Findings (${fmtN(pp.findings.length)})`]])}
    <div id="pbody"></div>
    <p class="small muted">Thresholds: more than ${th.area_creatures} creatures or ${th.area_custom_heartbeats} custom heartbeats in an area, containers over ${th.container_items} items, stores over ${th.store_items}. "Could be Static" = not usable, no scripts, no inventory, no conversation, no variables (scripts that walk an area to add visual effects can't see Static placeables), and its tag is never looked up. Warnings also appear on the Issues page, where you can accept them as by design. Also in <span class="mono">reports/performance_*.csv</span>.</p>`;
  m.querySelectorAll("[data-pt]").forEach(b => b.onclick = () => { S.pTab = b.dataset.pt; VIEWS.perf(m); });
  const host = $("#pbody", m);
  if (S.pTab === "hb" && pp.heartbeats){
    const H = pp.heartbeats, sh = x => x.standard ? x.share : (x.share_custom ?? x.share);
    // bars are scaled within each kind (standard AI / custom), so custom scripts are not dwarfed by the AI
    const maxShare = {true: Math.max(1, ...H.filter(x => x.standard).map(sh)), false: Math.max(1, ...H.filter(x => !x.standard).map(sh))};
    host.innerHTML = `<p class="small">Every heartbeat script runs every 6 seconds for each object that has it. Custom scripts show their share <i>among custom scripts</i> (standard creature AI usually dwarfs them). <b>Load</b> = copies running × a relative cost per run, read from the code and the include functions it calls (walking every object in an area, nearest-object searches, database calls, creating objects...). It ranks scripts; it is not a timing measurement. ${fmtN(sm.heartbeat_runs_per_min || 0)} heartbeat runs a minute in total from placed objects, areas and the module (creatures spawned at run time come on top).</p>
      <div class="split"><div id="hbt"></div><div id="hbd" class="side"></div></div>`;
    const detail = x => { const el = $("#hbd", host);
      el.innerHTML = `<div class="card"><h3 style="margin-top:0">${nl(x.node, x.script)} ${x.standard ? '<span class="chip">standard AI</span>' : ""}</h3>
        <div class="small">${x.copies ? `<b>${fmtN(x.copies)}</b> copies × 10 runs a minute = <b>${fmtN(x.runs_per_min)}</b> runs/min · cost per run ${x.weight} · <b>${x.share}%</b> of all heartbeat load${x.standard ? "" : ` (${sh(x)}% of custom-script load)`}${x.blueprints ? ` · also on ${fmtN(x.blueprints)} blueprint(s) - spawned copies come on top` : ""}` : `Not on any placed object - only on ${fmtN(x.blueprints)} blueprint(s), so its load depends on how many get spawned while the server runs · cost per run ${x.weight}`}</div>
        <div class="small" style="margin-top:4px"><b>Runs on:</b> ${Object.entries(x.kinds).map(([k, n]) => `${fmtN(n)} ${esc(k)}${n === 1 ? "" : "s"}`).join(", ")}${x.area_events ? ` · ${x.area_events} area OnHeartbeat` : ""}${x.module ? " · the module's OnHeartbeat" : ""}</div>
        ${x.areas.length ? `<div class="small"><b>Most in:</b> ${x.areas.map(a => `${nl("area:" + a.area, a.label)} (${fmtN(a.n)})`).join(", ")}${x.areas_total > x.areas.length ? ` and ${fmtN(x.areas_total - x.areas.length)} more areas` : ""}</div>` : ""}
        <div class="small"><b>What one run does:</b> ${x.factors.length ? x.factors.map(esc).join(", ") : "nothing costly"}${x.early_exit ? " · <b>exits early</b> (e.g. when nobody is around)" : ""}</div>
        <div class="small fixhint"><b>How to fix:</b> ${esc(x.fix)}</div></div>`; showSide(el); };
    new GroupedTable($("#hbt", host), {rows: H, onRow: detail,
      groupings: {"standard AI or custom": x => x.standard ? "Standard creature AI (BioWare / CEP / henchman)" : "Custom scripts",
                  "what one run does": x => x.factors.length ? x.factors[0].replace(/ \(\d+x\)$/, "") : "nothing costly", "no grouping": () => "All heartbeat scripts"},
      columns: [
        {key:"script", label:"Script", render: x => `<span class="mono">${esc(x.script)}</span>${x.live === false ? ' <span class="chip">unused</span>' : ""}`},
        {key:"share", label:"Share of load", render: x => `<div style="display:flex;align-items:center;gap:6px" title="${x.standard ? "share of all heartbeat load" : `share among custom scripts (${x.share}% of all heartbeat load)`}"><div style="height:8px;width:90px;background:var(--line);border-radius:4px;overflow:hidden"><div style="height:100%;width:${sh(x) / maxShare[x.standard] * 100}%;background:var(--${sh(x) >= 20 ? "critical" : sh(x) >= 5 ? "warning" : "accent"})"></div></div><span class="small">${sh(x)}%</span></div>`, sort: x => x.cost},
        {key:"copies", label:"Copies", num: true, render: x => x.copies ? fmtN(x.copies) : `<span class="muted small">spawned only</span>`, sort: x => x.copies},
        {key:"weight", label:"Cost per run", num: true},
        {key:"early_exit", label:"Early exit", render: x => x.early_exit ? "yes" : '<span class="muted">no</span>'},
        {key:"factors", label:"What one run does", render: x => `<span class="small">${esc(x.factors.slice(0, 2).join(", ") || "-")}</span>`}]});
  } else if (S.pTab === "areas"){
    host.innerHTML = `<div class="filters" id="pfb"></div><div id="pt"></div>`;
    let t; const draw = f => { const rows = pp.areas.filter(a => has(f.q, a.area));
      if (t) t.set(rows); else t = new Table($("#pt", host), {rows, onRow: a => openNode(a.node), columns: [
        {key:"area", label:"Area", render: a => nl(a.node, a.area)}, {key:"score", label:"Load score", num: true},
        {key:"creatures", label:"Creatures", num: true, render: a => `<span style="${a.creatures > th.area_creatures ? "color:var(--critical-text);font-weight:600" : ""}">${a.creatures}</span>`},
        {key:"encounter_max", label:"Encounters can spawn", num: true},
        {key:"custom_heartbeats", label:"Custom heartbeats", num: true, render: a => `<span style="${a.custom_heartbeats > th.area_custom_heartbeats ? "color:var(--critical-text);font-weight:600" : ""}">${a.custom_heartbeats}</span>`},
        {key:"ai_heartbeats", label:"AI heartbeats", num: true}, {key:"placeables", label:"Placeables", num: true},
        {key:"static_candidates", label:"Could be Static", num: true}, {key:"items", label:"Items", num: true},
        {key:"big_containers", label:"Huge inventories", num: true}]}); };
    filterBar($("#pfb", host), [{id:"q", type:"search", label:"Area…"}], draw); draw({});
  } else {
    host.innerHTML = `<div class="filters" id="pfb"></div><div id="pt"></div>`;
    let t; const draw = f => { const rows = pp.findings.filter(x => (!f.c || x.category === f.c) && (!f.s || x.severity === f.s) && has(f.q, x.label, x.detail));
      if (t) t.set(rows); else t = new GroupedTable($("#pt", host), {rows, onRow: x => openNode(x.node),
        groupings: {"kind": x => PCAT[x.category] || x.category, "area": x => areaOfNode(x.node), "severity": x => x.severity}, columns: [
        {key:"severity", label:"", render: x => svBadge(x.severity), sort: x => ["error","warning","info"].indexOf(x.severity)},
        {key:"category", label:"What", render: x => `<span class="small">${esc(PCAT[x.category] || x.category)}</span>`},
        {key:"label", label:"Where", render: x => nl(x.node, x.label)},
        {key:"detail", label:"Detail", render: x => `<span class="small">${esc(x.detail)}</span>${PFIX[x.category] ? `<div class="small fixhint"><b>How to fix:</b> ${esc(PFIX[x.category])}</div>` : ""}`}]}); };
    filterBar($("#pfb", host), [{id:"q", type:"search", label:"Search…"}, {id:"c", type:"select", label:"Any kind", options: Object.entries(PCAT)},
      {id:"s", type:"select", label:"Any severity", options:["warning","info"]}], draw); draw({});
  }
};

// ---------------------------------------------------------------- modules-folder housekeeping
// waitJob(id, onTick): poll /api/job every 0.7 s until the job is no longer running; resolves with the last
// reply and throws if a poll fails.
async function waitJob(id, onTick){
  for (;;){ const d = await api(`/api/job?id=${id}`); onTick && onTick(d); if (d.status !== "running") return d; await new Promise(r => setTimeout(r, 700)); }
}
// Modules folder page: scan (/api/housekeep/scan, a job) for module copies that can go to an archive; move the
// ticked files there (/api/housekeep/move, only after typing MOVE) and undo a move (/api/housekeep/undo).
// Nothing is deleted.
VIEWS.housekeep = async (m) => {
  m.innerHTML = `<p class="muted">Loading…</p>`;
  const st = await api("/api/housekeep/state"), pr = st.prefs || {};
  m.innerHTML = `<h1>Modules folder</h1><p class="sub">Find module copies you no longer need - identical copies, old versions, toolset backups (<span class="mono">.BackupMod</span>) and empty files - and move them to an archive folder. Nothing is deleted: every move writes a list of what went where, and <b>Undo</b> puts the files back.</p>
    <div class="card"><div class="row"><label class="small grow">Modules folder<br><input type="text" class="wide" id="hkF" value="${esc(st.folder||"")}" placeholder="e.g. C:\\Users\\you\\Documents\\Neverwinter Nights\\modules or ~/Documents/Neverwinter Nights/modules"></label></div>
      <div class="row small" style="margin-top:8px">Keep the newest <input type="number" id="hkN" min="1" max="50" value="${pr.keep_newest||3}" style="width:60px"> of each family
        <label><input type="checkbox" id="hkM" ${pr.keep_monthly?"checked":""}> and the newest of each month</label></div>
      <label class="small" style="display:block;margin-top:8px">Always keep (one file name per line)<br><textarea id="hkK" rows="2" class="wide">${esc((pr.keep_names||[]).join("\n"))}</textarea></label>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="hkScan">Scan</button><span class="small muted" id="hkMsg"></span></div></div>
    <div id="hkRes"></div><div id="hkBatches"></div>`;
  const drawBatches = bs => { $("#hkBatches", m).innerHTML = bs.length ? `<h2>Earlier moves</h2>${bs.slice().reverse().map(b_ => `<div class="card row small"><span class="grow">${esc(b_.created)} · ${b_.moved} file(s), ${fmtBytes(b_.moved_bytes)} → <span class="mono">${esc(b_.dest)}</span>${b_.undone ? " · <b>undone</b>" : ""}</span>${b_.undone ? "" : `<button class="btn" data-undo="${esc(b_.manifest)}">Undo</button>`}</div>`).join("")}` : "";
    m.querySelectorAll("[data-undo]").forEach(b_ => b_.onclick = async () => {
      if (!await dialog({title: "Put these files back?", html: "The files go back to the modules folder. A file whose name is already back there is left in the archive.", ok: "Undo"})) return;
      const r = await post("/api/housekeep/undo", {manifest: b_.dataset.undo}); const d = await waitJob(r.job);
      (d.status === "done" ? doneBox : errorBox)(d.status === "done" ? `Put back ${d.result.put_back} file(s).` : (d.lines.slice(-1)[0] || d.status)); VIEWS.housekeep(m); }); };
  drawBatches(st.batches || []);
  const drawRes = last => {
    if (!last){ $("#hkRes", m).innerHTML = ""; return; }
    const sm = last.summary, fs = last.files, sel = new Set(fs.filter(f => f.suggest).map(f => f.name));
    const upd = () => { const b = fs.filter(f => sel.has(f.name)).reduce((a, f) => a + f.size, 0);
      $("#hkSel", m).textContent = `${sel.size} ticked · ${fmtBytes(b)}`; $("#hkMove", m).disabled = !sel.size; };
    $("#hkRes", m).innerHTML = `<div class="tiles"><div class="tile"><div class="v">${fmtN(sm.files)}</div><div class="l">module files (${fmtN(sm.backups)} .BackupMod) · ${fmtBytes(sm.bytes)}</div></div>
      <div class="tile"><div class="v">${fmtN(sm.families)}</div><div class="l">families</div></div>
      <div class="tile"><div class="v">${fmtN(sm.identical_sets)}</div><div class="l">sets of identical copies</div></div>
      <div class="tile"><div class="v" style="color:var(--good-text)">${fmtBytes(sm.suggested_bytes)}</div><div class="l">${fmtN(sm.suggested)} files suggested for the archive</div></div></div>
      <p class="small muted">Scanned ${esc(sm.scanned_at)}. Never suggested: the newest of each family, the toolset backup of your newest version, anything changed in the last 2 days, anything an analysis was made from, and your keep list. Folders (${(sm.folders_left_alone||[]).length}) and .rar files are left alone.</p>
      <div class="row"><span class="small grow" id="hkSel"></span><label class="small">Archive to (blank = <span class="mono">_toolkit_archive\\&lt;date&gt;</span> inside the folder) <input type="text" id="hkDest" style="width:320px"></label><button class="btn danger" id="hkMove">Move ticked files…</button></div>
      ${last.families.map(fa => `<details class="card" ${fa.count > 1 ? "open" : ""}><summary><b>${esc(fa.family)}</b> · ${fa.count} file(s) · ${fmtBytes(fa.bytes)}</summary><table class="dt small"><tbody>
        ${fs.filter(f => f.family === fa.family).map(f => `<tr><td><input type="checkbox" data-n="${esc(f.name)}" ${sel.has(f.name)?"checked":""}></td><td class="mono">${esc(f.name)}</td><td>${esc(f.modified)}</td><td class="num">${fmtBytes(f.size)}</td>
          <td>${f.suggest ? `<span class="badge st-Safe"><i></i>archive</span> ${esc(f.archive_reasons.join("; "))}` : `<span class="badge"><i style="background:var(--good)"></i>keep</span> ${esc((f.keep_reasons||[]).join("; ") || f.archive_reasons.join("; "))}`}${f.identical_to ? ` <span class="muted">(identical to ${esc(f.identical_to)})</span>` : ""}</td></tr>`).join("")}</tbody></table></details>`).join("")}`;
    m.querySelectorAll("[data-n]").forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.n) : sel.delete(c.dataset.n); upd(); });
    upd();
    $("#hkMove", m).onclick = async () => {
      const n = sel.size, bytes = fs.filter(f => sel.has(f.name)).reduce((a, f) => a + f.size, 0);
      const typed = await dialog({title: `Move ${n} file(s) to the archive?`, danger: true, ok: "Move", input: {placeholder: "type MOVE"},
        html: `<p>${n} file(s), ${fmtBytes(bytes)}, will be moved out of the modules folder into ${esc($("#hkDest", m).value || "a new _toolkit_archive folder inside it")}. The game and toolset won't list them any more. Nothing is deleted, and Undo puts them back.</p><p>Files another program has open (the toolset, the game) are skipped. Type <b>MOVE</b> to confirm.</p>`});
      if (typed == null) return;
      try { const r = await post("/api/housekeep/move", {folder: sm.folder, names: [...sel], dest: $("#hkDest", m).value.trim(), confirm: typed});
        const d = await waitJob(r.job, d => $("#hkMsg", m).textContent = d.msg || "Moving…");
        const res = d.result || {};
        (d.status === "done" ? doneBox : errorBox)(d.status === "done" ? `Moved ${res.moved} file(s) (${fmtBytes(res.moved_bytes)}) to ${res.dest}.` + (res.skipped && res.skipped.length ? ` Skipped ${res.skipped.length}: ${res.skipped.slice(0,4).map(e => e.name + " - " + e.status).join("; ")}` : "") : (d.lines.slice(-1)[0] || d.status));
        VIEWS.housekeep(m); }
      catch(e){ errorBox(e.message); } };
  };
  // show the last scan only if it was of the folder in the box
  drawRes(st.last && osSame(st.last.summary.folder, st.folder) ? st.last : null);
  $("#hkScan", m).onclick = async () => {
    const b = $("#hkScan", m); b.disabled = true; b.textContent = "Scanning…";
    try { const r = await post("/api/housekeep/scan", {folder: $("#hkF", m).value.trim(), keep_newest: +$("#hkN", m).value, keep_monthly: $("#hkM", m).checked,
            keep_names: $("#hkK", m).value.split("\n").map(x => x.trim()).filter(Boolean)});
      const d = await waitJob(r.job, d => $("#hkMsg", m).textContent = d.msg || "Scanning…");
      if (d.status !== "done") throw new Error(d.lines.slice(-1)[0] || d.status);
      $("#hkMsg", m).textContent = ""; const st2 = await api("/api/housekeep/state"); drawRes(st2.last); }
    catch(e){ $("#hkMsg", m).textContent = e.message; }
    finally { b.disabled = false; b.textContent = "Scan"; } };
};
// ---------------------------------------------------------------- compare two copies of a module
// Compare modules page: compare two copies or snapshots (/api/diff/compare, a job; result from /api/diff/result),
// optionally with impact from an analysis, and take snapshots (/api/diff/snapshot). Lists from /api/diff/state.
VIEWS.compare = async (m) => {
  m.innerHTML = `<p class="muted">Loading…</p>`;
  const st = await api("/api/diff/state");
  const cur = (st.analyses.find(a => a.name === S.cur) || {});
  S.cmp = S.cmp || {older: "", newer: cur.module_path || "", analysis: S.cur || ""};
  m.innerHTML = `<h1>Compare modules</h1><p class="sub">What changed between two copies of a module - added, removed and changed files, and for each change the fields or script lines that differ. With an analysis, every change shows its impact level, and a removed file shows how many things used it.</p>
    <div class="card"><datalist id="cmpList">${st.snapshots.map(x => `<option value="${esc(x.path)}">snapshot ${esc(x.module)} ${esc(x.taken)}</option>`).join("")}${st.analyses.filter(a => a.module_path).map(a => `<option value="${esc(a.module_path)}">analysed: ${esc(a.name)}</option>`).join("")}</datalist>
      <label class="small">Older copy (.mod, module folder or a snapshot)<br><input type="text" class="wide" id="cmpA" list="cmpList" value="${esc(S.cmp.older)}"></label>
      <label class="small" style="display:block;margin-top:8px">Newer copy<br><input type="text" class="wide" id="cmpB" list="cmpList" value="${esc(S.cmp.newer)}"></label>
      <div class="row small" style="margin-top:8px">Impact from the analysis <select class="f" id="cmpAn"><option value="">(none)</option>${st.analyses.map(a => `<option ${a.name===S.cmp.analysis?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="cmpGo">Compare</button><button class="btn" id="cmpSnap" title="Keep a small record of the newer copy (hashes + script text) so you can compare against it after the .mod is gone">Take a snapshot of the newer copy</button><span class="small muted" id="cmpMsg"></span></div>
      ${st.snapshots.length ? `<details class="small" style="margin-top:8px"><summary>${st.snapshots.length} snapshot(s)</summary>${st.snapshots.map(x => `<div class="mono">${esc(x.name)} · ${fmtBytes(x.bytes)}</div>`).join("")}</details>` : ""}</div>
    <div id="cmpRes"></div>`;
  const run = async (url, body, label) => { const msg = $("#cmpMsg", m);
    try { const r = await post(url, body); const d = await waitJob(r.job, x => msg.textContent = `${label}: ${x.pct != null ? Math.floor(x.pct) + "% " : ""}${x.msg || ""}`);
      if (d.status !== "done") throw new Error(d.lines.slice(-1)[0] || d.status); msg.textContent = ""; return d.result; }
    catch(e){ msg.textContent = e.message; return null; } };
  $("#cmpGo", m).onclick = async () => { S.cmp = {older: $("#cmpA", m).value.trim(), newer: $("#cmpB", m).value.trim(), analysis: $("#cmpAn", m).value};
    $("#cmpRes", m).innerHTML = "";
    if (!S.cmp.older || !S.cmp.newer){ $("#cmpMsg", m).textContent = "Fill in both copies first (pick from the list or paste a path)."; return; }
    $("#cmpMsg", m).textContent = "Starting…";
    if (await run("/api/diff/compare", S.cmp, "Comparing")) showCmp(); };
  $("#cmpSnap", m).onclick = async () => { const lab = await dialog({title: "Take a snapshot", ok: "Take snapshot", input: {placeholder: "label (optional), e.g. before the cleanup"},
      html: `<p>Records a fingerprint of every file in <span class="mono">${esc($("#cmpB", m).value)}</span> plus the text of its scripts and 2das (a few MB). Compare against it later, even after the .mod itself is archived.</p>`});
    if (lab == null) return; const r = await run("/api/diff/snapshot", {module: $("#cmpB", m).value.trim(), label: lab}, "Snapshot");
    if (r){ doneBox(`Snapshot saved: ${r.resources} files, ${fmtBytes(r.bytes)}.`); VIEWS.compare(m); } };
  const showCmp = async () => {
    const res = await api("/api/diff/result"); if (!res.summary) return;
    const sm = res.summary, ch = res.changes;
    const who = sm.analysis ? `Impact and "used by" come from the analysis <b>${esc(sm.analysis)}</b>${sm.analysis_is_of === "newer" ? " (of the newer copy)" : sm.analysis_is_of === "older" ? " - an analysis of the <b>older</b> copy, so \"used by\" means used before the change" : ""}.` : "Pick an analysis to see impact levels.";
    $("#cmpRes", m).innerHTML = `<div class="tiles"><div class="tile"><div class="v">${fmtN(sm.changed)}</div><div class="l">changed</div></div>
      <div class="tile"><div class="v">${fmtN(sm.added)}</div><div class="l">added</div></div>
      <div class="tile"><div class="v">${fmtN(sm.removed)}</div><div class="l">removed${sm.removed_used ? ` · <b style="color:var(--critical-text)">${sm.removed_used} still used</b>` : ""}</div></div>
      <div class="tile"><div class="v">${fmtBytes(sm.bytes_new - sm.bytes_old)}</div><div class="l">size change (${fmtBytes(sm.bytes_old)} → ${fmtBytes(sm.bytes_new)})</div></div></div>
      <p class="small muted">${esc(sm.older)} → ${esc(sm.newer)} · compared ${esc(sm.compared_at)}. ${who}</p>
      <div class="filters" id="cfb"></div><div class="split"><div id="ct"></div><div id="cdet" class="side"></div></div>`;
    const det = c => { $("#cdet", m).innerHTML = `<div class="card"><div class="row"><b class="grow mono">${esc(c.file)}</b>${c.node ? nl(c.node, c.label) : ""}${c.impact ? " " + lvBadge(c.impact) : ""}</div>
      ${c.note ? `<p class="small muted">${esc(c.note)}</p>` : ""}
      ${c.used_by ? `<p class="small" style="color:var(--critical-text)">Removed, but ${c.used_by} thing(s) in the analysis use it - check they were changed too.</p>` : ""}
      ${c.fields ? `<table class="dt small"><thead><tr><th>Field</th><th>Old</th><th>New</th></tr></thead><tbody>${c.fields.map(f => `<tr><td class="mono">${esc(f.path)}</td><td>${f.old == null ? '<span class="muted">(none)</span>' : esc(f.old)}</td><td>${f.new == null ? '<span class="muted">(none)</span>' : esc(f.new)}</td></tr>`).join("")}</tbody></table>${c.fields_changed > c.fields.length ? `<p class="small muted">First ${c.fields.length} of ${c.fields_changed} fields.</p>` : ""}` : ""}
      ${c.diff ? `<pre class="code small">${c.diff.map(l => `<span style="${l.startsWith("+") ? "color:var(--good-text)" : l.startsWith("-") ? "color:var(--critical-text)" : l.startsWith("@@") ? "color:var(--accent)" : ""}">${esc(l)}</span>`).join("\n")}</pre>${c.diff_cut ? `<p class="small muted">Cut - the rest is in the files.</p>` : ""}` : ""}</div>`; showSide($("#cdet", m)); };
    let t;
    const draw = f => { const rows = ch.filter(c => (!f.c || c.change === f.c) && (!f.e || c.ext === f.e) && (!f.i || c.impact === f.i) && has(f.q, c.file, c.label));
      if (t) t.set(rows); else t = new Table($("#ct", m), {rows, onRow: det, columns: [
        {key:"change", label:"Change", render: c => `<span class="badge"><i style="background:var(--${c.change==="removed"?"critical":c.change==="added"?"good":"warning"})"></i>${esc(c.change)}</span>`},
        {key:"file", label:"File", render: c => `<span class="mono">${esc(c.file)}</span>${c.label && c.label !== c.node ? ` <span class="small muted">${esc(c.label)}</span>` : ""}`},
        {key:"impact", label:"Impact", render: c => c.impact ? lvBadge(c.impact) : "", sort: c => LV.indexOf(c.impact || "None")},
        {key:"what", label:"What", render: c => `<span class="small">${c.fields_changed != null ? `${c.fields_changed} field(s)` : c.lines_added != null ? `+${c.lines_added} / -${c.lines_removed} lines` : c.change === "changed" ? fmtBytes(c.size_old) + " → " + fmtBytes(c.size_new) : fmtBytes(c.size_new ?? c.size_old)}${c.used_by ? ` · <b style="color:var(--critical-text)">used by ${c.used_by}</b>` : ""}</span>`}]}); };
    filterBar($("#cfb", m), [{id:"q", type:"search", label:"File or name…"}, {id:"c", type:"select", label:"Any change", options:["changed","added","removed"]},
      {id:"e", type:"select", label:"Any type", options: Object.keys(sm.by_type).sort()}, {id:"i", type:"select", label:"Any impact", options: LV.slice().reverse()}], draw);
    draw({});
  };
  if (st.has_result) showCmp();
};
// doneBox: a "Done" message with one button. osSame: same path, ignoring case and trailing slashes (Windows).
const doneBox = text => dialog({title: "Done", html: esc(text), cancel: null});
const osSame = (a, b) => (a||"").replace(/[\\/]+$/,"").toLowerCase() === (b||"").replace(/[\\/]+$/,"").toLowerCase();

// Blueprints page: every custom blueprint (module + haks) laid out like the toolset's Custom palette (/api/palette:
// palette.json from nwn_palette.py, built on first use; embedded in the static report). Two views:
//   Palette tree - the categories with counts; a search lists the matches with their palette path.
//   Same name    - blueprints whose names match, with every copy load order hides, so duplicates and where each
//                  copy lives (palette category, module or hak) show together.
// Export CSV saves the rows in view. Module blueprints can be ticked and moved to another palette category: the move
// waits in palette_moves.json (/api/palette/move, /api/palette/move/undo) until the next Build & audit applies it.
// palRows / sameNameKey / csvCell are plain functions (tests/test_palette.py runs them under Node when it is installed).
const BP_TYPES = ["uti", "utc", "utp", "utd", "utm", "utt", "ute", "uts", "utw"];
async function loadPalette(){
  if (S.pal && S.palFor === S.cur) return S.pal;          // one load per open analysis
  const p = STATIC ? STATIC.palette : await api(`/api/palette?a=${encodeURIComponent(S.cur)}`);
  if (!p || !p.types) throw new Error("No palette data for this analysis - re-run the analysis.");
  S.pal = p; S.palFor = S.cur; return p;
}
// One row per blueprint of type ext (the copy the game uses); with hidden=true also one row per copy load order hides
// (hiddenBy = the source whose copy wins). path is the palette path, or null when no category has the number.
// moves: the waiting moves {ext: {resref: {to}}}; a row gets moveTo / movePath when one waits for it. movable: only the
// copy the game uses, and only when it is the module's (a hak's copy would still win in the game).
function palRows(pal, ext, hidden, moves = {}, fchanges = {}){
  const t = pal.types[ext], src = pal.sources, cats = t.categories, out = [];
  const where = c => c == null ? null : cats[c].path;
  const pathOfId = new Map(cats.filter(c => c.id != null).map(c => [c.id, c.path]));
  t.blueprints.forEach(b => {
    const mv = (moves[ext] || {})[b.resref];
    out.push({ext, type: t.label, node: b.node, resref: b.resref, name: b.name, tag: b.tag, src: src[b.src], pid: b.pid,
              cat: b.cat, path: where(b.cat), cr: b.cr ?? null, note: b.stale || "", hiddenBy: null, hides: (b.hidden || []).length,
              movable: src[b.src] === "module", moveTo: mv ? mv.to : null, movePath: mv ? (pathOfId.get(mv.to) || "#" + mv.to) : null,
              base: b.base ?? null, fchg: (fchanges[ext] || {})[b.resref] || null});
    if (hidden) (b.hidden || []).forEach(x => out.push({ext, type: t.label, node: b.node, resref: b.resref, name: x.name, tag: x.tag,
      src: src[x.src], pid: x.pid, cat: x.cat, path: where(x.cat), cr: null, note: "", hiddenBy: src[b.src], hides: 0,
      movable: false, moveTo: null, movePath: null}));
  });
  return out;
}
// Same-name group key: the name ignoring case and extra spaces; a blueprint without a name is grouped by its resref.
const sameNameKey = r => { const k = String(r.name || "").trim().replace(/\s+/g, " ").toLowerCase(); return k ? "name:" + k : "resref:" + r.resref; };
// The rows the Blueprints filters keep. f: {q (lower-cased search), cat (category index, "" = any; its sub-categories
// count too), src (source name), base (base item number), none / stale / waiting (tick boxes)}; cats: the type's
// categories (each knows its parent).
function bpFilter(rows, f, cats){
  const want = f.cat === "" || f.cat == null ? null : +f.cat;
  const under = c => { for (let i = c; i != null; i = cats[i].parent) if (i === want) return true; return false; };
  return rows.filter(r => has(f.q, r.name, r.tag, r.resref) && (want == null || (r.cat != null && under(r.cat))) &&
    (!f.src || r.src === f.src) && (f.base == null || f.base === "" || String(r.base) === String(f.base)) &&
    (!f.none || r.cat == null) && (!f.stale || !!r.note) && (!f.waiting || r.moveTo != null));
}
// Tick every row that can move (sel: the Set of "ext:resref"). Hidden copies are left out quietly; blueprints whose
// copy in a hak wins are counted as skipped. Returns {added, skipped}.
function bpSelect(sel, rows){
  let added = 0, skipped = 0;
  rows.forEach(r => { if (r.hiddenBy) return; if (!r.movable){ skipped++; return; }
    const k = r.ext + ":" + r.resref; if (!sel.has(k)){ sel.add(k); added++; } });
  return {added, skipped};
}
// Fields Change fields… offers per blueprint type (nwn_bpchanges.FIELDS) and how a value reads (a faction by name).
const BP_FIELDS = {uti: ["name", "tag", "description", "unidentified_description"], utc: ["first_name", "last_name", "tag", "description", "faction"],
  utp: ["name", "tag", "description"], utd: ["name", "tag", "description"], utm: ["name", "tag"], uts: ["name", "tag"],
  utt: ["name", "tag"], ute: ["name", "tag"], utw: ["name", "tag", "description"]};
const fieldText = (f, v) => { if (f !== "faction") return String(v ?? ""); const fa = (((S.rep || {}).factions || {}).factions || []).find(x => String(x.id) === String(v)); return fa ? `${fa.name} (#${v})` : `#${v}`; };
// A CSV cell: quoted when needed, and a leading = + - @ (or tab / CR) defused with ' so a spreadsheet never runs a
// blueprint name as a formula (names come from haks anyone can make).
const csvCell = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

      catch(e){ $("#pkp", md).innerHTML = `<span style="color:var(--critical-text)">${esc(e.message)}</span>`; return; }

// a click elsewhere (e.g. the Overview bars) can open a page with its filters already set

      <div class="tiles">${Object.entries(c.summary).filter(([k,v]) => v!=null).map(([k,v]) => `<div class="tile"><div class="v">${k==="bytes_saved"?fmtBytes(v):fmtN(v)}</div><div class="l">${esc(k.replace(/_/g," "))}</div></div>`).join("")}</div>

    box.innerHTML = `<div class="card"><h2 style="margin-top:0">Add to game folders</h2>

    $("#binstgo", m).onclick = async () => {
      const fail = b.audit.verdict === "FAIL";

        html: `<p>The automatic audit found a problem with this build (see the checks above). Normally you fix it and build again.</p>`})) return;
      let p; try { p = await api(`/api/install/plan?a=${encodeURIComponent(S.cur)}&allow_fail=${fail ? 1 : 0}`); }
      catch(e){ $("#binstmsg", m).textContent = e.message; return; }
      const typed = await dialog({title: `Add ${p.files.length} file(s) to your game folders?`, danger: true, ok: "Add", input: {placeholder: "type ADD"},
        html: `<table class="dt small"><thead><tr><th>From</th><th>To</th><th>Size</th></tr></thead><tbody>${p.files.map(f => `<tr><td class="mono">${esc(f.source)}</td><td class="mono">${esc(f.target)}</td><td class="num">${fmtBytes(f.bytes)}</td></tr>`).join("")}</tbody></table>

// highlight(): NWScript syntax colouring for the source view. Every piece of source goes through esc() before it
// is wrapped in a span, so script text cannot inject HTML.
function highlight(src){
  // line-by-line so every span closes on its own line (block comments carried across lines)
  const kw = /\b(void|int|float|string|object|location|effect|itemproperty|vector|talent|event|struct|const|if|else|while|for|do|switch|case|default|break|continue|return|include|json|sqlquery)\b/g;
  const code = t => esc(t).replace(kw, '<span class="tk-k">$1</span>');
  let inBlock = false;
  return src.split("\n").map(line => {
    let out = "", i = 0;
    while (i < line.length){
      if (inBlock){ const e = line.indexOf("*/", i); const seg = e < 0 ? line.slice(i) : line.slice(i, e + 2);
        out += `<span class="tk-c">${esc(seg)}</span>`; i += seg.length; if (e >= 0) inBlock = false; continue; }
      const rest = line.slice(i), m = rest.match(/\/\*|\/\/|"/);
      if (!m){ out += code(rest); break; }
      out += code(rest.slice(0, m.index)); i += m.index;
      if (m[0] === "//"){ out += `<span class="tk-c">${esc(line.slice(i))}</span>`; break; }
      if (m[0] === "/*"){ inBlock = true; continue; }
      // a string literal: up to the closing quote, skipping escaped characters; an unclosed string runs to the end
      // of the line
      const sm = line.slice(i).match(/^"(?:\\.|[^"\\])*"?/); out += `<span class="tk-s">${esc(sm[0])}</span>`; i += sm[0].length;
    }
    return `<span class="ln">${out || " "}</span>`;
  }).join("");
}
// mdTree(): a conversation as nested lists, from the server's readable dialogue text ("- " items, two spaces
// per level). Text is escaped first, then bold and code spans are applied.
function mdTree(md){
  const lines = md.split("\n"); let html = "", depth = -1;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, '<span class="mono">$1</span>');
  for (const l of lines){ const mm = l.match(/^(\s*)- (.*)$/);
    if (!mm){ if (l.startsWith("# ")) continue; if (l.trim()) html += `<p class="small muted">${inline(l)}</p>`; continue; }
    const d = mm[1].length / 2;
    while (depth < d){ html += `<ul class="tree">`; depth++; } while (depth > d){ html += `</ul>`; depth--; }
    html += `<li class="small">${inline(mm[2])}</li>`; }
  while (depth-- >= 0) html += "</ul>";
  return html;
}
// staticNode(): in the static report, build the same shape /api/node returns from the embedded data (impact

      ${!STATIC && f.editable ? `<div class="row" style="margin-top:6px">${/\.2da$/i.test(f.relpath) ? `<button class="btn primary ed2da" data-f="${esc(f.relpath)}">Open in 2da editor</button>` : ""}<button class="btn edTxt" data-f="${esc(f.relpath)}">Edit text</button>${f.edited ? `<button class="btn disF" data-f="${esc(f.relpath)}">Discard my edit</button>` : ""}</div><div class="edTxtBox" hidden data-f="${esc(f.relpath)}"><textarea class="code"></textarea><div class="row" style="margin-top:6px"><button class="btn primary saveTxt" data-f="${esc(f.relpath)}">Save edit</button><span class="small muted msg"></span></div></div>` : ""}`;
    if (f.json) H += `<details ${f.edited ? "open" : ""}><summary class="small">Raw data (all fields, nwn_gff JSON format)${!STATIC && f.editable ? " — editable" : ""}</summary><pre class="code jsonView" data-f="${esc(f.relpath)}">${esc(f.json.length > 400000 ? f.json.slice(0, 400000) + "\n… (truncated)" : f.json)}</pre>
      ${!STATIC && f.editable && f.json.length <= 400000 ? `<div class="row" style="margin-top:6px"><button class="btn edJson" data-f="${esc(f.relpath)}">Edit fields (JSON)</button>${f.edited ? `<button class="btn disF" data-f="${esc(f.relpath)}">Discard my edit</button>` : ""}</div><div class="edJsonBox" hidden data-f="${esc(f.relpath)}"><p class="small muted">Change values only; keep the structure. Validated against the NWN file format on save. Tags, names, scripts, costs, positions… anything.</p><textarea class="code"></textarea><div class="row" style="margin-top:6px"><button class="btn primary saveJson" data-f="${esc(f.relpath)}">Save edit</button><span class="small muted msg"></span></div></div>` : ""}</details>`;
  }
  $("#drawerBody").innerHTML = H;
  fillIcons($("#drawerBody"));
  bindEditors(node, d);
  // save a hand-written script description (/api/description), then reopen the panel
  const dt = $("#dtext"); if (dt) dt.orig = dt.value;
  const ds = $("#dsave"); if (ds) ds.onclick = async () => { const text = dt.value.trim();
    try { await post("/api/description", {a: S.cur, script: node.slice(7), text}); }
    catch(e){ errorBox("Description not saved: " + e.message); return; }
    script.description = text || null; dt.orig = dt.value; openNode(node); };
}

// Wire up the side panel's editors. Every save goes to /api/edit/save (the analysis' edits, never the original
// module) with base = the file's sha when shown, so the server refuses a save over a file changed since.
// "Show compiled code" calls /api/ncs; "Discard my edit" calls /api/edit/discard.
function bindEditors(node, d){
  const body = $("#drawerBody");
  const saveFile = async (file, content, format, msgEl, compile) => {
    msgEl.textContent = "Saving…";
    const base = ((d.files || []).find(f => f.relpath === file) || {}).sha;
    try { const r = await post("/api/edit/save", {a: S.cur, file, content, format, compile, base});
      body.querySelectorAll("textarea").forEach(t => { if (t.value === content) t.orig = content; });
      let m = "Saved to your edits (original untouched; used by the clean build).";
      if (r.compile){ m += r.compile.status === "ran" ? (r.compile.errors.length ? " COMPILE ERRORS: " + r.compile.errors.join(" | ") : " Compiles OK.") : " (not compiled - " + (r.compile.reason || r.compile.status) + ")"; }
      msgEl.textContent = m; setTimeout(() => openNode(node), 1200); }
    catch(e){ msgEl.textContent = "Not saved: " + e.message; }
  };
  const ncsGo = $("#ncsGo", body);
  if (ncsGo) ncsGo.onclick = async () => {
    const msg = $("#ncsMsg", body), box = $("#ncsBox", body);
    msg.textContent = "Reading…"; ncsGo.disabled = true;
    try {
      const c = await api(`/api/ncs?a=${encodeURIComponent(S.cur)}&script=${encodeURIComponent(node.slice(7))}`);
      msg.textContent = "";
      if (!c.found){ box.innerHTML = `<div class="note warn small">${esc(c.error || "not found")}</div>`; return; }
      const head = c.ok
        ? `<div class="note small">Intact: ${fmtN(c.instructions)} instructions, ${fmtBytes(c.bytes)}, from ${esc(c.where)}.${(c.strings||[]).length ? ` Text it contains: <span class="mono">${c.strings.slice(0,12).map(x => esc(JSON.stringify(x))).join(", ")}${c.strings.length > 12 ? " …" : ""}</span>` : ""}</div>`
        : `<div class="note warn small"><b>Damaged</b> (${esc(c.where)}): ${esc(c.problem)}<div class="fixhint"><b>How to fix:</b> recompile the script; with no source, restore the .ncs from a backup.</div></div>`;
      const list = c.listing ? `<pre class="code" style="max-height:420px;overflow:auto">${esc(c.listing)}</pre>${c.listing_truncated ? '<div class="small muted">Listing cut short (very large script).</div>' : ""}`
        : `<div class="small muted">No listing: ${esc(c.listing_error || "nwn_asm gave nothing")}. Put <span class="mono">nwn_asm</span> (<span class="mono">nwn_asm.exe</span> on Windows, from neverwinter.nim) in the toolkit's <span class="mono">tools</span> folder for a readable listing; the check above works without it.</div>`;
      box.innerHTML = head + list;
    } catch(e){ msg.textContent = "Failed: " + e.message; }
    finally { ncsGo.disabled = false; }
  };
  const ed = $("#edSrc", body);
  if (ed) ed.onclick = () => { const ta = $("#srcEdit", body); $("#edSrcBox", body).hidden = false; ta.value = ta.orig = d.source; ed.hidden = true; };
  const sv = $("#saveSrc", body);
  if (sv) sv.onclick = () => saveFile((d.files.find(f => f.ext === "nss")).relpath, $("#srcEdit", body).value, "text", $("#srcMsg", body), $("#compSrc", body).checked);
  const dis = $("#disSrc", body);
  if (dis) dis.onclick = () => discardEdit(d.files.find(f => f.ext === "nss").relpath, () => openNode(node));
  body.querySelectorAll(".edTxt").forEach(b => b.onclick = () => { const box = body.querySelector(`.edTxtBox[data-f="${CSS.escape(b.dataset.f)}"]`); const ta = box.querySelector("textarea"); box.hidden = false; ta.value = ta.orig = d.files.find(f => f.relpath === b.dataset.f).text; b.hidden = true; });
  body.querySelectorAll(".saveTxt").forEach(b => b.onclick = () => { const box = b.closest(".edTxtBox"); saveFile(b.dataset.f, box.querySelector("textarea").value, "text", box.querySelector(".msg"), false); });
  body.querySelectorAll(".edJson").forEach(b => b.onclick = () => { const box = body.querySelector(`.edJsonBox[data-f="${CSS.escape(b.dataset.f)}"]`); const ta = box.querySelector("textarea"); box.hidden = false; ta.value = ta.orig = d.files.find(f => f.relpath === b.dataset.f).json; b.hidden = true; });
  body.querySelectorAll(".saveJson").forEach(b => b.onclick = () => { const box = b.closest(".edJsonBox"); saveFile(b.dataset.f, box.querySelector("textarea").value, "json", box.querySelector(".msg"), false); });
  body.querySelectorAll(".disF").forEach(b => b.onclick = () => discardEdit(b.dataset.f, () => openNode(node)));
  body.querySelectorAll(".ed2da").forEach(b => b.onclick = () => { $("#drawer").hidden = true; const back = S.view; openTwoda({src: "edit", a: S.cur, file: b.dataset.f}, () => go(back)); });
}

// Discard one edited or new file (/api/edit/discard) after asking: the server moves it out of the edits overlay into
// edits/.history/discarded/<time>/ (restorable by hand). then() runs after a discard; an error is shown and nothing
// else happens.
async function discardEdit(file, then, isNew){
  if (!await dialog({title: `Discard your edit of ${file}?`, ok: "Discard", danger: true, html: isNew
      ? `<p><b>${esc(file)}</b> is a new file (created by you, the generator, or a rename). Discarding it removes it from the clean build; if a rename created it, the old name comes back.</p><p>The file is kept in edits/.history/discarded (copy it back into the edits folder to restore it).</p>`
      : `<p>Your changed copy of <b>${esc(file)}</b> is taken out and the clean build uses the module's original again.</p><p>The file is kept in edits/.history/discarded (copy it back into the edits folder to restore it).</p>`})) return;
  try { await post("/api/edit/discard", {a: S.cur, file}); } catch(e){ errorBox(e.message); return; }
  then();
}
// My edits page: files changed or created in this analysis (/api/edits), each with Discard (discardEdit).
VIEWS.edits = async (m) => {
  const e = await api(`/api/edits?a=${encodeURIComponent(S.cur)}`);
  const rows = Object.entries(e).map(([file, v]) => ({file, ...v}));
  m.innerHTML = `<h1>My edits</h1><p class="sub">Files you changed or created in this analysis. They live in <span class="mono">${esc(subPath(subPath(S.workspace || "nwn_workspace", S.cur), "edits"))}</span>, never in the original module, and are applied when you build the clean module.</p><div id="t"></div>`;
  new Table($("#t", m), {rows, empty: "No edits yet. Open any script or file and click Edit, or use the Script generator.", columns: [
    {key:"file", label:"File", render: r => `<span class="mono">${esc(r.file)}</span> ${r.new ? '<span class="chip">new</span>' : ""}${r.kind === "deleted" ? ` <span class="chip">removed from the build</span> <span class="small muted">${esc(r.note || "")}</span>` : ""}`},
    {key:"size", label:"Size", num: true, render: r => fmtBytes(r.size)},
    {key:"mtime", label:"Saved", render: r => r.mtime ? new Date(r.mtime*1000).toLocaleString() : ""},
    {key:"x", label:"", render: r => `<button class="btn disE" data-f="${esc(r.file)}">Discard</button>`}]});
  m.querySelectorAll(".disE").forEach(b => b.onclick = () => discardEdit(b.dataset.f, () => VIEWS.edits(m), (rows.find(x => x.file === b.dataset.f) || {}).new));
};

// Script generator: pick an event, conditions and actions from the catalogue (/api/generator). /api/generate
// returns the script (preview) or saves it to the edits (save = true), optionally compile-checked. If the name
// is taken the server answers needs_confirm and asks before replacing it.
VIEWS.generator = async (m) => {
  const cat = await api(`/api/generator?a=${encodeURIComponent(S.cur || "")}`);
  const hideTok = k => !cat.adapter && (k === "token_set" || k === "token_eq");
  const G = {conditions: [], actions: []};
  m.innerHTML = `<h1>Script generator</h1><p class="sub">In the spirit of Lilac Soul's Script Generator: choose the event, what must be true, and what should happen. You get a commented script that compiles, with any #include for this module's own libraries added automatically. It is saved to your edits and goes into the clean build.</p>
   <p class="small ${cat.nwscript.found ? "muted" : "note warn"}">${cat.nwscript.found ? `Checked against your game's nwscript.nss (${fmtN(cat.nwscript.functions)} functions, ${fmtN(cat.nwscript.constants)} constants): pickers list your build's constants, and anything your build doesn't have is flagged.` : "Your game's nwscript.nss was not found - set the NWN install folder on the Modules page so constants and functions can be checked against your build."}
   ${cat.adapter ? ` This module's quest tokens (<span class="mono">${esc(cat.adapter.setter)}/${esc(cat.adapter.getter)}</span> in <span class="mono">${esc(cat.adapter.include)}</span>, ${fmtN(cat.tokens.length)} named) can be set and checked.` : ""}</p>
   ${Object.entries(cat.constants).map(([p, list]) => `<datalist id="dl_${esc(p)}">${list.map(c => `<option value="${esc(c)}">`).join("")}</datalist>`).join("")}
   <datalist id="dl_tokens">${(cat.tokens||[]).map(t => `<option value="${esc(t.name)}">${esc(t.label)} (slot ${esc(t.slot)})</option>`).join("")}</datalist>
   <div class="card"><div class="grid2">
     <label class="small">Script name (max 16, letters/digits/_)<input type="text" class="wide" id="gName" placeholder="e.g. at_open_gate"></label>
     <label class="small">Event / where it runs<select class="f wide" id="gEvent">${Object.entries(cat.events).map(([k,v]) => `<option value="${k}">${esc(v.label)}</option>`).join("")}</select></label></div>
     <label class="small">What this script is for (goes in the header comment)<textarea id="gDesc" placeholder="Opens the north gate once the player has the captain's key"></textarea></label>
     <h3>Only when… <span class="muted small">(conditions)</span> <select class="f" id="gLogic"><option value="all">all must be true</option><option value="any">any may be true</option></select></h3><div id="gConds"></div>
     <div class="row"><select class="f" id="gCondSel">${Object.entries(cat.conditions).filter(([k]) => !hideTok(k)).map(([k,v]) => `<option value="${k}">${esc(v.label)}</option>`).join("")}</select><button class="btn" id="gCondAdd">+ Add condition</button></div>
     <h3>Then do… <span class="muted small">(actions, in order)</span></h3><div id="gActs"></div>
     <div class="row"><select class="f" id="gActSel">${Object.entries(cat.actions).filter(([k]) => !hideTok(k)).map(([k,v]) => `<option value="${k}">${esc(v.label)}</option>`).join("")}</select><button class="btn" id="gActAdd">+ Add action</button></div>
     <div class="row" style="margin-top:12px"><button class="btn" id="gPreview">Preview</button><button class="btn primary" id="gSave">Save to my edits</button><label class="small"><input type="checkbox" id="gComp" checked> compile check</label><span class="small muted" id="gMsg"></span></div>
     <div id="gOut" style="margin-top:10px"></div></div>`;
  // one input per field: "select:a|b" -> drop-down, "const:<prefix>" -> text with the game's constants as
  // suggestions, "token" -> quest-token names, "stage" -> 0-9, anything else plain text
  const draw = () => {
    const input = (f, kind, i, it) => {
      const v = it.values[f.name] || "", a = `data-kind="${kind}" data-i="${i}" data-n="${f.name}"`;
      if (f.kind.startsWith("select:")){ const opts = f.kind.slice(7).split("|"); if (!v) it.values[f.name] = opts[0];
        return `<select class="f" ${a}>${opts.map(o => `<option ${o === (it.values[f.name]) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`; }
      if (f.kind.startsWith("const:")) return `<input type="text" list="dl_${esc(f.kind.slice(6))}" placeholder="${esc(f.kind.slice(6))}…" ${a} value="${esc(v)}">`;
      if (f.kind === "token") return `<input type="text" list="dl_tokens" placeholder="token name" ${a} value="${esc(v)}">`;
      if (f.kind === "stage"){ if (!v) it.values[f.name] = "1";
        return `<select class="f" ${a}>${"0123456789".split("").map(o => `<option ${o === it.values[f.name] ? "selected" : ""}>${o}</option>`).join("")}</select>`; }
      return `<input type="text" ${a} value="${esc(v)}" ${f.kind === "float" ? 'placeholder="seconds"' : ""}>`; };
    const rowHtml = (list, defs, kind) => list.map((it, i) => { const df = defs[it.key]; return `<div class="gen-row"><b class="small">${esc(df.label)}</b><div class="fields">${df.fields.map(f => `<label class="small">${esc(f.label)}<br>${input(f, kind, i, it)}</label>`).join("") || '<span class="small muted">no settings</span>'}</div><button class="btn" data-del="${kind}:${i}">✕</button></div>`; }).join("");
    $("#gConds", m).innerHTML = rowHtml(G.conditions, cat.conditions, "c") || `<p class="small muted">No conditions - runs every time.</p>`;
    $("#gActs", m).innerHTML = rowHtml(G.actions, cat.actions, "a") || `<p class="small muted">Nothing yet.</p>`;
    m.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { const [k, i] = b.dataset.del.split(":"); (k === "c" ? G.conditions : G.actions).splice(+i, 1); draw(); });
    m.querySelectorAll("[data-kind]").forEach(inp => inp.oninput = inp.onchange = () => { (inp.dataset.kind === "c" ? G.conditions : G.actions)[+inp.dataset.i].values[inp.dataset.n] = inp.value; });
  };
  $("#gCondAdd", m).onclick = () => { G.conditions.push({key: $("#gCondSel", m).value, values: {}}); draw(); };
  $("#gActAdd", m).onclick = () => { G.actions.push({key: $("#gActSel", m).value, values: {}}); draw(); };
  const spec = () => ({name: $("#gName", m).value.trim(), event: $("#gEvent", m).value, description: $("#gDesc", m).value, conditions: G.conditions, actions: G.actions, condition_logic: $("#gLogic", m).value});
  const run = async (save, overwrite = false) => { $("#gMsg", m).textContent = "";
    try { const raw = await apiRaw("/api/generate", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({a: S.cur, spec: spec(), save, overwrite, compile: $("#gComp", m).checked})});
      if (!raw.ok && raw.body && raw.body.needs_confirm){
        if (await dialog({title: "A script with this name already exists", danger: true, ok: "Replace it", html: `<p>${esc(raw.body.error)}.</p><p>Pick a different name to keep both.</p>`})) run(save, true);
        return; }
      if (!raw.ok) throw new Error((raw.body && raw.body.error) || "Not generated.");
      const r = raw.body;
      let msg = save ? `Saved as ${r.name}.nss in your edits. Where it goes: ${r.placement}.` : `Preview. Where it goes: ${r.placement}.`;
      if (r.compile) msg += r.compile.status === "ran" ? (r.compile.errors.length ? " COMPILE ERRORS: " + r.compile.errors.join(" | ") : " Compiles OK.") : ` (not compiled - ${r.compile.reason || r.compile.status})`;
      if (r.warnings.length) msg += " Check: " + r.warnings.join("; ");
      $("#gMsg", m).textContent = msg;
      $("#gOut", m).innerHTML = `<pre class="code">${highlight(r.source)}</pre>`; }
    catch(e){ $("#gMsg", m).textContent = e.message; } };
  $("#gPreview", m).onclick = () => run(false); $("#gSave", m).onclick = () => run(true);
  draw();
};

// ---------------------------------------------------------------- start
// Start-up: the static report opens on Overview. Otherwise the token must be in the URL (without it no call can
// succeed), then /api/state is read. A reload comes back to the page in the address (#issues...) and to the
// analysis that was open (remembered in this browser), if it can still be opened; otherwise the Modules page.
(async function start(){
  if (STATIC){ S.rep = STATIC.report; S.cur = "static"; prepare(); $("#modeLabel").textContent = "Static report (read-only)"; renderNav(); go("overview"); return; }
  if (!TOKEN){ $("#main").innerHTML = `<div class="note warn">Open the dashboard using the link printed by <span class="mono">nwn_dashboard.py</span> (it contains a session token).</div>`; return; }
  try { const st = await api("/api/state"); S.analyses = st.analyses; S.settings = st.settings; S.workspace = st.workspace; S.version = st.version; S.reanalyse = st.reanalyse || []; }
  catch(e){ $("#main").innerHTML = `<div class="note warn">${esc(e.message)}</div>`; return; }
  let last = null; try { last = localStorage.getItem("nwn_cur"); } catch(e){}
  if (!S.analyses.some(a => a.name === last && !a.incomplete && !a.archived)) last = null;
  const want = location.hash.slice(1), view = VIEWS[want] && (last || NO_MODULE.includes(want)) ? want : "home";
  try { history.replaceState({v: view, a: last}, "", "#" + view); } catch(e){}
  S.view = view; renderNav();
  if (last) load(last, view); else go(view, true);
})();
</script>
