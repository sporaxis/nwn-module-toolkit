<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NWN Module Toolkit</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f0efec; --line:#e2e1dc; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#6b6a65;
  --accent:#2a78d6; --accent-soft:#e6f0fb; --accent-strong:#2468c0;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --neutral:#8a8983;
  /* status colours used as text: the plain ones are too light on the page (WCAG AA wants 4.5:1) */
  --good-text:#0a7a0a; --warning-text:#8a5a00; --critical-text:#b52f2f; --neutral-text:#6b6a65;
  --code-bg:#f4f3ef; --kw:#4a3aa7; --str:#1c7a4f; --com:#8a8983;
  --radius:8px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --line:#33332f; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#9a998f;
  --accent:#3987e5; --accent-soft:#1c2b3f; --accent-strong:#2f6fc4;
  --good-text:#2fbf2f; --warning-text:#fab219; --critical-text:#e05a5a; --neutral-text:#a3a29a; --code-bg:#141413; --kw:#9085e9; --str:#4fc592; --com:#8f8e86;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{color-scheme:dark; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.4); --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --line:#33332f; --ink:#fff; --ink-2:#c3c2b7; --ink-3:#9a998f;
  --accent:#3987e5; --accent-soft:#1c2b3f; --accent-strong:#2f6fc4;
  --good-text:#2fbf2f; --warning-text:#fab219; --critical-text:#e05a5a; --neutral-text:#a3a29a; --code-bg:#141413; --kw:#9085e9; --str:#4fc592; --com:#8f8e86;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:230px 1fr;height:100%}
#nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
#nav .brand{padding:16px 16px 8px;font-weight:700;font-size:15px}
#nav .brand small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
#nav select{margin:8px 12px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
#nav .group{padding:10px 16px 4px;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
#nav button.nv{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 16px;cursor:pointer;color:var(--ink-2)}
#nav button.nv:hover{background:var(--surface-2)}
#nav button.nv.on{background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 var(--accent)}
#nav .cnt{font-size:11px;color:var(--ink-3)}
#main{overflow:auto;padding:22px 28px 60px}
h1{font-size:20px;margin:0 0 4px} h2{font-size:16px;margin:22px 0 10px} h3{font-size:14px;margin:16px 0 6px}
.sub{color:var(--ink-2);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:12px;align-items:start}
.split:has(> .side:empty){grid-template-columns:minmax(0,1fr)}
.split > .side{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.split > .side:empty{display:none}
.split > .side > .card{margin-top:0;position:relative}
.sideclose{position:absolute;top:6px;right:8px;border:0;background:transparent;color:var(--ink-3);font-size:16px;cursor:pointer;line-height:1}
.sideclose:hover{color:var(--ink)}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.split > .side{position:static;max-height:none}}
.bar.clickable{cursor:pointer;border-radius:6px}.bar.clickable:hover{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.card.gdet{padding:8px 12px;margin-bottom:6px}.fixhint{margin-top:4px;padding:4px 8px;border-left:3px solid var(--good);background:color-mix(in srgb, var(--good) 8%, transparent);border-radius:4px}.gdet>summary{cursor:pointer;line-height:1.5}.gdet .gsub{display:block;margin:2px 0 0 18px;font-weight:normal;white-space:normal}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.icon-stack{display:inline-grid;vertical-align:middle;background:#1b1b1b;border-radius:4px;padding:2px}.icon-stack img{grid-area:1/1;image-rendering:pixelated;max-height:44px}
.icon-stack.big img{max-height:128px}.icon-none{display:inline-block;min-width:22px;color:var(--ink-3);font-size:11px;text-align:center}
.slots{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 12px}.slot{display:inline-block;min-width:26px;text-align:center;font:11px/20px ui-monospace,monospace;color:var(--ink);border-radius:3px;cursor:pointer}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:default}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--accent)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{color:var(--ink-2);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],textarea,select.f{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px}
select.f{max-width:100%}
input[type=text].wide{width:100%}
textarea{width:100%;min-height:60px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters input[type=search]{min-width:240px}
table.dt{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.dt th{text-align:left;font-weight:600;font-size:12px;color:var(--ink-2);background:var(--surface-2);padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
table.dt td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.dt tr.click:hover td{background:var(--accent-soft);cursor:pointer}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
.pager{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--ink-2);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px 1px 6px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.badge i{font-style:normal;width:9px;height:9px;border-radius:50%;display:inline-block}
.lv-Critical i{background:var(--critical)} .lv-High i{background:var(--serious)} .lv-Medium i{background:var(--warning)}
.lv-Low i{background:var(--accent)} .lv-None i{background:var(--neutral)}
.sv-error i{background:var(--critical)} .sv-warning i{background:var(--warning)} .sv-info i{background:var(--neutral)}
.st-PASS i,.st-Safe i{background:var(--good)} .st-FAIL i{background:var(--critical)} .st-WARN i,.st-Review i{background:var(--warning)}
.st-SKIPPED i{background:var(--neutral)} .st-complete i,.st-found i{background:var(--good)} .st-incomplete i{background:var(--warning)} .st-running i{background:var(--accent)} .st-Safe\ as\ group i{background:#5fae5f}
.muted{color:var(--ink-3)} .small{font-size:12px} .mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.nl{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted transparent}
.nl:hover{border-bottom-color:var(--accent)}
.bars .bar{display:grid;grid-template-columns:170px 1fr 56px;gap:10px;align-items:center;margin:5px 0}
.bars .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bars .fill{height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
#drawer{position:fixed;top:0;right:0;width:min(760px,96vw);height:100vh;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:10}
#drawer[hidden]{display:none}
#drawer .dh{display:flex;gap:10px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line)}
#drawer .db{overflow:auto;padding:4px 18px 40px;flex:1}
.crumb{color:var(--ink-2);font-size:12px;margin-top:2px}
pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:520px;margin:0;font:12.5px/1.5 ui-monospace,Consolas,monospace;counter-reset:ln}
pre.code .ln{display:block;padding-left:3.6em;text-indent:-3.6em}
pre.code .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:3em;margin-right:.6em;text-align:right;color:var(--ink-3)}
.tk-c{color:var(--com)} .tk-s{color:var(--str)} .tk-k{color:var(--kw);font-weight:600}
ul.tree{list-style:none;padding-left:18px;margin:0} ul.tree li{margin:2px 0}
details.tn>summary{cursor:pointer;list-style:none} details.tn>summary::before{content:"▸ ";color:var(--ink-3)} details.tn[open]>summary::before{content:"▾ "}
.path{font-size:12px;color:var(--ink-2)}
.path span.k{color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-2);border-radius:999px;padding:1px 8px;font-size:12px}
.thumb{width:48px;height:48px;object-fit:contain;background:repeating-conic-gradient(var(--surface-2) 0 25%,transparent 0 50%) 0 0/12px 12px;border-radius:4px;border:1px solid var(--line)}
.preview{max-width:256px;max-height:256px;background:repeating-conic-gradient(var(--surface-2) 0 25%,transparent 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:6px}
.prog{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:8px 0 6px}
.prog .fill{height:100%;background:var(--accent);border-radius:0 5px 5px 0;transition:width .5s}
.prog.indet .fill{width:30%;animation:indet 1.4s ease-in-out infinite}
@keyframes indet{0%{margin-left:-30%}100%{margin-left:100%}}
.prog.stopped .fill{background:var(--warning)} .prog.failed .fill{background:var(--critical)} .prog.done .fill{background:var(--good)}
.btn.danger{border-color:var(--critical);color:var(--critical)} .btn.danger:hover{background:var(--critical);color:#fff}
.themes{display:flex;flex:0 0 auto;margin:0 12px 8px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.themes button{flex:1;border:0;background:var(--surface);padding:4px 0;font-size:12px;cursor:pointer;color:var(--ink-2)}
.themes button+button{border-left:1px solid var(--line)}
.themes button[aria-checked="true"]{background:var(--accent-strong);color:#fff}
@media (max-width:900px){.themes{flex:0 0 auto;margin:0 8px}.themes button{padding:4px 8px}}
#navJob{margin:0 12px 6px;padding:6px 8px;border-radius:6px;background:var(--accent-soft);font-size:12px;cursor:pointer}
#navJob[hidden]{display:none}
.manual{max-width:900px;line-height:1.55}.manual h1{font-size:22px}.manual h2{font-size:17px;margin-top:28px;padding-top:10px;border-top:1px solid var(--line)}
.manual code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--code-bg);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.manual pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font:12.5px/1.5 ui-monospace,Consolas,monospace}
.manual table{border-collapse:collapse;margin:8px 0;width:100%}.manual th,.manual td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.manual th{background:var(--surface-2)}.manual blockquote{margin:8px 0;border-left:3px solid var(--warning);background:var(--surface-2);padding:6px 12px;border-radius:0 6px 6px 0}
.manual .toc{columns:2;font-size:13px}.manual hr{display:none}
table.td2 th:first-child,table.td2 td:first-child{width:1%}
table.td2 td input:focus{border-color:var(--accent)!important;background:var(--surface)!important;outline:none}
.qs-warn{margin:3px 0;display:flex;gap:8px;align-items:flex-start}
.joblog{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-height:260px;overflow:auto;font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.modal .box{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:min(640px,94vw);max-height:80vh;display:flex;flex-direction:column}
.modal .box .bh{padding:12px 16px;border-bottom:1px solid var(--line)} .modal .box .bb{overflow:auto;padding:8px 16px;flex:1} .modal .box .bf{padding:10px 16px;border-top:1px solid var(--line)}
.fl{padding:5px 8px;border-radius:5px;cursor:pointer} .fl:hover{background:var(--surface-2)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0}
.warn{border-left-color:var(--warning)} .note.warn{background:color-mix(in srgb, var(--warning) 14%, var(--surface))}
/* page tabs (tabs()): the current tab is underlined, not drawn like the page's main action */
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 12px}
.tab{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;padding:6px 12px;cursor:pointer;color:var(--ink-2)}
.tab:hover{color:var(--ink)} .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px} table.dt tr.click:focus-visible td{background:var(--accent-soft)}
#navFoot{margin-top:auto;padding:12px 16px;font-size:11px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .grid2 > *{min-width:0}
textarea.code{width:100%;min-height:320px;font:12.5px/1.5 ui-monospace,Consolas,monospace;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--ink);tab-size:4;white-space:pre;overflow:auto}
.edited-flag{background:var(--warning);color:#000;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600}
.gen-row{display:grid;grid-template-columns:220px 1fr auto;gap:8px;align-items:start;margin:6px 0}
.gen-row .fields{display:flex;gap:6px;flex-wrap:wrap}.gen-row input{min-width:140px}
@media (max-width:900px){.gen-row{grid-template-columns:1fr}}
.tw{overflow-x:auto;border-radius:var(--radius)}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  #nav{flex-direction:row;flex-wrap:wrap;align-items:center;overflow:visible;border-right:0;border-bottom:1px solid var(--line);padding-top:8px}
  #nav .brand,#nav .group,#navFoot{display:none}
  #nav select{flex:1 1 140px;max-width:none}
  #navItems{display:flex;flex:1 0 100%;min-width:0;overflow-x:auto}
  #nav button.nv{white-space:nowrap;width:auto;gap:6px}
  #nav button.nv.on{box-shadow:inset 0 -3px var(--accent)}
  .grid2{grid-template-columns:1fr} #main{padding:16px}
  .bars .bar{grid-template-columns:110px 1fr 40px}
  .filters input[type=search]{min-width:0;width:100%}
}
</style>
<!--STATIC_DATA-->
</head>
<body>
<div id="app">
  <aside id="nav">
    <div class="brand">NWN Module Toolkit<small id="modeLabel">Neverwinter Nights: EE</small></div>
    <div class="themes" role="radiogroup" aria-label="Colour theme"><button data-theme-set="system" role="radio">System</button><button data-theme-set="light" role="radio">Light</button><button data-theme-set="dark" role="radio">Dark</button></div>
    <div id="navJob" hidden role="button" tabindex="0" aria-live="polite" title="Go to the Modules page"></div>
    <select id="modSel" aria-label="Analysed module"></select>
    <div id="navItems" role="navigation" aria-label="Pages"></div>
    <div id="navFoot"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="drawer" hidden role="dialog" aria-label="Details">
  <div class="dh"><div class="grow" id="drawerHead"></div><button class="btn" id="drawerClose" aria-label="Close">✕</button></div>
  <div class="db" id="drawerBody"></div>
</div>
<script>
/*
 * NWN Module Toolkit dashboard - the browser side of nwn_dashboard.py.
 *
 * One page, no framework, no build step: this script draws every page into the main element.
 *
 * How it fits together
 *  - S is the single state object: the list of analyses and settings, the open analysis (S.cur = its name,
 *    S.rep = its report.json), the clean-up plan (S.del = artefacts to delete, S.merge = duplicate groups to merge)
 *    and page state the pages add as they go (tabs, filters, the open hak project, the Find page...).
 *  - VIEWS is the registry of pages: VIEWS.<key>(main) draws one page. go(key) switches page, redraws the left
 *    navigation (NAV) and adds a browser history entry so Back / Forward move between pages.
 *  - api(path) and post(path, body) call the local server. Every call carries the session token (TOKEN, from the
 *    "?t=" part of the link nwn_dashboard.py prints at start-up) in the X-NWN-Token header; the server refuses any
 *    call without it and listens on 127.0.0.1 only. Where the browser fetches a URL itself (image src, download
 *    links) it cannot add a header, so the token goes in the URL as t=... instead.
 *  - Table is a small sortable, paged table; GroupedTable shows the same rows in collapsible groups. Most pages are
 *    a filterBar() over one of these.
 *  - The side panel ("drawer"): openNode(node) shows one resource - what it is, its impact, what it uses and what
 *    uses it, its source or fields - and its editors. Edits go to the analysis' edits folder, never the original
 *    module. Any link with class "nl" and data-node="..." opens it.
 *  - STATIC mode: the static report export (nwn_dashboard.py --export) is this same file with window.NWN_STATIC
 *    (report, impact details, sources, conversations, last build, ...) embedded. There is no server then: api()
 *    throws, pages that need the server are hidden or show the saved result, and openNode() builds its data from
 *    the embedded copy (staticNode).
 *
 * Safety: every value that comes from a module or the server (names, tags, script text, paths, messages) goes through
 * esc() before it is put into HTML, so text inside a module can never become markup or script in this page.
 * Long jobs (analysis, build, compile, hak rebuild, scans) run on the server; the page polls /api/job?id=... until
 * the job is no longer "running".
 */
"use strict";
// Data embedded by the static report export; null when the page runs against the local server.
const STATIC = window.NWN_STATIC || null;
// Session token from the page URL (?t=...). Empty means the page was not opened from the printed link.
const TOKEN = new URLSearchParams(location.search).get("t") || "";
// S: all page state. analyses / settings come from /api/state; cur / rep = the open analysis and its report.json;
// del / merge / allowReview = the clean-up plan the Build page sends; logTimer = Log monitor polling;
// compile = the last official-compiler run (/api/compile_result); dupOf = node -> duplicate groups it is in.
const S = {analyses: [], settings: {}, cur: null, rep: null, view: "home", del: new Set(), merge: new Set(),
           allowReview: false, logTimer: null, compile: null, dupOf: {}};

// ---------------------------------------------------------------- colour theme (System / Light / Dark), remembered per browser
function applyTheme(t){
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.themeSet === (t || "system"))));
}
function savedTheme(){ try { return localStorage.getItem("nwn_theme") || "system"; } catch(e){ return "system"; } }
applyTheme(savedTheme());
document.addEventListener("click", e => { const b = e.target.closest("[data-theme-set]"); if (!b) return;
  try { localStorage.setItem("nwn_theme", b.dataset.themeSet); } catch(err){}
  applyTheme(b.dataset.themeSet); });

// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
// esc(): escape text for HTML (element text or a quoted attribute). Every module or server value goes through it
// before it is put into innerHTML, so module text can never inject markup or script.
function esc(s){return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
// h(): turn an HTML string into one element (used for the modal dialogs added to the page body).
function h(html){const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild;}
function fmtBytes(b){if(b == null) return ""; const u=["B","KB","MB","GB"]; let i=0; while(b>=1024&&i<3){b/=1024;i++} return (i?b.toFixed(1):b)+" "+u[i];}
function fmtN(x){return (x ?? 0).toLocaleString();}
// "1 row", "3 rows"
const plural = (n, word) => `${fmtN(n)} ${word}${n === 1 ? "" : "s"}`;
// Impact levels, most severe first; LV.indexOf(level) is used to sort by severity.
const LV = ["Critical","High","Medium","Low","None"];
const LV_ICON = {Critical:"⛔",High:"▲",Medium:"●",Low:"▽",None:"–"};

function svBadge(s){return `<span class="badge sv-${esc(s)}"><i></i>${esc(s)}</span>`;}

// api(): call the local server with the session token. Parses JSON replies and throws an Error carrying the
// server's message on any non-2xx reply. In the static report it throws at once (there is no server).
async function api(path, opts = {}){
  if (STATIC) throw new Error("Not available in the static report");
  const r = await fetchServer(path, {...opts, headers: {"X-NWN-Token": TOKEN, "Content-Type": "application/json", ...(opts.headers||{})}});
  const ct = r.headers.get("Content-Type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || r.statusText);
  return body;
}

const NOT_RUNNING = "The dashboard is not running - start it again and open the new link it prints.";
async function fetchServer(path, opts){
  try { return await fetch(path, opts); } catch(e){ throw new Error(NOT_RUNNING); }
}

// ---------------------------------------------------------------- data table
// Table: a sortable, paged table drawn into host.
//   columns: [{key, label, render?(row) -> HTML, sort?(row) -> value, num?, width?}]. Without render the value is
//   escaped with esc(); a render function must escape what it inserts itself.
//   onRow(row): row click, or Enter / Space on a focused row (clicks on links, inputs and buttons inside the row are
//   left to them).
//   after(host): runs after every redraw, to bind handlers on what the render functions drew.
//   count: false hides the "N rows" line when everything fits on one page (GroupedTable shows the count itself).
// set(rows) replaces the rows and goes back to page 1.
class Table {
  constructor(host, {columns, rows, pageSize = 100, onRow, empty = "Nothing to show.", after = null, count = true}){
    Object.assign(this, {host, columns, rows, pageSize, onRow, empty, after, count, page: 0, sortKey: null, dir: 1});
    this.render();
  }
  set(rows){this.rows = rows; this.page = 0; this.render();}
  render(){
    // sort a copy (this.rows keeps its order), then cut out the current page
    let rows = this.rows.slice();
    if (this.sortKey){const c = this.columns.find(c => c.key === this.sortKey); const f = c.sort || (r => r[c.key]);
      rows.sort((a, b) => {const x = f(a), y = f(b); return (x > y ? 1 : x < y ? -1 : 0) * this.dir;});}
    const pages = Math.max(1, Math.ceil(rows.length / this.pageSize));
    this.page = Math.min(this.page, pages - 1);
    const slice = rows.slice(this.page * this.pageSize, (this.page + 1) * this.pageSize);
    const head = this.columns.map(c => `<th data-k="${c.key}" style="${c.width?`width:${c.width}`:""}">${esc(c.label)}${this.sortKey===c.key?(this.dir>0?" ↑":" ↓"):""}</th>`).join("");
    const body = slice.length ? slice.map((r, i) => `<tr class="${this.onRow?"click":""}" data-i="${i}" ${this.onRow?'tabindex="0"':""}>${this.columns.map(c =>
      `<td class="${c.num?"num":""}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${this.columns.length}" class="muted">${esc(this.empty)}</td></tr>`;
    this.host.innerHTML = `<div class="tw"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      ${this.count || pages > 1 ? `<div class="pager">${plural(rows.length, "row")} ${pages>1?`· page ${this.page+1} of ${pages} <button class="btn" data-p="-1">‹ Prev</button><button class="btn" data-p="1">Next ›</button>`:""}</div>` : ""}`;
    this.host.querySelectorAll("th").forEach(th => th.onclick = () => {const k = th.dataset.k; this.dir = this.sortKey === k ? -this.dir : 1; this.sortKey = k; this.render();});
    this.host.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {this.page = Math.max(0, this.page + +b.dataset.p); this.render();});
    // data-i is the row's index on the page as drawn (after sorting), i.e. into slice
    if (this.onRow) this.host.querySelectorAll("tbody tr[data-i]").forEach(tr => {
      tr.onclick = e => { if (e.target.closest("a,input,button,label,select")) return; this.onRow(slice[+tr.dataset.i]); };
      tr.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === tr){ e.preventDefault(); this.onRow(slice[+tr.dataset.i]); } }; });
    if (this.after) this.after(this.host);
  }
}
// Grouped table: the same rows, grouped into collapsible sets (so long lists don't overwhelm). Same set() as Table.
//   groupings: {name: row -> key or [keys]}; a row with several keys appears in each group, none -> "(none)".
//   order: per grouping, compare(keyA, keyB, rowsA, rowsB); otherwise the biggest groups come first.
//   badge(rows, key) / describe(rows, key, grouping): extra HTML on each group heading.
//   hideCols: {grouping: column key} - a column left out while grouped by that grouping (it would repeat the heading).
//   A group's Table is only built when the group is opened, so very long lists stay quick.
class GroupedTable {
  constructor(host, {rows, columns, onRow, after = null, pageSize = 50, empty = "Nothing to show.", groupings, group, order = null, badge = null, describe = null, hideCols = {}}){
    Object.assign(this, {host, rows, columns, onRow, after, pageSize, empty, groupings, order, badge, describe, hideCols, open: new Set()});
    this.group = group || Object.keys(groupings)[0];
    this.render();
  }
  set(rows){ this.rows = rows; this.render(); }
  // redraw only the group badges (e.g. "n selected") without rebuilding or closing the open groups
  refreshBadges(){ if (!this.badge || !this._shown) return;
    this.host.querySelectorAll(".gdet").forEach(det => { const [k, rs] = this._shown[+det.dataset.gi] || []; const b = det.querySelector(":scope > summary .gbadge");
      if (b && rs) b.innerHTML = " " + this.badge(rs, k); }); }
  render(){
    const names = [...Object.keys(this.groupings), "none"];
    const bar = `<div class="row small" style="margin:0 0 8px">Group by <select class="f gsel">${names.map(k => `<option value="${esc(k)}" ${k === this.group ? "selected" : ""}>${esc(k === "none" ? "no grouping (one list)" : k)}</option>`).join("")}</select></div>`;
    if (this.group === "none"){
      this.host.innerHTML = bar + `<div class="gflat"></div>`;
      new Table($(".gflat", this.host), {rows: this.rows, columns: this.columns, onRow: this.onRow, after: this.after, empty: this.empty});
    } else {
      const fn = this.groupings[this.group], groups = new Map();
      this.rows.forEach(r => { let ks = fn(r); ks = Array.isArray(ks) ? (ks.length ? ks : ["(none)"]) : [ks ?? "(none)"];
        ks.forEach(k => { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }); });
      let list = [...groups.entries()];
      const ord = typeof this.order === "function" ? this.order : (this.order || {})[this.group];
      const byCount = (a, b) => b[1].length - a[1].length || String(a[0]).localeCompare(String(b[0]));
      list.sort(ord ? (a, b) => ord(a[0], b[0], a[1], b[1]) || byCount(a, b) : byCount);
      // small lists open every group; otherwise only groups the user opened before are open again
      const auto = list.length <= 2 || this.rows.length <= 40;
      // at most 400 group headings unless "show all" was pressed
      const cap = this.showAll ? list.length : 400;
      const shown = list.slice(0, cap);
      this.host.innerHTML = bar + `<p class="small muted">${fmtN(this.rows.length)} in ${fmtN(list.length)} group(s)${list.length > cap ? ` - first ${cap} groups shown <button class="btn gall">show all ${fmtN(list.length)}</button> or search to narrow` : ""}</p>` +
        (shown.length ? shown.map(([k, rs], i) => `<details class="card gdet" data-gi="${i}" ${auto || this.open.has(this.group + "|" + k) ? "open" : ""}><summary>${gTitle(k)} <span class="chip">${fmtN(rs.length)}</span><span class="gbadge">${this.badge ? " " + this.badge(rs, k) : ""}</span>${(() => { const d = this.describe ? this.describe(rs, k, this.group) : ""; return d ? `<span class="gsub small muted">${d}</span>` : ""; })()}</summary><div class="gbody"></div></details>`).join("") : `<p class="muted">${esc(this.empty)}</p>`);
      this._shown = shown;
      // build a group's table the first time it is opened
      const fill = (det) => { const [k, rs] = shown[+det.dataset.gi]; const body = $(".gbody", det);
        if (!body.dataset.done){ body.dataset.done = 1; new Table(body, {rows: rs, columns: this.columns.filter(c => c.key !== this.hideCols[this.group]), onRow: this.onRow, after: this.after, pageSize: this.pageSize, empty: this.empty, count: false}); } };
      this.host.querySelectorAll(".gdet").forEach(det => { if (det.open) fill(det);
        det.addEventListener("toggle", () => { const k = shown[+det.dataset.gi][0]; det.open ? (this.open.add(this.group + "|" + k), fill(det)) : this.open.delete(this.group + "|" + k); }); });
    }
    $(".gsel", this.host).onchange = e => { this.group = e.target.value; this.showAll = false; this.render(); };
    const ga = $(".gall", this.host); if (ga) ga.onclick = () => { this.showAll = true; this.render(); };
  }
}
// A set key "sigil_con…" reads as truncated text; show it as "sigil_con*" with what it means.
const gTitle = k => String(k).endsWith("…") ? `<b class="mono" title="names starting ${esc(String(k).slice(0, -1))}">${esc(String(k).slice(0, -1))}*</b>` : `<b>${esc(k)}</b>`;
// "Angel [angel.utc]" / "creature 'Cook' in sigil_area_man" -> "Angel" / "Cook"
const plainName = l => { const m = String(l).match(/^\w+ '(.+)' in \S+$/) || String(l).match(/^\w+ '(.+)'$/); return m ? m[1] : String(l).replace(/\s*\[[^\]]*\]$/, ""); };
// top few values by count, "Harbourtown (12), Oakvale (8) +3 more"
function topList(vals, n = 3, counts = true){ const c = new Map(); vals.forEach(v => v && c.set(v, (c.get(v) || 0) + 1));
  const l = [...c.entries()].sort((a, b) => b[1] - a[1]); return l.length ? l.slice(0, n).map(([v, k]) => esc(v) + (counts && k > 1 ? ` (${k})` : "")).join(", ") + (l.length > n ? ` +${l.length - n} more` : "") : ""; }
// generic group subtitle: a few member names
const exampleNames = (rs, f, n = 4) => { const names = rs.map(f); return names.slice(0, n).map(esc).join(", ") + (names.length > n ? ` +${fmtN(names.length - n)} more` : ""); };
// Families of names: the shortest name prefix (split at _ - or spaces, trailing digits ignored) shared by 2-60 names.
function nameSets(names){
  const toks = names.map(n => { const t = String(n || "").toLowerCase().split(/[_\s-]+/).filter(Boolean);
    if (t.length) t[t.length - 1] = t[t.length - 1].replace(/\d+$/, "") || t[t.length - 1]; return t; });
  const count = new Map();
  toks.forEach(t => { for (let k = 1; k <= t.length; k++){ const p = t.slice(0, k).join("_"); count.set(p, (count.get(p) || 0) + 1); } });
  const out = new Map();
  // each name's key = its shortest prefix shared by 2-60 names; a trailing "…" marks a prefix, not a whole name
  names.forEach((n, i) => { const t = toks[i]; let key = null;
    for (let k = 1; k <= t.length; k++){ const p = t.slice(0, k).join("_"), c = count.get(p); if (c >= 2 && c <= 60){ key = p + (k < t.length || String(n).toLowerCase() !== p ? "…" : ""); break; } }
    out.set(n, key); });
  // names without separators (e.g. harbourinterior, harbourgate): the shortest shared start of 5+ letters
  const rest = names.filter(n => !out.get(n)).map(n => String(n || "").toLowerCase());
  const pc = new Map(); rest.forEach(n => { for (let L = 5; L <= n.length; L++){ const p = n.slice(0, L); pc.set(p, (pc.get(p) || 0) + 1); } });
  names.forEach(n => { if (out.get(n)) return; const l = String(n || "").toLowerCase(); let key = null;
    for (let L = 5; L <= l.length; L++){ const c = pc.get(l.slice(0, L)); if (c >= 2 && c <= 60){ key = l.slice(0, L) + "…"; break; } }
    out.set(n, key || "(not part of a set)"); });
  return out;
}
// "Harbourtown - Foreign Quarter [harbourforeign]" -> "Harbourtown": builders often name areas "<region> - <place>"
let _regions = null, _regionsFor = null;
const regionOf = lbl => { const nm = String(lbl).replace(/\s*\[[^\]]*\]$/, "").trim();
  if (nm.includes(" - ")) return nm.split(" - ")[0].trim();
  // the set of known regions is rebuilt only when another report is loaded
  if (_regionsFor !== S.rep){ _regionsFor = S.rep; _regions = new Set(((S.rep || {}).areas || []).map(a => String(a.label).replace(/\s*\[[^\]]*\]$/, ""))
      .filter(x => x.includes(" - ")).map(x => x.split(" - ")[0].trim())); }
  return _regions.has(nm) ? nm : "(no region in the area name)"; };   // "Selenica" belongs with "Selenica - Market"

const worstLv = rs => { const i = Math.min(...rs.map(r => LV.indexOf(r.impact || r.level || "None")).filter(x => x >= 0)); return isFinite(i) && i < 2 ? lvBadge(LV[i]) : ""; };
// "Why it matters" buckets for impact rows, in display order (see impactWhy).
const WHY = ["Module-wide events", "Touches a quest", "Reaches 10+ areas", "Many scripts depend on it", "Reaches 3-9 areas", "One or two areas", "Placed copies only", "Not reachable from the module (unused)", "Other"];
const whyOrder = (a, b) => WHY.indexOf(a) - WHY.indexOf(b);

// Module events as the toolset names them. module.ifo stores them in short field names (Mod_OnActvtItem); the
// server sends the field name or the part after "Mod_On". Unknown names are shown as "On" + the field's ending.
const MOD_EVENTS = {AcquirItem: "OnAcquireItem", ActvtItem: "OnActivateItem", ClientEntr: "OnClientEnter", ClientLeav: "OnClientLeave",
  CutsnAbort: "OnCutsceneAbort", Heartbeat: "OnHeartbeat", ModLoad: "OnModuleLoad", ModStart: "OnModuleStart", PlrChat: "OnPlayerChat",
  PlrDeath: "OnPlayerDeath", PlrDying: "OnPlayerDying", PlrEqItm: "OnPlayerEquipItem", PlrLvlUp: "OnPlayerLevelUp", PlrRest: "OnPlayerRest",
  PlrUnEqItm: "OnPlayerUnEquipItem", SpawnBtnDn: "OnPlayerRespawn", UnAqreItem: "OnUnAcquireItem", UsrDefined: "OnUserDefined",
  PlrTarget: "OnPlayerTarget", PlrGuiEvt: "OnPlayerGuiEvent", PlrTileAct: "OnPlayerTileAction", NuiEvent: "OnNuiEvent"};
const modEvent = k => { const x = String(k).replace(/^Mod_/, "").replace(/^On/, ""); return MOD_EVENTS[x] || "On" + x; };
// an impact reason with the event's toolset name: "Runs from a module-wide event (Mod_OnModLoad)" -> "(OnModuleLoad)"
const reasonText = r => String(r).replace(/\((Mod_On\w+)\)/, (_, k) => `(${modEvent(k)})`);
// impactEvent / impactWhy group impact rows by the reason texts the analysis writes (nwn_analysis.py, report.json
// impact[].reasons). They match that wording, so a change to it there must be followed here.
function impactEvent(x){ const mod = (x.reasons || []).find(r => r.startsWith("Runs from a module-wide event"));
  return mod ? modEvent((mod.match(/\(([^)]+)\)/) || [, "?"])[1]) : "(not run from a module event)"; }
function impactWhy(x){
  const rs = x.reasons || [];
  if (rs.some(r => r.startsWith("Runs from a module-wide event"))) return "Module-wide events";
  if (rs.some(r => /quest/i.test(r))) return "Touches a quest";
  const ar = rs.map(r => +(r.match(/^Reaches (\d+) area/) || [])[1]).find(v => v); if (ar >= 10) return "Reaches 10+ areas"; if (ar >= 3) return "Reaches 3-9 areas";
  const sc = rs.map(r => +(r.match(/^(\d+) other script/) || [])[1]).find(v => v); if (sc >= 8) return "Many scripts depend on it";
  if (rs.some(r => r.startsWith("Not reachable"))) return "Not reachable from the module (unused)";
  if (ar) return "One or two areas";
  if (rs.some(r => /placed cop/.test(r))) return "Placed copies only";
  return "Other";
}
// filterBar(): draws a page's search box, drop-downs and tick boxes and calls onChange(values) on every input.
// values = {id: search text trimmed and lower-cased (for has()), a drop-down's value exactly as its option has it,
// or true/false for a tick box}. The controls get the id "f_<id>"; a tick box's label text is "fl_<id>".
// Returns get(), which reads the current values (used when a tile click sets a drop-down).
function filterBar(host, defs, onChange){
  // defs: [{id,type:'search'|'select',label,options:[...]}]
  host.innerHTML = defs.map(d => d.type === "search"
    ? `<input type="search" id="f_${d.id}" placeholder="${esc(d.label)}">`
    : d.type === "check" ? `<label class="small"><input type="checkbox" id="f_${d.id}"> <span id="fl_${d.id}">${esc(d.label)}</span></label>`
    : `<select class="f" id="f_${d.id}"><option value="">${esc(d.label)}</option>${d.options.map(o => Array.isArray(o) ? `<option value="${esc(o[0])}">${esc(o[1])}</option>` : `<option>${esc(o)}</option>`).join("")}</select>`).join("");
  const get = () => Object.fromEntries(defs.map(d => {const e = $("#f_"+d.id, host);
    return [d.id, d.type === "check" ? e.checked : d.type === "search" ? e.value.trim().toLowerCase() : e.value];}));
  defs.forEach(d => $("#f_"+d.id, host).addEventListener("input", () => onChange(get())));
  return get;
}
// tabs(attr, current, [[key, label], ...]): a row of page tabs; each button carries data-<attr>="key". Entries

const tabs = (attr, cur, list) => `<div class="tabs" role="tablist">${list.filter(Boolean).map(([k, l]) =>

const has = (q, ...vals) => !q || vals.some(v => String(v ?? "").toLowerCase().includes(q));

    const dis = !NO_MODULE.includes(k) && !S.rep; const hide = STATIC && (k === "home" || k === "help" || k === "haks" || k === "housekeep" || k === "compare" || k === "generator" || k === "edits" || k === "find" || (k === "logs" && !STATIC.logs) || (k === "build" && !(STATIC.build && STATIC.build.audit)));

  $("#navItems").querySelectorAll("button.nv").forEach(b => b.onclick = () => go(b.dataset.v));
  $("#navFoot").textContent = S.version ? "Version: " + S.version : "";
  // on a phone the pages are one scrolling strip: keep the current page in view
  const on = $("#navItems .nv.on"); if (on && matchMedia("(max-width:900px)").matches) on.scrollIntoView({block: "nearest", inline: "nearest"});
  const sel = $("#modSel");
  sel.innerHTML = STATIC ? `<option>${esc(S.rep.summary.module_name)}</option>` :
    `<option value="">— choose analysed module —</option>` + S.analyses.filter(a => !a.incomplete && !a.archived).map(a => `<option value="${esc(a.name)}" ${a.name===S.cur?"selected":""}>${esc(a.module_name || a.name)}${a.module_name && a.module_name !== a.name ? " · " + esc(a.name) : ""}</option>`).join("");
  sel.onchange = async () => { const want = sel.value;
    if (!await leaveTwoda()){ sel.value = S.cur || ""; return; }
    if (want) load(want); };
}
// go(view): show a page. VIEWS[view] draws into a fresh element in #main (an unknown key falls back to the Modules
// page). A page that is still loading when the user moves on draws into its own element, which is no longer on the
// screen, so a slow page can never paint over the one shown now. A page that fails shows its error instead.
// Leaving the 2da editor with unsaved changes asks first.
function go(v, fromHistory){
  if (TD.dirty && $("#tdGrid")){ leaveTwoda().then(ok => ok ? go(v, fromHistory) : fromHistory && restoreHash()); return; }
  // each page is a browser history entry: Back / Forward move between pages instead of leaving the dashboard
  if (!fromHistory && S.view !== v){ try { history.pushState({v, a: S.cur}, "", "#" + v); } catch(e){} }
  S.view = v; renderNav(); const m = $("#main"); m.scrollTop = 0;
  const host = document.createElement("div"); m.replaceChildren(host);
  if (STATIC && STATIC.note) m.insertAdjacentHTML("afterbegin", `<div class="note small" style="margin:0 0 14px">${esc(STATIC.note)}</div>`);
  const failed = e => { if (host.isConnected) host.innerHTML = `<div class="note warn">${esc(e && e.message || e)}</div>`; };
  let p; try { p = (VIEWS[v]||VIEWS.home)(host); } catch(e){ failed(e); return; }
  if (p && p.catch) p.catch(failed);
}
// Unsaved changes in the 2da editor: ask before they are thrown away. Resolves true when it is fine to leave.
async function leaveTwoda(){
  if (!TD.dirty || !$("#tdGrid")) return true;
  if (!await dialog({title: "Unsaved 2da changes", html: "You have unsaved changes in the 2da editor. Leave and throw them away?", ok: "Leave", danger: true})) return false;
  TD.dirty = false; return true;
}
// Back / Forward that was cancelled: put the address back to the page still shown.
function restoreHash(){ try { history.pushState({v: S.view, a: S.cur}, "", "#" + S.view); } catch(e){} }
// Text typed into an editor in the side panel and not saved yet. Each editor's textarea keeps the text it was
// opened with in .orig (set where the editor is opened).
function drawerDirty(){
  return [...document.querySelectorAll("#drawer textarea")].some(t => {
    if (t.orig == null || t.value === t.orig) return false;
    // an editor box that was closed again is hidden; the panel itself may be hidden with the text still in it
    const box = t.closest("[hidden]"); return !box || box.id === "drawer";
  });
}
// Close the side panel (its button, Escape); asks first when an editor in it has unsaved text.
async function closeDrawer(){
  const dr = $("#drawer"); if (dr.hidden) return true;
  if (drawerDirty() && !await dialog({title: "Unsaved edit", html: "The text you typed in the side panel is not saved. Close it and throw the text away?", ok: "Close", danger: true})) return false;
  dr.hidden = true; return true;
}
// Before the side panel shows something else: the same question. Resolves true when it is fine to replace it.
async function leaveDrawer(){
  if (!drawerDirty()) return true;
  return !!await dialog({title: "Unsaved edit", html: "The text you typed in the side panel is not saved. Throw it away?", ok: "Throw away", danger: true});
}
window.addEventListener("beforeunload", e => { if ((TD.dirty && $("#tdGrid")) || drawerDirty()){ e.preventDefault(); e.returnValue = ""; } });
// Anything that fails without its own error handling still tells the user (instead of nothing happening).
window.addEventListener("unhandledrejection", e => errorBox((e.reason && e.reason.message) || String(e.reason)));

// Back / Forward: show the page from the history entry, but only if it belongs to the module open now.
window.addEventListener("popstate", e => { const st = e.state || {};
  const dr = $("#drawer"); if (dr && !dr.hidden){ dr.hidden = true; }
  if (st.v && (!st.a || st.a === S.cur || STATIC)) go(st.v, true); else if (!st.v) go("home", true); });
// load(name, view): open an analysis - /api/report (report.json), /api/issues/accepted and /api/compile_result -
// then show view (Overview by default). LOAD_SEQ numbers the calls so that only the latest one is applied (see the
// comment inside). The open analysis is remembered in this browser, so a reload comes back to it.
let LOAD_SEQ = 0;
async function load(name, view = "overview"){
  // everything is fetched first and only then made current: a slower answer for a module picked earlier can never
  // show under (or save into) the module picked later
  const my = ++LOAD_SEQ;
  $("#main").innerHTML = `<p class="muted">Loading ${esc(name)}…</p>`;
  const sel = $("#modSel"); if (sel) sel.disabled = true;
  try {
    const rep = await api(`/api/report?a=${encodeURIComponent(name)}`);
    let acc = {}, comp = null;
    // optional extras: an analysis without them still opens
    try { acc = await api(`/api/issues/accepted?a=${encodeURIComponent(name)}`); } catch(e){}
    try { comp = await api(`/api/compile_result?a=${encodeURIComponent(name)}`); } catch(e){}
    let ver = null; try { ver = await api(`/api/analysis/version?a=${encodeURIComponent(name)}`); } catch(e){}
    if (my !== LOAD_SEQ) return;
    if (S.cur !== name){          // per-module page state starts fresh
      S.find = null; S.cmp = null; S.qTab = null; S.vTab = null; S.vSys = null; S.pTab = null; S.fTab = null;
      const dr = $("#drawer"); if (dr) dr.hidden = true;
    }
    S.cur = name; S.rep = rep; S.accepted = acc; S.compile = comp; S.ver = ver; S.pal = null;   // palette data reloads with the report
    try { localStorage.setItem("nwn_cur", name); } catch(e){}
    prepare();
    go(view);
  } catch(e){
    if (my === LOAD_SEQ) $("#main").innerHTML = `<div class="note warn">${esc(e.message)}</div>`;
  } finally {
    if (my === LOAD_SEQ && sel){ sel.disabled = false; sel.value = S.cur || ""; }
  }
}
// prepare(): index duplicate groups by member (S.dupOf) and restore this module's saved clean-up plan. With none
// saved, the default plan is every Safe / Safe-as-group deletion and every auto-mergeable duplicate group.
function prepare(){
  const r = S.rep; S.dupOf = {};
  r.duplicates.forEach(g => g.members.forEach(m => (S.dupOf[m.node] = S.dupOf[m.node] || []).push(g)));
  if (!recall()){S.del = new Set(r.deletions.filter(d => d.status !== "Review").map(d => d.node));
                 S.merge = new Set(r.duplicates.filter(g => g.mergeable).map(g => g.id)); S.allowReview = false;}
}

// ---------------------------------------------------------------- updating: bring work across from another copy
// First start of a new version: /api/state update_offer lists older copies next to this one that hold work (only
// while this copy has no analyses and never brought work across). One button copies it all (nwn_update.py): the
// other copy is only read, so it stays a working fallback. "Not now" hides the offer in this browser.
function renderUpdateOffer(host, copies){
  let hidden = false; try { hidden = localStorage.getItem("nwn_upd_hide") === "1"; } catch(e){}

// The folder that holds this toolkit's folder (where an older copy usually sits): the workspace path minus
// "<toolkit>/nwn_workspace". "" (the drives) when the workspace is somewhere else.
function toolkitParent(){
  const w = (S.workspace || "").replace(/[\\/]+$/, ""), parts = w.split(/[\\/]/);
  return parts.length > 2 && parts[parts.length - 1] === "nwn_workspace" ? w.slice(0, w.length - parts[parts.length - 1].length - parts[parts.length - 2].length - 2) : "";
}

// jobModal(title, id): a small window with a progress bar and Stop while job id runs; resolves with the last
// /api/job reply once it has ended (the window closes itself).
async function jobModal(title, id){
  const md = h(`<div class="modal"><div class="box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="bh"><b>${esc(title)}</b></div><div class="bb small"><div class="track"><div class="fill" id="cpf" style="width:0%"></div></div><p id="cpm" class="muted">starting</p></div><div class="bf row"><span class="grow"></span><button class="btn" id="cpstop">Stop</button></div></div></div>`);
  const close = openModal(md, () => {}, $("#cpstop", md));
  $("#cpstop", md).onclick = async () => { $("#cpstop", md).disabled = true; try { await post("/api/job/stop", {id}); } catch(e){} };
  const d = await waitJob(id, x => { $("#cpf", md).style.width = `${x.pct || 0}%`; $("#cpm", md).textContent = x.msg || ""; });
  close();
  return d;
}

// ---------------------------------------------------------------- installing / updating the toolkit (nwn_setup.py)
// An unzipped release (not installed, not a development copy) offers to install itself in a folder of its own:
// <folder>/toolkit (the program, swapped by each update), <folder>/nwn_workspace (your work, never touched by an
// update). /api/setup/state says what is already on this computer: an earlier install (then Install = Update, in its
// folder) and older unzipped copies holding work (offered as "Bring my work from"). After installing, the dashboard
// hands over to the installed copy (/api/setup/launch), which opens in its own window and a new tab.
async function renderSetup(host){
  let hidden = false; try { hidden = localStorage.getItem("nwn_setup_hide") === "1"; } catch(e){}
  if (!host || hidden) return;
  let s; try { s = await api("/api/setup/state"); } catch(e){ return; }
  const inst = s.installs[0], copies = s.copies;
  host.innerHTML = `<div class="card" style="border-color:var(--accent)"><h3 style="margin-top:0">${inst ? "Update your installed toolkit" : "Install the toolkit"}</h3>
    <p class="small">${inst ? `Found your installed toolkit in <span class="mono">${esc(inst.root)}</span> (${esc(inst.version)}, ${fmtN(inst.analyses.length)} ${inst.analyses.length === 1 ? "analysis" : "analyses"}). Updating it to ${esc(s.version)} swaps the program; your work stays where it is, and the current program is kept so you can go back.`
      : `You're running ${esc(s.version)} from the folder it was unzipped to. Install it in a folder of its own: your work is kept apart from the program, and later versions find it and update it in one click.`}</p>
    <label class="small">Install folder<span class="row" style="flex-wrap:nowrap"><input type="text" class="wide grow" id="sroot" value="${esc(inst ? inst.root : s.default_root)}"><button class="btn" id="sbrowse">Browse…</button></span></label>
    ${!inst ? `<p class="small muted" style="margin:4px 0 0">Suggested: a folder in your user folder, outside OneDrive / iCloud (syncing can damage the analysis databases). A new or empty folder, or the folder of an earlier install.</p>` : ""}
    ${s.installs.length > 1 ? `<p class="small muted">Other installs: ${s.installs.slice(1).map(x => `<a class="nl" href="#" data-sroot="${esc(x.root)}">${esc(x.root)}</a> (${esc(x.version)})`).join(", ")}</p>` : ""}
    ${copies.length ? `<label class="row small" style="margin-top:8px"><input type="checkbox" id="sbring" ${inst ? "" : "checked"}> Bring my work from <select class="f" id="sbfrom">${copies.map(c => `<option value="${esc(c.path)}">${esc(c.path)} (${esc(c.version)}, ${fmtN(c.analyses.length)} ${c.analyses.length === 1 ? "analysis" : "analyses"})</option>`).join("")}</select></label>
      <p class="small muted" style="margin:2px 0 0">Copies its settings, analyses with your edits, builds and waiting changes, and the compiler. That copy is not changed.</p>` : ""}
    <div class="row" style="margin-top:10px"><button class="btn primary" id="sgo">${inst ? "Update" : "Install"}</button><button class="btn" id="sno" title="Keep working from this folder; the offer comes back if you clear it in your browser">Not now</button></div></div>`;
  $("#sbrowse", host).onclick = () => browse([$("#sroot", host).value, toolkitParent()], p => $("#sroot", host).value = p, "folder");
  host.querySelectorAll("[data-sroot]").forEach(a => a.onclick = e => { e.preventDefault(); $("#sroot", host).value = a.dataset.sroot; });
  $("#sno", host).onclick = () => { try { localStorage.setItem("nwn_setup_hide", "1"); } catch(e){} host.innerHTML = ""; };
  $("#sgo", host).onclick = () => installToolkit($("#sroot", host).value.trim(), $("#sbring", host) && $("#sbring", host).checked ? $("#sbfrom", host).value : "");
}

// installToolkit(root, from): the plan (/api/setup/plan) in a confirm window, the install job, then the hand-over.
async function installToolkit(root, from){
  let p; try { p = await post("/api/setup/plan", {root, bring_from: from, allow_older: true}); } catch(e){ errorBox(e.message); return; }
  const b = p.bring, an = b ? b.copy.filter(c => c.kind === "analysis") : [];
  const body = `<p>${p.kind === "update" ? `Update <b>${esc(p.from_version)}</b> → <b>${esc(p.to_version)}</b> in <span class="mono">${esc(p.root)}</span>.` : `Install <b>${esc(p.to_version)}</b> in <span class="mono">${esc(p.root)}</span>.`}</p>
    ${p.refused ? `<div class="note warn">${esc(p.refused)}</div>` : `<ul>
      <li>the program (${fmtBytes(p.program_bytes)}) goes in <span class="mono">toolkit</span>${p.kind === "update" ? "; the current one is kept in <span class=\"mono\">previous</span> so you can go back" : ""}</li>
      ${p.kind === "update" ? `<li>your work stays as it is: ${fmtN(p.analyses.length)} ${p.analyses.length === 1 ? "analysis" : "analyses"}, settings, edits and builds in <span class="mono">nwn_workspace</span></li>` : `<li>your work will live in <span class="mono">nwn_workspace</span> there</li>`}
      ${p.carry_tools.length ? `<li>the compiler stays: ${p.carry_tools.map(esc).join(", ")}</li>` : ""}
      ${b ? (b.refused ? `<li>bring work from <span class="mono">${esc(b.source)}</span>: ${esc(b.refused)}</li>` : `<li>bring work from <span class="mono">${esc(b.source)}</span> (${esc(b.version)}): ${fmtN(an.length)} ${an.length === 1 ? "analysis" : "analyses"}${b.settings ? ", settings" : ""}${b.tools.length ? ", the compiler" : ""} - ${fmtBytes(b.total_bytes)}, copied (that copy is not changed)</li>`) : ""}</ul>
      <p class="muted">Then the toolkit restarts from there, in a new window and a new browser tab.</p>`}
    ${p.warnings.concat(b ? b.warnings : []).map(w => `<div class="note warn small">${esc(w)}</div>`).join("")}`;
  if (p.refused){ await dialog({title: "Can't install there", html: body, ok: "Close", cancel: null}); return; }
  if (!await dialog({title: p.kind === "update" ? "Update the installed toolkit?" : "Install the toolkit?", html: body, ok: p.kind === "update" ? "Update" : "Install",
      check: p.older ? `Go back to this older version (${p.to_version}) - the installed ${p.from_version} is newer` : null})) return;
  let j; try { j = await post("/api/setup/install", {root, bring_from: from, allow_older: p.older}); } catch(e){ errorBox(e.message); return; }
  const d = await jobModal(p.kind === "update" ? "Updating…" : "Installing…", j.job);
  if (d.status !== "done"){ await dialog({title: d.status === "stopped" ? "Stopped" : "Not installed", ok: "OK", cancel: null, html: `<p>${esc(d.lines.slice(-1)[0] || d.status)}</p><p class="muted">Nothing was changed where it stopped; an installed program is only swapped at the very end.</p>`}); return; }
  let l = {}; try { l = await post("/api/setup/launch", {root: d.result.root}); } catch(e){ l = {starting: false, launcher: d.result.launcher}; }
  $("#main").innerHTML = `<h1>${p.kind === "update" ? "Updated" : "Installed"}</h1><div class="card"><p><b>${esc(d.result.version)}</b> is installed in <span class="mono">${esc(d.result.root)}</span>${d.result.brought ? `, with ${fmtN(d.result.brought.analyses.length)} ${d.result.brought.analyses.length === 1 ? "analysis" : "analyses"} brought across` : ""}.</p>
    ${l.starting ? `<p>It is starting from there in a new window and opens in a new browser tab. <b>You can close this tab</b> and this copy's console window.</p>` : `<p>Start it from now on with <span class="mono">${esc(l.launcher)}</span>. You can close this tab and stop this copy (Ctrl+C in its window).</p>`}
    <p class="muted">The folder you unzipped this version into isn't needed any more - delete it when you like${d.result.brought ? ", and the old copy too once you're happy" : ""}.</p></div>`;
}

// bringWork(path): /api/update/plan shows what would be copied (and why anything is skipped or refused); after OK,
// /api/update/import copies it as a job, with progress in a small window; then the Modules page reloads.
async function bringWork(path){
  let p; try { p = await post("/api/update/plan", {from: path}); } catch(e){ errorBox(e.message); return; }
  const an = p.copy.filter(c => c.kind === "analysis"), other = p.copy.filter(c => c.kind !== "analysis");
  const list = xs => xs.map(x => `<li>${esc(x)}</li>`).join("");
  const body = `<p>From <span class="mono">${esc(p.source)}</span> (${esc(p.version)}) into this copy (${esc((S.version || "").replace(/ \(commit .*\)$/, ""))}).</p>
    ${p.refused ? `<div class="note warn">${esc(p.refused)}</div>` : `<p><b>${fmtBytes(p.total_bytes)}</b> to copy${p.free_bytes != null ? ` (${fmtBytes(p.free_bytes)} free on the disk)` : ""}:</p>
    <ul>${an.length ? `<li>${fmtN(an.length)} ${an.length === 1 ? "analysis" : "analyses"}: ${an.map(c => esc(c.name)).join(", ")} - with your edits, builds and waiting changes</li>` : ""}
      ${p.settings ? `<li>your settings${p.settings === "merge" ? " (anything you already set here is kept)" : ""}</li>` : ""}
      ${p.tools.length ? `<li>the programs in its tools folder: ${p.tools.map(t => esc(t.name)).join(", ")}</li>` : ""}
      ${other.length ? `<li>${other.map(c => esc(c.name)).join(", ")}</li>` : ""}</ul>
    <p class="muted">Nothing in the other copy is changed or deleted. When you're happy with this version, you can delete the old folder yourself.</p>`}
    ${p.warnings.length ? `<div class="note warn small"><ul style="margin:0">${list(p.warnings)}</ul></div>` : ""}
    ${p.skip.length ? `<details><summary>${fmtN(p.skip.length)} left as they are</summary><ul>${p.skip.map(s => `<li><span class="mono">${esc(s.name)}</span>: ${esc(s.why)}</li>`).join("")}</ul></details>` : ""}`;
  if (p.refused){ await dialog({title: "Can't bring work across", html: body, ok: "Close", cancel: null}); return; }
  if (!await dialog({title: "Bring your work across?", html: body, ok: "Copy it here"})) return;
  let j; try { j = await post("/api/update/import", {from: path}); } catch(e){ errorBox(e.message); return; }
  const d = await jobModal("Copying your work…", j.job);
  if (d.status === "done"){
    const r = d.result;
    await dialog({title: "Done", ok: "OK", cancel: null, html: `<p>Copied ${fmtN(r.analyses.length)} ${r.analyses.length === 1 ? "analysis" : "analyses"} (${fmtN(r.files)} files)${r.settings ? ", your settings" : ""}${r.tools.length ? " and the compiler" : ""}.</p><p>Your old copy is unchanged. From now on use this one; delete the old folder when you're happy.</p>${S.reanalyse.length ? `<p class="muted">Open each module once: if this version has checks its analysis doesn't, the Overview offers <b>Analyse again</b> (your work stays with it).</p>` : ""}`});
  } else await dialog({title: d.status === "stopped" ? "Stopped" : "Not copied", ok: "OK", cancel: null, html: `<p>${esc(d.lines.slice(-1)[0] || d.status)}</p><p class="muted">Nothing was changed here; your old copy is unchanged.</p>`});
  go("home");
}

// ---------------------------------------------------------------- analysis job: progress, Stop, Clear
// JOB: the analysis the Modules page follows - id from /api/analyse, data = the last /api/job reply, timer = the
// polling interval. autoOpen: open the analysis when it finishes (turned off by Stop).
const JOB = {id: null, data: null, timer: null, logOpen: false, autoOpen: true};
// seconds -> "42s", "3m 05s", "1h 02m"
function fmtDur(s){ if (s == null) return "?"; s = Math.round(s); if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s/60) + "m " + String(s%60).padStart(2,"0") + "s";
  return Math.floor(s/3600) + "h " + String(Math.floor((s%3600)/60)).padStart(2,"0") + "m"; }
function jobRunning(){ return !!JOB.id && (!JOB.data || JOB.data.status === "running"); }
// Poll /api/job every 0.8 s; pollJob stops the timer when the job is no longer running.
function startJobWatch(id){
  JOB.id = id; JOB.data = null; JOB.autoOpen = true; clearInterval(JOB.timer);
  JOB.timer = setInterval(pollJob, 800); pollJob();
}
// One poll: update the progress card, the buttons and the job line in the navigation. When the job has ended,
// refresh the list of analyses and, if it finished while the user is still on the Modules page, open it.
async function pollJob(){
  if (!JOB.id) return;
  let j; try { j = await api(`/api/job?id=${JOB.id}`); }
  catch(e){ clearInterval(JOB.timer); JOB.timer = null; JOB.data = {status: "error", lines: [e.message]}; renderJob(); jobButtons(); renderNavJob(); return; }
  JOB.data = j; renderJob(); jobButtons(); renderNavJob();
  if (j.status !== "running"){
    clearInterval(JOB.timer); JOB.timer = null;
    await loadStateQuiet(); renderNav();
    if (S.view === "home") refreshAnalysesList();
    if (j.status === "done" && JOB.autoOpen && S.view === "home") load(j.result.name);
  }
}
// Analyse / Stop / Clear enabled to match the job (Clear is not offered while it runs).
function jobButtons(){
  const go = $("#go"), stop = $("#stopBtn"), clr = $("#clearBtn"); if (!go) return;
  const run = jobRunning(), p = JOB.data && JOB.data.progress;
  go.disabled = run; stop.disabled = !run; clr.disabled = run;
  go.textContent = run ? (p && p.pct != null ? `Loading… ${Math.floor(p.pct)}%` : "Loading…") : "Analyse";
}
// Progress card: stage, %, time left and the job log. Server text is escaped or set as textContent.
function renderJob(){
  const host = $("#job"); if (!host) return;
  const d = JOB.data;
  if (!JOB.id){ host.innerHTML = ""; return; }
  if (!d){ host.innerHTML = `<div class="card"><b>Starting the analysis…</b><div class="prog indet"><div class="fill"></div></div></div>`; return; }
  const p = d.progress || {}, st = d.status;
  const pct = st === "done" ? 100 : p.pct;
  const cls = st === "stopped" ? "stopped" : st === "error" ? "failed" : st === "done" ? "done" : (pct == null ? "indet" : "");
  const head = st === "running" ? esc(p.stage || "Working…")
    : st === "done" ? "Finished" : st === "stopped" ? "Stopped" : "Failed";
  const right = st === "running" ? `${fmtDur(d.elapsed_s)} elapsed · ${esc(p.eta_text || "estimating…")}`
    : `${fmtDur(d.elapsed_s)} ${st === "done" ? "in total" : "before it ended"}`;
  const files = p.total_files ? ` · ${fmtN(p.done_files)} of ${fmtN(p.total_files)} files read` : "";
  const note = st === "stopped" ? `<div class="note warn small">Stopped. The partial analysis of <b>${esc(d.analysis||"")}</b> is marked incomplete and cannot be opened. Press <b>Clear</b> to remove its partial files (your edits, builds and descriptions are kept), or <b>Analyse</b> to start again.</div>`
    : st === "error" ? `<div class="note warn small">The analysis failed - the end of the log is below. Press <b>Clear</b> to close this panel (it also removes any partial files the run left).</div>`
    : st === "done" ? `<div class="note small">Done. ${JOB.autoOpen && S.view === "home" ? "Opening it now…" : `<a class="nl" href="#" id="openDone">Open ${esc(d.analysis||"")}</a>`}</div>` : "";
  host.innerHTML = `<div class="card" aria-live="polite">
    <div class="row"><b class="grow">${head}</b><span class="small muted">${right}</span></div>
    <div class="prog ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="100" ${pct != null ? `aria-valuenow="${Math.floor(pct)}"` : ""}><div class="fill" style="${pct != null ? `width:${Math.max(1, pct)}%` : ""}"></div></div>
    <div class="small muted">${pct != null ? Math.floor(pct) + "%" : "working out the size…"}${files}${p.basis && st === "running" ? ` · estimate from ${esc(p.basis)}` : ""}</div>
    ${note}
    <details id="jlWrap" style="margin-top:6px" ${JOB.logOpen || st === "error" ? "open" : ""}><summary class="small">Log (${fmtN((d.lines||[]).length)} lines)</summary><div class="joblog" id="jl"></div></details></div>`;
  const box = $("#jl", host); box.textContent = (d.lines || []).join("\n"); box.scrollTop = box.scrollHeight;
  $("#jlWrap", host).ontoggle = e => JOB.logOpen = e.target.open;
  const od = $("#openDone", host); if (od) od.onclick = () => load(d.result.name);
}
// Status line under the theme buttons, visible on every page; a click goes back to the Modules page.
function renderNavJob(){
  const el = $("#navJob"); if (!el) return;
  const d = JOB.data;
  if (!JOB.id || !d){ el.hidden = !JOB.id; el.textContent = JOB.id ? "Analysis starting…" : ""; }
  else if (d.status === "running"){ const p = d.progress || {}; el.hidden = false;
    el.textContent = `Analysing ${d.analysis || ""} - ${p.pct != null ? Math.floor(p.pct) + "%" : "…"}${p.eta_s != null ? " · " + fmtDur(p.eta_s) + " left" : ""}`; }
  else { el.hidden = false; el.textContent = d.status === "done" ? `Analysis of ${d.analysis || ""} finished` : d.status === "stopped" ? "Analysis stopped" : "Analysis failed"; }
  el.onclick = () => go("home");
}
// Stop: /api/job/stop ends the analysis process; the next poll shows "stopped".
async function stopJob(){
  if (!JOB.id) return;
  $("#stopBtn").disabled = true; $("#goMsg").textContent = "Stopping…";
  try { await post("/api/job/stop", {id: JOB.id}); $("#goMsg").textContent = ""; } catch(e){ $("#goMsg").textContent = e.message; }
  JOB.autoOpen = false; pollJob();
}
// Remove the files a stopped / failed run left (/api/analysis/clear). The server removes only generated data,
// never the edits, builds or descriptions. Returns a message, or null if the user cancelled.
async function clearAnalysis(name){
  if (!await dialog({title: `Remove the partial analysis files of '${name}'?`, ok: "Remove", danger: true,
    html: "Only files an analysis run generates are removed (index, report, json, conversations, reports). Your edits, builds and descriptions are kept."})) return null;
  const r = await post("/api/analysis/clear", {a: name});
  return `Cleared '${name}': removed ${r.removed.length} item(s)` + (r.kept.length ? `; kept ${r.kept.join(", ")}` : "") +
         (r.failed.length ? `. Could not remove: ${r.failed.join("; ")}` : "");
}
// Clear button: remove a stopped / failed run's partial files (after confirming), then empty the panel.
async function clearPanel(){
  let msg = "";
  const d = JOB.data;
  if (d && (d.status === "stopped" || d.status === "error") && d.analysis){
    try { msg = await clearAnalysis(d.analysis); if (msg === null) return; }
    catch(e){ $("#goMsg").textContent = e.message; return; }
  }
  JOB.id = null; JOB.data = null; S.lastScan = null;
  const q = $("#qs"); if (q) q.innerHTML = "";
  renderJob(); jobButtons(); renderNavJob(); $("#goMsg").textContent = msg;
  refreshAnalysesList();
}
// Re-read /api/state and redraw the list of analyses (on an error the list stays as it was).
async function refreshAnalysesList(){
  try { const st = await api("/api/state"); S.analyses = st.analyses; renderNav(); renderAnalysesList(st.analyses); } catch(e){}
}
// Table of analyses; a click on a complete one opens it. Buttons: Clear (incomplete run), Archive / Unpack
// (/api/analysis/archive and /api/analysis/unarchive, as jobs) and Delete... (deleteDialog). One click handler
// on the list handles them all.
function renderAnalysesList(list){
  const al = $("#alist"); if (!al) return;
  al.innerHTML = list.length ? "" : `<p class="muted">None yet.</p>`;
  if (!list.length) return;
  new Table(al, {rows: list, onRow: a => !a.incomplete && !a.archived && load(a.name), columns: [
    {key:"module_name", label:"Module", render: a => `<b>${esc(a.module_name||a.name)}</b>`},
    {key:"module_path", label:"Source", render: a => `<span class="mono small">${esc(a.module_path||"")}</span>`},
    {key:"indexed_at", label:"Analysed", render: a => esc(a.incomplete ? (a.indexed_at ? "started " + a.indexed_at : "") : a.indexed_at)},
    {key:"status", label:"Status", sort: a => a.incomplete ? (a.running ? 1 : 2) : a.archived ? 3 : 0, render: a => a.running ? stBadge("running") :
      a.incomplete ? `${stBadge("incomplete")} <button class="btn small" data-clear="${esc(a.name)}">Clear</button>` :
      a.archived ? `<span class="badge"><i style="background:var(--neutral)"></i>archived</span> <span class="small muted">${fmtBytes(a.archive_bytes)} (was ${fmtBytes(a.original_bytes)})</span> <button class="btn small" data-unarc="${esc(a.name)}">Unpack</button>` :
      `${stBadge("complete")} <button class="btn small" data-arc="${esc(a.name)}" title="Zip this analysis's data to save disk space; your edits and builds stay as they are">Archive</button>`},
    {key:"has_build", label:"Clean build", render: a => a.has_build ? "yes" : ""},
    {key:"del", label:"", render: a => a.running ? "" : `<button class="btn small danger" data-del="${esc(a.name)}" title="Housekeeping: delete this analysis's data">Delete…</button>`}]});
  al.onclick = async e => {
    const d = e.target.closest("[data-del]"); if (d){ deleteDialog(d.dataset.del); return; }
    const ar = e.target.closest("[data-arc],[data-unarc]");
    if (ar){ const pack = !!ar.dataset.arc, name = ar.dataset.arc || ar.dataset.unarc;
      if (pack && !await dialog({title: `Archive ${name}?`, ok: "Archive", html: `<p>The analysis data (index, report, json, conversations, reports) is zipped into one file and checked, then the unpacked copies are removed. Very large analyses shrink to about a sixth.</p><p>Your edits, builds, descriptions and accepted issues stay as they are. Press <b>Unpack</b> when you need it again (a minute or two for big modules).</p>`})) return;
      try { ar.disabled = true; const r = await post(pack ? "/api/analysis/archive" : "/api/analysis/unarchive", {a: name});
        const dd = await waitJob(r.job, x => $("#goMsg").textContent = `${pack ? "Archiving" : "Unpacking"} ${name}: ${x.pct != null ? Math.floor(x.pct) + "% " : ""}${x.msg || ""}`);
        $("#goMsg").textContent = dd.status === "done" ? (pack ? `Archived ${name}: ${fmtBytes(dd.result.original_bytes)} → ${fmtBytes(dd.result.archive_bytes)}.` : `Unpacked ${name}.`) : (dd.lines.slice(-1)[0] || dd.status);
        refreshAnalysesList(); }
      catch(err){ $("#goMsg").textContent = err.message; ar.disabled = false; }
      return; }
    const b = e.target.closest("[data-clear]"); if (!b) return;
    try { const msg = await clearAnalysis(b.dataset.clear); if (msg){ $("#goMsg").textContent = msg; refreshAnalysesList(); } }
    catch(err){ $("#goMsg").textContent = err.message; } };
}
// Delete an analysis' data. /api/analysis/usage gives the size of each part. The analysis data is always removed;
// the user's own work (edits, builds, descriptions, other files) only when ticked AND the analysis name is typed.
// The server checks the typed name again (delete_analysis in nwn_dashboard.py).
async function deleteDialog(name){
  let u; try { u = await api(`/api/analysis/usage?a=${encodeURIComponent(name)}`); } catch(e){ $("#goMsg").textContent = e.message; return; }
  const P = u.parts;
  const opt = (k, label, why) => P[k].files ? `<label class="row small" style="margin:6px 0;align-items:flex-start"><input type="checkbox" data-part="${k}">
      <span><b>${label}</b> - ${fmtBytes(P[k].bytes)}, ${fmtN(P[k].files)} file(s)<br><span class="muted">${why}</span></span></label>` : "";
  const md = h(`<div class="modal"><div class="box" role="dialog" aria-modal="true" aria-label="Delete analysis">
    <div class="bh"><b>Delete analysis '${esc(name)}'</b><div class="small muted mono">${esc(u.folder)}</div></div>
    <div class="bb">
      <p class="small"><b>Always removed:</b> the analysis data - ${fmtBytes(P.data.bytes)} (${fmtN(P.data.files)} files: index, report, JSON, CSV reports, catalogue). Analysing the module again recreates it. Your module, haks and game files are never touched.</p>
      ${(P.edits.files || P.build.files || P.descriptions.files || P.other.files) ? `<p class="small" style="margin-bottom:0"><b>Kept unless you tick them</b> (this is your work):</p>` : ""}
      ${opt("edits", "My edits", "Edited and new scripts, 2das and GFF files waiting to go into a build.")}
      ${opt("build", "Clean builds", "Built module folders, .mod files, lean haks, audits and their git history.")}
      ${opt("descriptions", "Descriptions, accepted issues, loaded server settings and database files", "Script descriptions (descriptions.json, batches), the issues you accepted as by design (accepted_issues.json), and the server settings and campaign database files you loaded (server_config.json, database.json).")}
      ${opt("other", "Other files", esc(P.other.items.slice(0, 6).join(", ")) + (P.other.items.length > 6 ? " …" : ""))}
      <div id="dConfirm" hidden><p class="small note warn">You ticked your own work. Type <b class="mono">${esc(name)}</b> to confirm.</p><input type="text" class="wide" id="dName" autocomplete="off"></div>
      <p class="small muted" id="dMsg"></p></div>
    <div class="bf row"><span class="grow small muted" id="dTotal"></span><button class="btn" id="dCancel">Cancel</button><button class="btn danger" id="dGo">Delete</button></div></div></div>`);
  const close = openModal(md, () => close(), $("#dCancel", md));
  const picked = () => [...md.querySelectorAll("[data-part]:checked")].map(x => x.dataset.part);
  const upd = () => { const p = picked(); $("#dConfirm", md).hidden = !p.length;
    $("#dTotal", md).textContent = "Frees " + fmtBytes(P.data.bytes + p.reduce((t, k) => t + P[k].bytes, 0));
    $("#dGo", md).disabled = p.length && $("#dName", md).value !== name; };
  md.querySelectorAll("[data-part]").forEach(x => x.onchange = upd); $("#dName", md).oninput = upd; upd();
  $("#dCancel", md).onclick = () => close();
  $("#dGo", md).onclick = async () => {
    $("#dGo", md).disabled = true; $("#dMsg", md).textContent = "Deleting…";
    try { const r = await post("/api/analysis/delete", {a: name, include: picked(), confirm: $("#dName", md).value});
      close();

// ---------------------------------------------------------------- help / manual (docs/MANUAL.md)
// Small Markdown renderer for the manual. The text is escaped first and only a few patterns become tags, so the
// manual cannot inject HTML. mdInline: code spans, bold and italic. Code spans are cut out first, so a * inside
// one (MOD_WEATHER_*) is never read as italics; "\*" outside code is a literal * (the manual writes "\*\*\*\*").
function mdInline(t){
  // code spans are swapped for numbered place-holders (\u0001n\u0002) while bold and italics are applied
  const codes = [];
  const out = esc(String(t).replace(/`([^`]+)`/g, (_, c) => "\u0001" + (codes.push(c) - 1) + "\u0002").replace(/\\\*/g, "\u0003"))
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  return out.replace(/\u0003/g, "*").replace(/\u0001(\d+)\u0002/g, (_, k) => `<code>${esc(codes[k])}</code>`);
}
// mdToHtml: headings (level 2 headings also go into the contents list), code blocks, tables, quotes, lists (one
// level of nesting), rules and paragraphs.
function mdToHtml(md){
  md = md.split("\n").filter(l => !/^\s*<!--\[\/?[A-Z-]+\]-->\s*$/.test(l)).join("\n").replace(/<!--\[[A-Z-]+\]-->/g, "");
  const L = md.replace(/\r/g, "").split("\n"), out = [], toc = [];
  let i = 0;
  while (i < L.length){
    const l = L[i];
    if (/^```/.test(l)){ const b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push(`<pre>${esc(b.join("\n"))}</pre>`); continue; }
    const hm = l.match(/^(#{1,4})\s+(.*)$/);
    if (hm){ const lvl = hm[1].length, id = "m-" + hm[2].toLowerCase().replace(/[^a-z0-9]+/g, "-");
      if (lvl === 2) toc.push(`<li><a class="nl" href="#" data-anchor="${id}">${mdInline(hm[2])}</a></li>`);
      out.push(`<h${lvl} id="${id}">${mdInline(hm[2])}</h${lvl}>`); i++; continue; }
    if (/^\|/.test(l)){ const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^[\s|:-]+$/.test(r)));
      out.push(`<div class="tw"><table><thead><tr>${cells(body[0]).map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>` +
        body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`); continue; }
    if (/^>\s?/.test(l)){ const b = []; while (i < L.length && /^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/, "")); out.push(`<blockquote>${mdInline(b.join(" "))}</blockquote>`); continue; }
    if (/^(-|\d+\.)\s+/.test(l)){ const ordered = /^\d+\./.test(l), items = [];
      while (i < L.length && (/^(-|\d+\.)\s+/.test(L[i]) || /^\s{2,}\S/.test(L[i]))){
        const x = L[i];
        if (!/^\s/.test(x)) items.push({t: x.replace(/^(-|\d+\.)\s+/, ""), sub: []});
        else if (/^\s+(-|\d+\.)\s+/.test(x)) items[items.length-1].sub.push(x.trim().replace(/^(-|\d+\.)\s+/, ""));
        else { const it = items[items.length-1]; if (it.sub.length) it.sub[it.sub.length-1] += " " + x.trim(); else it.t += " " + x.trim(); }
        i++; }
      out.push(`<${ordered?"ol":"ul"}>${items.map(x => `<li>${mdInline(x.t)}${x.sub.length ? `<ul>${x.sub.map(t => `<li>${mdInline(t)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</${ordered?"ol":"ul"}>`); continue; }
    if (/^---+$/.test(l)){ out.push("<hr>"); i++; continue; }
    if (!l.trim()){ i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#|```|\||>|-\s|\d+\.\s|---)/.test(L[i])) p.push(L[i++]);
    if (!p.length){ p.push(L[i++]); }
    out.push(`<p>${mdInline(p.join(" "))}</p>`);
  }
  const html = out.join("\n");
  return html.replace(/(<h1[^>]*>.*?<\/h1>)/, `$1<p class="small muted">Contents</p><ul class="toc">${toc.join("")}</ul>`);
}
